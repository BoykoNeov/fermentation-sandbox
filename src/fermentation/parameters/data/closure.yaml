# Closure oxygen ingress -- the OTR menu that decides oxidative vs reductive bottle aging
# (decision D-136)
#
# THE GAP THIS CLOSES, NAMED IN THE CODE BEFORE IT WAS FILLED. SotolonAldolCondensation's
# docstring (D-108) says it outright: "a *sealed* wine here has strictly zero O2 ingress (no
# closure permeation -- the same gap D-102 named for DMS leaving through the closure), so a sealed
# sulfited bottle never ages toward premox at all. That is the limitation to state." Every O2 sink
# on the aging axis (D-71 ethanol oxidation, D-72 sulfite, D-74 phenolic browning, D-75 Strecker,
# D-78 ellagitannin, D-79/D-80 condensation, D-81 anthocyanin fading, D-133 burst) drew on a FINITE
# dosed charge from `add_oxygen`. This file supplies the missing FLOW.
#
# THE TWO PRIMARIES. Both read as rendered PDF pages, not through a summarising fetch (the D-102
# lesson: a summarising fetch is a source of leads, never of constants).
#
#   P1. Lopes, P., Saucier, C., Teissedre, P.-L., & Glories, Y. (2007). "Main routes of oxygen
#       ingress through different closures into wine bottles." J. Agric. Food Chem. 55(13),
#       5167-5170. DOI 10.1021/jf0706023. Read via the authors' own trade reprint, "Oxygen
#       transmission through different closures into wine bottles", Practical Winery & Vineyard
#       July/August 2007, which prints the SAME experiment's Table I in full.
#       (The ACS copy is paywalled; the reprint is openly hosted at brocku.ca/ccovi. The D-123 /
#       D-135 lesson a third time: "paywalled" is a property of ONE HOST, not of the paper.)
#
#   P2. Oliveira, V., Lopes, P., Cabral, M., & Pereira, H. (2013). "Kinetics of oxygen ingress
#       into wine bottles closed with natural cork stoppers of different qualities."
#       Am. J. Enol. Vitic. 64(3), 395-399. DOI 10.5344/ajev.2013.13009. Open author deposit on
#       ResearchGate (uploaded by H. Pereira). Natural cork only, but 593 bottles of it.
#
# P1's Table I -- the whole menu below, in uL O2/day, transcribed verbatim:
#
#   Closure Type            | First month | Horizontal        | Vertical
#   Screw cap (tin liner)   | <500 [a]    | 0.2-0.7           | --
#   "Technical" corks       | 15-40       | 0.1-0.4           | 0.1-0.9
#   Natural corks           | 25-45       | 1.7-6.1[b] 0.1-2.3[c] | 0.5-4.4[b] 0.1-2.7[c]
#   Nomacorc synthetic      | 30-40       | 6                 | 8-9
#   SupremeCorq synthetic   | 35-45       | 11-15             | 11-12
#   [a] at moment of bottling  [b] 2-12 months  [c] 12-36 months (horiz.) / 12-28 (vert.)
#
# WHAT IS SHIPPED IS THE **STEADY** COLUMN, NOT THE FIRST MONTH -- AND THAT IS THE WHOLE DESIGN.
# Every closure's first-month rate is 10-150x its steady rate, and P2 quantifies how dominant that
# burst is: "35% of the overall ingress occurred in the first five days, 59% in the first month,
# and 78% in the first three months". It is NOT modelled here, and the reason is mechanistic, not
# convenient -- P2 identifies it as the CORK'S OWN trapped air decompressing, not atmospheric
# permeation: "The higher air pressure within the cells due to the compression of the stopper in
# the bottleneck certainly will increase ingress rates immediately after bottling[;] as oxygen
# ingress progresses, the pressure decreases and so the ingress rates, until reaching a rather
# constant value." A one-off release of a finite trapped charge is precisely what the D-71
# `add_oxygen` verb already expresses, and re-building it as a decaying pool would re-litigate
# D-133's burst-pool argument for no gain. So: this file is the STEADY permeation, `add_oxygen`
# is the bottling burst, and the two do not overlap. An author simulating a freshly bottled wine
# should dose BOTH.
#
# WHY ZERO-ORDER (a constant source, not a gradient-driven one). Both primaries measure ingress
# into a REDUCED INDIGO-CARMINE SOLUTION -- an O2-scavenging sink that holds dissolved O2 near
# zero, which is exactly what a consuming wine does. The ~atmospheric partial-pressure gradient is
# therefore already baked into every number below, and re-expressing the rate as proportional to
# (p_atm - p_wine) would double-count it AND require a headspace model the engine does not have.
# The constant form is also what P2 measured directly: "stabilizing a low and rather constant
# ingress rate from the third to twelfth months."
#
# THE UNIT CONVERSION IS THE AUTHORS' OWN, NOT AN IMPOSED ONE. P1's table is in uL O2/day; the
# model needs g/L/h. P2's Discussion quotes P1's group as "2.43 to 8.73 ug/day (1.7 to 6.1
# uL/day)" -- both ratios give 1.43 ug O2 per uL (2.43/1.7 = 1.4294; 8.73/6.1 = 1.4311), i.e. a
# molar volume of 22.4 L/mol, STP. That is NOT the 20 C of P1's own thermostat (which would give
# 24.06 L/mol -> 1.330 ug/uL, 7.5% lower). The authors' 1.43 is used anyway, deliberately, so the
# numbers below reproduce the published ug/day figures EXACTLY rather than silently disagreeing
# with both papers by 7.5%. The full conversion, applied identically to every value here:
#
#   g/L/h = (uL/day) * 1.43e-6 g/uL / 24 h/day / 0.750 L  =  (uL/day) * 7.9444e-8
#
# THE 750 mL IS A SCOPE DECISION, AND IT IS THE ONLY PLACE A VOLUME ENTERS. OTR is a flux through
# a STOPPER (mass/time), so it is volume-independent as published -- both primaries in fact used
# 375 mL bottles. Only the conversion to the engine's g/L needs a volume, and the standard 750 mL
# bottle is folded in HERE, at provenance time, so the engine stays volume-agnostic (it has no
# concept of container size; `batch_volume_liters` is FERMENTER volume for hop dosing and is
# deliberately NOT reused -- per-bottle ingress does not depend on how big the batch was).
# CONSEQUENCE, stated so it is never read as an oversight: **the aging model is a standard 750 mL
# bottle.** A magnum ages at half these concentration rates; a half-bottle at double. That is real
# chemistry (it is why large formats age more slowly) and it is NOT expressible here.
#
# TEMPERATURE-FLAT BY DECISION (the D-135 precedent). P1 ran at a controlled 20 +/- 1 C; P2 at
# uncontrolled room temperature (13.6-27.8 C). Neither resolves an OTR activation energy, and
# neither reports the same closure at two temperatures, so no Arrhenius term is fitted and none is
# shipped. The consequence has a sharper edge here than it did for D-135 and must be stated: since
# ingress is flat while every CONSUMER keeps its Arrhenius term, and (see below) the O2 endpoints
# go supply-limited, the total oxidative burden of a warm cellar is UNDER-predicted -- real warm
# storage oxidises faster partly BECAUSE the closure's OTR rises. Warm-storage predictions from
# this axis are lower bounds.
#
# THE ORDERING IS THE ROBUST CLAIM; THE MAGNITUDES ARE A BAND. The spread from technical cork to
# SupremeCorq is ~52x. But "THE ORDERING" IS THREE CLAIMS OF THREE DIFFERENT STRENGTHS, and this
# paragraph used to merge them and attribute all three to P1 "verbatim". Scoped in D-162, which
# measured each separately on 200k independent triangular draws of the bands below:
#
#   (1) P1's THREE-TIER grouping -- "low in screw-caps and 'technical' corks, intermediate in
#       conventional natural cork stoppers, and high in synthetic closures" -- IS P1's own
#       conclusion verbatim, and it is the claim that survives the bands: max(low) < natural <
#       min(synthetic) breaches only 2.4 % of joint draws. THIS is the robust one.
#   (2) technical_cork < screwcap is NOT in that sentence. It is read off P1's Table I NOMINALS
#       (0.25 vs 0.45 uL/day) and it is the folklore correction noted below. Under independent
#       draws of the two bands it INVERTS 40.7 % of the time. Kept, sourced and still asserted,
#       but it is a WITHIN-TIER refinement of P1's conclusion, not that conclusion. (This chain
#       was written `technical <= screwcap` here while both tests assert a strict `<`; the tests
#       are right -- Table I separates the nominals -- so the hedge is removed rather than the
#       assertion weakened.)
#       AND THE 40.7 % IS MOSTLY AN ARTEFACT OF HOW THE TWO BANDS WERE BUILT, not of the
#       measurements overlapping. `otr_technical_cork`'s high edge is deliberately P1's VERTICAL
#       ceiling (0.9 uL/day) so the band spans both orientations P1 measured; `otr_screwcap`'s
#       0.2-0.7 is HORIZONTAL ONLY, because P1's Table I prints "--" for screwcap vertical -- it
#       was never measured. The two bands are therefore not commensurable, and a joint draw pits
#       a two-orientation band against a one-orientation one. Measured like-for-like (technical
#       cork restricted to its horizontal window 0.1-0.4, everything else identical) the inversion
#       falls 40.7 % -> 4.7 %. This is NOT a licence to narrow the shipped band: spanning both
#       orientations is the right call for a parameter a user may store either way, and dropping
#       it would discard real measured range. It is a statement about what the 40.7 % means.
#   (3) Nomacorc < SupremeCorq is also not in that sentence (both are "synthetic"). It is robust
#       for a DIFFERENT reason than (1): these two bands do not overlap at all, so it never inverts.
#
# The 5-way strict chain the menu asserts therefore breaches 41.9 % of joint draws -- and 94.2 % of
# those breaches are (2) alone. THIS IS NOT A LIVE DEFECT, and D-162 re-measured why rather than
# inheriting the claim: `scenario.closure` resolves ONE otr_* into the `closure_otr` STATE SLOT at
# compile time and `simulate_ensemble` holds y0 fixed, so two otr_* values can never be co-resident
# in one run and the sampler cannot reach them at all -- forcing all five into the sampled set moves
# 0 of 94 state slots, against 54 of 94 for a live control. What the 41.9 % does say is a
# CROSS-ENSEMBLE property of the shipped bands: "which closure ages slower" could flip between two
# independently sampled ensembles, if anything ever drew them.
#
# AN ORDERING CORRECTION WORTH RECORDING, BECAUSE THE FOLKLORE SAYS OTHERWISE. It is widely
# repeated -- including in P2's own introduction, citing Godden et al. 2005 -- that "screwcaps were
# the closures least permeable to oxygen". P1's Table I says TECHNICAL CORK is lower at steady
# state (0.1-0.4 vs 0.2-0.7 uL/day). Both can be true at once, and P1 explains how: the screwcap's
# headline number is `<500 uL/day AT THE MOMENT OF BOTTLING` -- "the insertion of oxygen contained
# within the screw-cap in bottle headspace at the time of sealing" -- which dominates any
# comparison made on a total-including-burst basis, exactly the basis Godden used (a 36-month
# mean). Once the burst is separated out, as it is here, technical cork wins. The measured steady
# ordering is what ships.
#
# NOT SOURCED FROM, AND WHY. Dieval, Vidal & Aagaard (2011), Packaging Technol. Sci. 24:375-385,
# doi 10.1002/pts.945 -- the luminescence OTR method for co-extruded closures -- is Wiley-paywalled
# with only a ResearchGate "Request PDF" stub, and is NOT read; nothing here rests on it. Likewise
# Karbowiak et al. (2010) Crit. Rev. Food Sci. Nutr. 50:20-52 (a review, so secondary anyway) and
# the 2026 Science Advances mechanism paper (doi 10.1126/sciadv.aed3023, HTTP 403). Lopes et al.
# 2005 (JAFC 53:6967) and 2006 (JAFC 54:6741) reach this file ONLY through P1/P2's own quotation
# of them and are used solely as corroboration, never as a shipped value.
#
# TIER: ALL SPECULATIVE, and the reason is the same for every entry. The underlying measurements
# are real and replicated, but each shipped number is a SINGLE CONSTANT standing in for a rate that
# the sources report as a RANGE across stoppers of one type (natural cork's between-stopper
# coefficient of variation is 67% and 49% in P2 -- real heterogeneity in the bark, not measurement
# error), and flattening a wide empirical band to a point estimate is a modelling act, not a
# measurement. This mirrors D-135, where the measured reservoir LEVELS were tagged `plausible` and
# the RATES read off a regression were tagged `speculative`. Here everything is a rate.
#
# ENSEMBLE CAVEAT (the D-67 threshold note, same shape). These parameters seed a STATE SLOT at
# compile time rather than being read by the Process at each step, so `simulate_ensemble` -- which
# holds y0 fixed and samples only parameters -- will NOT propagate the OTR bands into the output
# spread. Identical in kind to `copper_typical` (D-134) and `bound_h2s_initial` (D-135), which seed
# state the same way. To explore OTR uncertainty, run the named closures as separate scenarios.

# -- HERMETIC: the measured zero, named rather than implied ---------------------------------
otr_hermetic:
  value: 0.0
  unit: "g/L/h"   # d(o2)/dt = +otr, a constant source
  tier: speculative
  uncertainty: { low: 0.0, high: 0.0, note: "exactly zero, with no band: this is the definitional no-ingress case, not an estimate of a small one. It is also the isolability gate (prime directive 3) -- ClosureOxygenIngress contributes byte-for-byte zero here, so a hermetic run is bit-identical to the whole pre-D-136 aging axis" }
  provenance:
    source: "Lopes et al. 2007 (P1), Results: of every sealing system tested over 36 months, 'only the control (bottle sealed by flame) was completely air-tight'. So a true zero-ingress closure is a MEASURED limiting case in the primary itself, not an idealisation invented here."
    conditions: "flame-sealed glass ampoule; 20 +/- 1 C, 36 months. No commercial closure achieves this."
    notes: "Named explicitly rather than left as the absence of a `closure` key, deliberately: the D-45 hard-zero lesson is that an unstated zero reads as an oversight while a NAMED zero reads as a choice. A scenario that wants no ingress should say `closure: hermetic` and mean it. This is also the one entry whose value is not a flattened band, which is why its uncertainty is degenerate rather than merely narrow."

# -- TECHNICAL CORK (agglomerated + natural discs: Twin Top, Neutrocork) ---------------------
otr_technical_cork:
  value: 1.99e-8
  unit: "g/L/h"
  tier: speculative
  uncertainty: { low: 7.94e-9, high: 7.15e-8, note: "low = P1's horizontal floor (0.1 uL/day); high = P1's VERTICAL ceiling (0.9 uL/day), taken rather than the horizontal 0.4 so the band spans both storage orientations P1 measured. => 0.17 mg/L/yr central, band 0.07-0.63" }
  provenance:
    source: "Lopes et al. 2007 (P1) Table I, 'Technical' corks (Twin Top and Neutrocork), horizontal storage after the first month: 0.1-0.4 uL/day. Central value 0.25 uL/day (band midpoint) * 7.9444e-8 = 1.99e-8 g/L/h. Corroborated by the paper's own text: 'Technical cork stoppers (Twin Top and Neutrocork) exhibited a low level of oxygen permeation (0.1 to 0.4 uL per day)'."
    conditions: "375 mL flint bottles, reduced indigo-carmine solution, 20 +/- 1 C, 65 +/- 1 % RH, 4 replicates, horizontal storage months 2-36; converted to a 750 mL bottle at 1.43 ug O2/uL (see the file header). Steady permeation only -- P1's first-month rate for this closure is 15-40 uL/day, 60-160x higher."
    notes: "THE LOWEST-INGRESS COMMERCIAL CLOSURE IN THE PRIMARY, below screwcap -- see the ordering-correction note in the file header before 'fixing' this. Corroborated independently by P2's introduction, which reports technical cork at 'low and constant rates 0.003 mg O2/month (2 to 36 months)' = 0.1 ug/day = 0.07 uL/day, at/below this band's floor and from a different experiment (Lopes et al. 2006). P1 also notes technical corks were 'essentially impermeable to atmospheric oxygen during the first 24 months'."

# -- SCREWCAP (saran-tin liner: Stelvin, Auscap, Cospak, CSA) --------------------------------
otr_screwcap:
  value: 3.58e-8
  unit: "g/L/h"
  tier: speculative
  uncertainty: { low: 1.59e-8, high: 5.56e-8, note: "P1's full printed range 0.2-0.7 uL/day. => 0.31 mg/L/yr central, band 0.18-0.49. NOTE P1's own text says '0.2 to 0.6 uL per day' where its Table I says 0.2-0.7 -- a genuine text/table mismatch in the source. The TABLE is taken as authoritative (the D-135 lesson: transcribing the table changed four numbers taken from the same paper's prose); the difference is well inside the band either way" }
  provenance:
    source: "Lopes et al. 2007 (P1) Table I, screw caps with saran-tin liners (Stelvin, Auscap, Cospak, CSA), horizontal storage after the first month: 0.2-0.7 uL/day, with the paper reporting 'no significant differences between manufacturers'. Central value 0.45 uL/day * 7.9444e-8 = 3.58e-8 g/L/h."
    conditions: "as otr_technical_cork (375 mL, indigo carmine, 20 C, 65 % RH); horizontal, 18 months for the screwcap arm. Converted to 750 mL at 1.43 ug O2/uL."
    notes: "THE FIRST-MONTH FIGURE IS NOT PERMEATION AND IS NOT MODELLED. P1 lists '<500 uL/day' for screwcaps in the first month, footnoted 'at moment of bottling' -- it is the air trapped in the cap's headspace at sealing, not transmission through the liner: 'The apparent entry of oxygen into wine bottles was substantially higher during bottling than in the following 18 months of storage. This appeared to be due to the insertion of oxygen contained within the screw-cap in bottle headspace at the time of sealing.' Dose it with `add_oxygen` if simulating a real bottling line. This one-off charge is why screwcap is often ranked the LEAST permeable closure on a total-including-burst basis while ranking above technical cork at steady state. P1 also links the low steady rate to the reductive risk this axis cannot yet show: 'too low oxygen ingress rates, as shown by screw-cap closures and glass ampoules, promotes the development of rubbery or struck flint sulfide-like aroma characters (post-bottling reduction)' -- in this model that appears as the ABSENCE of oxidative markers, not as extra sulfide (D-135 is release-only and reads no O2)."

# -- NATURAL CORK ---------------------------------------------------------------------------
otr_natural_cork:
  value: 1.19e-7
  unit: "g/L/h"
  tier: speculative
  uncertainty: { low: 7.94e-9, high: 4.85e-7, note: "0.1-6.1 uL/day: the union of P1's two natural-cork windows (1.7-6.1 at 2-12 months, 0.1-2.3 at 12-36). => 1.04 mg/L/yr central, band 0.07-4.25. This band is deliberately the widest of any closure and it is REAL between-stopper heterogeneity, not measurement scatter: P2 measured 593 bottles and found 12-month ingress spanning 0.3-4.8 mg with coefficients of variation of 67% and 49%, and attributes it to 'the natural differing features in the cell dimensions and air volume within the stopper's structure'" }
  provenance:
    source: "TWO INDEPENDENT PRIMARIES, cross-validated. P1 (Lopes et al. 2007) Table I, natural corks, horizontal: 1.7-6.1 uL/day over months 2-12 and 0.1-2.3 uL/day over months 12-36. P2 (Oliveira et al. 2013) Table 2 measured the same quantity directly in 593 bottles and reports a months-4-12 mean of 2.51 ug/day = 1.755 uL/day (per class: 0.76 / 1.38 / 2.41 ug/day for classes 1-3). The shipped 1.5 uL/day is the central value of the region where the two agree, * 7.9444e-8 = 1.19e-7 g/L/h."
    conditions: "45x24 mm (P1) and 45x24 mm (P2) natural cork; 375 mL bottles, indigo-carmine colorimetry; P1 at 20 +/- 1 C controlled, P2 at 13.6-27.8 C room. Steady permeation, months 4+ (P2) / months 2+ (P1). Converted to a 750 mL bottle at 1.43 ug O2/uL."
    notes: "THE CROSS-VALIDATION IS THE POINT: P2's independently measured 1.755 uL/day falls at the bottom edge of P1's 2-12 month band AND inside P1's 12-36 month band, from experiments with 4 and 593 replicates respectively. A THIRD FIGURE IS TENSION, NOT CORROBORATION, AND THIS SENTENCE USED TO SAY THE OPPOSITE (corrected at D-187, which re-read P2): Godden et al. 2005 (via P2's introduction) reports natural cork at a mean 9.33 mg O2/stopper/YEAR -- not the 1.60 mg/yr recorded here at D-136, which is P2's NEXT sentence and belongs to synthetic closures' first month (see otr_synthetic_nomacorc, where the same transposition ran the other way). 9.33 mg/yr = 25.6 ug/day, ~12x this entry's steady 2.14 ug/day, and the first-month burst CANNOT absorb the gap: burst + steady gives ~2.2 mg over year 1 against Godden's 9.33 (bottling_burst_natural_cork). The resolution is METHOD, and P1 states it against Godden by name: values from stoppers measured without liquid contact are 'substantially lower than the oxygen transmission rates and 1000-fold variation reported by other studies', because 'contact with liquid is an important factor in oxygen transmission through corks'. Godden is therefore excluded on method rather than reconciled on arithmetic. ONE NUMBER, NOT TWO: P1's 2-12 vs 12-36 month split (a further decline with age) is smaller than this band's width, so shipping two natural-cork constants would assert a resolution the data does not support. CAUTION on P1's prose: its text says ingress 'then rose gradually (0.1 to 2.3 uL per day)' where its own Table I shows the later window is LOWER than the earlier one. The table is taken as authoritative and the direction is a DECLINE; the prose sentence is treated as a slip, and is recorded here rather than smoothed over."

# -- SYNTHETIC, extruded (Nomacorc classic) --------------------------------------------------
otr_synthetic_nomacorc:
  value: 4.77e-7
  unit: "g/L/h"
  tier: speculative
  uncertainty: { low: 3.97e-7, high: 7.15e-7, note: "5-9 uL/day: P1 prints a single 6 for horizontal and 8-9 for vertical, so the band spans both orientations with a modest extension below the one horizontal point. => 4.18 mg/L/yr central, band 3.48-6.27 -- roughly 4x natural cork and 13x screwcap" }
  provenance:
    source: "Lopes et al. 2007 (P1) Table I, Nomacorc classic synthetic closure (43x22 mm), horizontal storage after the first month: 6 uL/day (vertical 8-9). 6 * 7.9444e-8 = 4.77e-7 g/L/h."
    conditions: "as the other P1 entries (375 mL, indigo carmine, 20 C, 65 % RH, 4 replicates). Converted to 750 mL at 1.43 ug O2/uL."
    notes: "P1: synthetic closures 'exhibited the highest oxygen permeation, reaching the limit of quantification for our method (2.5 mL of oxygen) within 140 and 290 days' (Nomacorc and SupremeCorq respectively) -- i.e. these closures ran the experiment off-scale, which is itself the finding. Unlike natural cork, Nomacorc was 'permeable to atmospheric oxygen, mainly AFTER the first month of storage', so for this closure the steady term is the dominant one rather than a tail. Corroborating direction from P2's introduction: synthetic stoppers were 'the least successful barriers to oxygen, reaching a mean oxygen ingress of 1.60 mg O2 in the first month' (Lopes et al. 2005). THAT NUMBER WAS RECORDED HERE AS 9.33 mg AT D-136 AND IS CORRECTED AT D-187: 9.33 is P2's PRECEDING sentence, Godden's natural-cork mg/stopper/YEAR (see otr_natural_cork). The repaired 1.60 mg is not a direction but a QUANTITATIVE cross-check, and it is the one this file's bottling-burst entries rest on: P1's own first-month column gives 1.50 mg/bottle for Nomacorc and 1.72 for SupremeCorq, so Lopes 2005's independently measured 1.60 for 'synthetic stoppers' falls BETWEEN the two closures it pools (bottling_burst_synthetic_nomacorc)."

# -- SYNTHETIC, injection-moulded (SupremeCorq) ----------------------------------------------
otr_synthetic_supremecorq:
  value: 1.03e-6
  unit: "g/L/h"
  tier: speculative
  uncertainty: { low: 8.74e-7, high: 1.19e-6, note: "P1's printed range 11-15 uL/day (horizontal; vertical 11-12 sits inside it). => 9.05 mg/L/yr central, band 7.66-10.45. The most permeable closure in the primary, ~52x otr_technical_cork -- that ratio, not either endpoint, is what this file is really asserting" }
  provenance:
    source: "Lopes et al. 2007 (P1) Table I, SupremeCorq 45 synthetic closure, horizontal storage after the first month: 11-15 uL/day (vertical 11-12). Central 13 uL/day * 7.9444e-8 = 1.03e-6 g/L/h."
    conditions: "as the other P1 entries (375 mL, indigo carmine, 20 C, 65 % RH, 4 replicates). Converted to 750 mL at 1.43 ug O2/uL."
    notes: "Kept as a SEPARATE entry from Nomacorc rather than lumped into one 'synthetic' value because P1 measures them a factor of ~2 apart -- larger than the gap between screwcap and natural cork -- so a single synthetic constant would erase a distinction the source actually resolves. At this rate a wine takes up ~45 mg/L of O2 over five years, which is why P1's Results link synthetic closures to 'wines with a high level of browning and high-oxidized aroma scores'."

# ============================================================================================
# THE BOTTLING BURST -- the ONE-OFF charge the closure's own trapped air releases (decision D-187)
# ============================================================================================
#
# WHAT THIS CLOSES. Everything above is the STEADY permeation, and the header says why the first
# month was excluded from it: "this file is the STEADY permeation, `add_oxygen` is the bottling
# burst, and the two do not overlap. An author simulating a freshly bottled wine should dose BOTH."
# That left the burst an author-supplied `add_oxygen` number with NO provenance -- the one oxygen
# input on the aging axis a user had to invent. D-136's own Next said it "could be a sourced
# auto-dose ... left out deliberately to keep the D-133 line clean, NOT for lack of data". This
# section is that data, from the same two primaries, read again rather than remembered.
#
# THE MECHANISM IS NOT PERMEATION, WHICH IS WHY IT IS A SEPARATE QUANTITY AND NOT A RATE.
# P1: "the important increase in color change during first month is likely to be due to oxygen
# within closures that diffuses out of the closure during compression." P2 measures the driver --
# "the high internal pressure (from 0.6 to 0.9 MPa) created when natural cork stoppers are
# compressed into the bottleneck could force air out of the cork structure" -- and sizes the
# reservoir: a 24x45 mm natural stopper is 20.4 mL of which 80-85% is air in the cell lumen,
# holding 4.9-5.2 mg (3.4-3.6 mL) of O2. The first month releases 27-29% of it. So this is a
# FINITE STOCK emptying, not a flow, and it is dosed as a bolus for exactly the reason D-136 gave
# for not modelling it: "a one-off release of a finite trapped charge is precisely what the D-71
# `add_oxygen` verb already expresses, and re-building it as a decaying pool would re-litigate
# D-133's burst-pool argument for no gain."
#
# THE ARITHMETIC, applied identically to every cylindrical entry below:
#
#   burst [uL]  = (P1 first-month rate [uL/day] - THIS FILE'S SHIPPED otr_<closure>) x 30 days
#   burst [g/L] = burst [uL] x 1.43e-6 g/uL / 0.750 L      (the header's conversion and scope)
#
# THE SUBTRACTION IS AN ANTI-DOUBLE-COUNT AND IT BINDS. P1's first-month column is the TOTAL
# ingress rate over month 1, which physically includes the steady permeation running underneath
# the burst -- and `ClosureOxygenIngress` is already integrating that steady term from the moment
# `begin_aging` fires. Dosing P1's first month unmodified would therefore count the steady share
# twice. It is not a rounding correction for the permeable closures: over 30 days the steady term
# is 1% of the first month for technical cork but 17% for Nomacorc and 32% for SupremeCorq.
# CONSEQUENCE, and it is why `seal_bottle` refuses to be scheduled before `begin_aging`: the
# subtraction assumes the steady Process is switched on across that first month. Seal the bottle at
# or after the aging boundary, which is also the only physically meaningful place to seal it.
#
# ONE SCOPE PER BAND. `value` and BOTH edges subtract the SAME shipped otr_<closure>, so the
# nominal is the exact midpoint of the band and the band's width is P1's printed first-month range
# and nothing else. The alternative -- subtracting the steady BAND's edges -- would mix P1's
# first-month scope with a steady band built to a different one (otr_natural_cork's value is drawn
# from the P1/P2 agreement region, not from P1's 1.7-6.1 window), and the nominal would then not be
# the midpoint of its own band. Every edge below is therefore PRINTED (P1 Table I, first-month
# column) shifted by one shipped constant; only bottling_burst_screwcap's low edge is CONSTRUCTED,
# and it says so.
#
# WHAT THE FIRST-MONTH COLUMN DOES *NOT* SAY. The four cylindrical bursts come out within
# 1.16-1.44 mg/bottle of each other while the steady rates they sit beside span ~52x. That is a
# statement ABOUT P1's TABLE, not a measured mechanism: its first-month ranges (15-40, 25-45,
# 30-40, 35-45 uL/day) overlap so heavily that they do not separate the closures the way its steady
# ranges do. It is consistent with P2's trapped-air mechanism -- every cylindrical closure is
# compressed into the same bottleneck and gives up a similar charge -- but this file does not claim
# the equality as a finding, and a source that resolved the four closures apart would not be in
# conflict with anything shipped here.
#
# THE BOTTLING LINE'S OWN OXYGEN IS DELIBERATELY *NOT* IN THESE NUMBERS. P2 measured it and
# removed it: "the value of 1.50 mg of oxygen (present in the bottle headspace due to the bottling
# process) was withdrawn from all measurements ... Therefore the oxygen ingress was set at zero at
# time 0" (its calibration section brackets it at 1.4 to 1.9 mg for a 375 mL bottle). P1's fill
# oxygen was negligible by design -- "less than 9 ug/L, measured by polarographic probe". So both
# primaries report a closure-attributable charge, and the two are commensurable. Headspace/filler
# oxygen is a property of the LINE, not of the closure: it belongs to `add_oxygen`, where the
# author states their own bottling practice, and folding a fixed 1.5 mg into every closure here
# would silently dose a line nobody described. THE ONE EXCEPTION IS THE SCREWCAP, where P1 says the
# charge IS headspace air -- see that entry.
#
# TIER: ALL SPECULATIVE, for the steady entries' reason plus one more. Each value flattens a wide
# empirical range to a point (P2 measured the same quantity across 593 bottles and found month-1
# ingress rates of 18.16 to 117.70 ug/day between its oxygen classes -- a 6.5x spread inside ONE
# closure type), and each is additionally an INTEGRAL of a month-average rate rather than a
# directly measured charge, except natural cork's, where P2 published the integral itself.

# -- HERMETIC: the measured zero again, and the isolability gate ------------------------------
bottling_burst_hermetic:
  value: 0.0
  unit: "g/L"   # a one-off dose onto `o2`, not a rate
  tier: speculative
  uncertainty: { low: 0.0, high: 0.0, note: "exactly zero, with no band, for the SAME reason as otr_hermetic: a flame-sealed ampoule has no compressed stopper to give up trapped air and no headspace inserted at sealing. This is the isolability gate for the verb (prime directive 3) -- a `seal_bottle` on a hermetic scenario doses byte-for-byte zero" }
  provenance:
    source: "Lopes et al. 2007 (P1), Results: of every sealing system tested, 'only the control (bottle sealed by flame) was completely air-tight'. The control shows no first-month step in Figure IA, which is the same observation that fixes otr_hermetic at zero."
    conditions: "flame-sealed glass ampoule; 20 +/- 1 C, 36 months. No commercial closure achieves this."
    notes: "Named rather than left as the absence of a key, the D-45 lesson: an unstated zero reads as an oversight, a named zero reads as a choice. Sealing a hermetic bottle is a legal, meaningful scenario -- it says 'this wine got nothing at bottling' with provenance, instead of saying it by omission."

# -- TECHNICAL CORK (agglomerated + natural discs: Twin Top, Neutrocork) ----------------------
bottling_burst_technical_cork:
  value: 1.56e-3
  unit: "g/L"
  tier: speculative
  uncertainty: { low: 8.44e-4, high: 2.27e-3, note: "P1's printed first-month range 15-40 uL/day, each edge less the shipped otr_technical_cork (0.25 uL/day) and integrated over 30 days => 442.5-1192.5 uL = 0.63-1.71 mg/bottle. Both edges PRINTED-shifted; nominal is their exact midpoint (817.5 uL = 1.17 mg/bottle)" }
  provenance:
    source: "Lopes et al. 2007 (P1) Table I, 'Technical' corks (Twin Top and Neutrocork), FIRST MONTH: 15-40 uL/day, against the same closure's 0.1-0.4 uL/day thereafter. Central 27.5 uL/day less the shipped steady 0.25 uL/day, x 30 d x 7.9444e-8 (g/L)/(uL/day) = 1.56e-3 g/L."
    conditions: "375 mL flint bottles, reduced indigo-carmine solution, 20 +/- 1 C, 65 +/- 1 % RH, 4 replicates; converted to a 750 mL bottle at 1.43 ug O2/uL (file header). The charge is per STOPPER, so the 750 mL scope divides it exactly as it divides the OTRs -- a magnum takes the same milligrams into twice the wine."
    notes: "THE RATIO THIS CLOSURE MAKES VIVID: a 60-160x first-month multiple over its own steady rate, the largest on the menu, because its steady permeation is the lowest. Under technical cork the bottling burst is ~8.9 YEARS of steady ingress arriving on day one (817.5 uL against 91 uL/year), so a technical-cork bottle that is never sealed with this verb is not merely missing a small term -- it is missing most of the oxygen it will see in a decade. The same ratio for SupremeCorq is ~0.2 years, which is the honest way to state the asymmetry: the burst is a first-order term for tight closures and a footnote for leaky ones. Sourced note: P1 records these stoppers as 'essentially impermeable to atmospheric oxygen during the first 24 months', which is a statement about permeation and is NOT contradicted by this charge -- the charge comes out of the cork, not through it."

# -- SCREWCAP: the one entry whose charge is HEADSPACE, and the one printed as a bound ---------
bottling_burst_screwcap:
  value: 9.53e-4
  unit: "g/L"
  tier: speculative
  uncertainty: { low: 0.0, high: 9.53e-4, note: "AN UPPER BOUND, NOT A CENTRAL ESTIMATE, AND THE ONLY ENTRY HERE THAT IS. P1 prints '<500' -- a ceiling with no floor -- so high = 500 uL is PRINTED and low = 0.0 is CONSTRUCTED (P1 gives no floor, and a well-sparged line approaches zero). `value` is the CEILING itself rather than the midpoint of [0, ceiling]: the source contains one number and a midpoint would invent a second. Consequence: this entry reads worst-case, and a scenario wanting a typical screwcap line should say so with `add_oxygen` instead" }
  provenance:
    source: "Lopes et al. 2007 (P1) Table I, screw caps (Stelvin, Auscap, Cospak, CSA), first month: '<500' uL, footnoted 'a at moment of bottling'. 500 uL x 1.43e-6 g/uL / 0.750 L = 9.53e-4 g/L."
    conditions: "as the other P1 entries (375 mL, indigo carmine, 20 C, 65 % RH, 4 replicates), horizontal, 18 months for the screwcap arm. Converted to 750 mL at 1.43 ug O2/uL."
    notes: "THIS IS NOT THE SAME MECHANISM AS THE CYLINDRICAL BURSTS, AND P1 SAYS SO: 'The apparent entry of oxygen into wine bottles was substantially higher during bottling than in the following 18 months of storage. This appeared to be due to the insertion of oxygen contained within the screw-cap in bottle headspace at the time of sealing.' A screwcap has no compressed body to give up trapped air; what it has is a headspace it seals over. That is why the file header's rule -- line/headspace oxygen belongs to `add_oxygen`, not here -- has its one exception exactly here: for a screwcap the headspace charge IS the closure's contribution. UNIT NOTE, and it is the reason this entry is not integrated over 30 days like its neighbours: P1's column is headed uL/day, but footnote [a] pins this cell to the MOMENT of bottling, so it is read as a one-off volume. Read the other way it would be 15000 uL -- ~21 mg into a 375 mL bottle -- which exceeds the oxygen in a plausible headspace several times over and is contradicted by P1's own Figure II, where the screwcap curves have not reached 0.5 mL after five months. THE ORDERING CONSEQUENCE, which runs the same way as the steady one: at 9.53e-4 this bound still sits BELOW every cylindrical closure's burst, so the folklore that screwcaps admit least oxygen holds for the first month even taken at its worst case -- the D-136 header's ordering correction is a STEADY-state claim and is not weakened here."

# -- NATURAL CORK: the entry where the second primary published the integral itself ------------
bottling_burst_natural_cork:
  value: 1.92e-3
  unit: "g/L"
  tier: speculative
  uncertainty: { low: 1.34e-3, high: 2.49e-3, note: "P1's printed first-month range 25-45 uL/day, each edge less the shipped otr_natural_cork (1.5 uL/day) over 30 days => 705-1305 uL = 1.01-1.87 mg/bottle. P2's independent month-1 figures land ALMOST but not entirely inside it, and the exception is recorded rather than smoothed: its Discussion average (1.43 mg/bottle) and its thicker-caliper mean (1.58 mg, n=467) fall inside, while its THINNER-caliper mean (0.97 mg) sits 3.5% BELOW the low edge (which is 1.005 mg/bottle). P2 attributes that gap to a real property P1 never varied -- 'cork planks with thinner caliper have a higher proportion of smaller cells with thicker cell walls, and less air-filled empty volume' -- so it is a variable this menu does not carry, not a disagreement about the same stopper. The band is NOT widened to P2's between-stopper spread (its oxygen classes run 0.55-3.53 mg over month 1) for the same reason otr_natural_cork ships one number: that spread is real heterogeneity, but it is heterogeneity a scenario expresses by choosing a closure, not by widening a band nothing draws from (the file's ENSEMBLE CAVEAT applies unchanged -- these seed a dose, not a sampled read)" }
  provenance:
    source: "TWO INDEPENDENT PRIMARIES MEASURING THE SAME MONTH, cross-validated. P1 (Lopes et al. 2007) Table I, natural corks, first month: 25-45 uL/day; central 35 less the shipped steady 1.5, x 30 d = 1005 uL = 1.44 mg/bottle => 1.92e-3 g/L. P2 (Oliveira et al. 2013) measured the first-month INTEGRAL directly in 593 bottles and reports it three ways: Table 1 caliper means of 0.97 and 1.58 mg at 1 month; a Discussion average of '27 to 29% (1.0 mL, or 1.43 mg)' of the stopper's own air; and a Table 2 all-class month-1 rate of 54.07 ug/day (= 1.62 mg over 30 d). P1's un-subtracted first-month total for the same quantity is 1.50 mg/bottle."
    conditions: "45x24 mm natural cork; 375 mL bottles, indigo-carmine colorimetry; P1 at 20 +/- 1 C controlled with 4 replicates, P2 at 13.6-27.8 C room with 593 bottles. P2's figures have the 1.50 mg bottling-headspace charge already deducted, and P1's fill oxygen was 'less than 9 ug/L', so the two are commensurable and neither carries line oxygen. Converted to a 750 mL bottle at 1.43 ug O2/uL."
    notes: "1.50 mg (P1, 4 replicates) vs 1.43 mg (P2, 593 bottles) is the closest agreement between these two experiments anywhere in this file -- 5%, on a quantity neither paper was primarily written to report. THE SHIPPED NUMBER IS P1'S, NOT A BLEND: P1 alone supplies a printed RANGE, so taking its midpoint keeps `value` and both edges on one scope (the header's ONE SCOPE PER BAND rule), and P2 then serves as the independent check the band must contain -- which it does, twice over. P2 also fixes what the charge IS: 27-29% of the 4.9-5.2 mg of O2 held in the stopper's own cell lumen, released by the 0.6-0.9 MPa the bottleneck compresses it to. SHAPE, STATED SO IT IS NEVER READ AS AN OVERSIGHT: P2 resolves the release over time -- '35% of the overall ingress of oxygen occurred in the first five days, 59% in the first month, and 78% in the first three months' -- while this parameter is dosed as an instantaneous bolus. The bolus therefore front-loads the charge by up to about a month against a source that could support a decaying pool. That is D-136's decision, not an unexamined default, and the alternative it declined is D-133's."

# -- SYNTHETIC, extruded (Nomacorc classic) --------------------------------------------------
bottling_burst_synthetic_nomacorc:
  value: 1.66e-3
  unit: "g/L"
  tier: speculative
  uncertainty: { low: 1.37e-3, high: 1.94e-3, note: "P1's printed first-month range 30-40 uL/day, each edge less the shipped otr_synthetic_nomacorc (6 uL/day) over 30 days => 720-1020 uL = 1.03-1.46 mg/bottle. The narrowest band on the menu, because P1's first-month range for this closure is the narrowest it prints" }
  provenance:
    source: "Lopes et al. 2007 (P1) Table I, Nomacorc classic (43x22 mm), first month: 30-40 uL/day. Central 35 less the shipped steady 6.0, x 30 d = 870 uL = 1.24 mg/bottle => 1.66e-3 g/L."
    conditions: "as the other P1 entries (375 mL, indigo carmine, 20 C, 65 % RH, 4 replicates). Converted to 750 mL at 1.43 ug O2/uL."
    notes: "THE INDEPENDENT CHECK ON THIS ENTRY IS A NUMBER THIS FILE HAD RECORDED WRONG UNTIL D-187. Lopes et al. 2005, via P2's introduction, measured synthetic stoppers at 'a mean oxygen ingress of 1.60 mg O2 in the first month'; D-136 transcribed that as 9.33 mg, which is P2's PRECEDING sentence -- Godden's natural-cork mg/stopper/YEAR (see otr_natural_cork, where the transposition ran the other way). Repaired, it is a real cross-check: P1's un-subtracted first-month totals are 1.50 mg/bottle for Nomacorc and 1.72 for SupremeCorq, and Lopes 2005's 1.60 for 'synthetic stoppers' -- a POOL of both -- falls between them, from a different experiment by the same group. THE STEADY SUBTRACTION MATTERS MOST HERE AND BELOW: 180 of this closure's 1050 first-month uL are steady permeation (17%), against 1% for technical cork, so dosing P1's column unmodified would double-count a sixth of the charge."

# -- SYNTHETIC, injection-moulded (SupremeCorq) ----------------------------------------------
bottling_burst_synthetic_supremecorq:
  value: 1.54e-3
  unit: "g/L"
  tier: speculative
  uncertainty: { low: 1.26e-3, high: 1.83e-3, note: "P1's printed first-month range 35-45 uL/day, each edge less the shipped otr_synthetic_supremecorq (13 uL/day) over 30 days => 660-960 uL = 0.94-1.37 mg/bottle" }
  provenance:
    source: "Lopes et al. 2007 (P1) Table I, SupremeCorq 45, first month: 35-45 uL/day -- the HIGHEST first-month rate on the menu. Central 40 less the shipped steady 13.0, x 30 d = 810 uL = 1.16 mg/bottle => 1.54e-3 g/L."
    conditions: "as the other P1 entries (375 mL, indigo carmine, 20 C, 65 % RH, 4 replicates). Converted to 750 mL at 1.43 ug O2/uL."
    notes: "THE MENU'S MOST PERMEABLE CLOSURE HAS ITS SMALLEST BURST, AND THE INVERSION IS THE ARITHMETIC WORKING, NOT AN ERROR: P1's highest first-month rate (35-45) minus the highest steady rate (11-15) leaves the smallest excess, because 390 of its 1200 first-month uL (32%) are steady permeation this file already meters continuously. What that says physically is that for SupremeCorq the first month is not dominated by a trapped-air release at all -- P1 records this closure, unlike natural cork, as 'permeable to atmospheric oxygen, mainly AFTER the first month of storage'. So the burst is the least of this closure's problems and its 9.05 mg/L/yr steady rate is the whole story; the ordering of the BURSTS is not the ordering of the closures, and nothing in this file asserts that it is."
