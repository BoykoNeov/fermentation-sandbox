    conditions: "12 degP malt-extract wort, 15 degC, 4 strains; numerator = day-7 minus day-0 acetic, denominator = this model's gross biomass formed on that wort at yan_mgl 200."
    notes: "THIS YIELD DOES NOT REPRODUCE THE PEAK AND IS NOT MEANT TO -- read the D-183 record before quoting it. It is anchored on the day-7 LEVEL (117.75 ppm, four-strain mean), so a modelled beer rises 59 -> 117.75 ppm by about day 3 and then holds. That is a MONOTONE curve, not the measured rise-then-fall: it cuts the shape error against Tyrell's own days 1-7 by ~38 % (RMSE 65.3 -> 40.7 ppm) by fixing WHEN the acid appears, and it delivers NO spike. BOTH THE DAY AND THE TWO RMSEs WERE RE-MEASURED AT D-212 -- they had been recorded against the growth rate D-211 retired, which was 2.88x too fast; this yield is growth-linked, so the plateau day moved 1 -> 3 and the pair moved 61.6 -> 65.3 and 32.5 -> 40.7. D-211 section 13's sweep for prose conditioned on the old growth rate missed this sentence, which is why it is dated here. The re-assimilation half that would deliver one was measured and REFUSED at D-183 -- Tyrell's decline cannot discriminate first-order from constant-rate (every fit gap is under the +-3 ppm read tolerance), cannot identify a floor (the mean's best fit is floor = 0 on the bound), and every law it IS consistent with makes the endpoint depend on the solver horizon (endpoint 108 / 65 / 20 / 0 ppm at days 7 / 14 / 30 / 400), which would make a modelled beer's pH a function of run duration. THE ENDPOINT'S SCENARIO DEPENDENCE MOVES FROM GRAVITY TO NITROGEN and that is a real consequence: at fixed gravity, YAN 120 -> 280 mg/L now moves finished acetic where the flux-linked form was flat. Neither direction is measured; the growth-linked one is at least the mechanism's own."

# ======================================================================================
# GROUP 3 — THE THREE WORT ACIDS THAT FALL, and their removal (decision D-181).
#
# THE SAME PAPER, THE SAME FOUR FERMENTS, THE SAME FIGURE-READ DISCIPLINE as group 2 — these
# are Figs 6 (pyruvic), 7 (oxalic) and 11 (formic) of the trials whose Figs 9/10/12/13/14 gave
# group 2 its yields. Read off the same archived crops, so the two groups cannot drift apart.
#
# ------------------------- WHY THEY ARE HERE AT ALL -------------------------
#
# D-180 built the four acids that RISE and closed with the resulting pH prediction explicitly
# held open by two omitted terms of OPPOSITE sign: this one (worth ~+0.2-0.3 pH of missing
# base) and dissolved CO2 (~-0.3 pH). Building only the CO2 half would have moved the headline
# to near-exact agreement while an uncorrected error still propped it up. This group builds the
# base half FIRST, and it makes the headline agree WORSE. That is the point, not a cost.
#
# ---------------------- THE SHAPE IS SOURCED, NOT ASSUMED ----------------------
#
# Tyrell's Table 2 classifies all three IDENTICALLY: '--' (strong decrease) at lower Krausen,
# '0' (no change) at high Krausen, '0' at Krausen collapse. So: a fast fall to a plateau within
# the first day, then nothing for the remaining six. That is what `WortAcidRemoval` implements
# --- first-order relaxation toward a MEASURED floor, temperature-flat.
#
# THE ARCHIVE'S DEFAULT IDIOM IS FLUX-LINKING AND IT IS WRONG HERE. A term riding the
# fermentative flux (X * S/(K+S), what OrganicAcidExcretion and every keto-acid Process use)
# peaks MID-ferment, because it is proportional to biomass. Table 2 says the decrease is over
# by high Krausen. Flux-linking would put the removal exactly where the source says there is
# none. Recorded so a later reader does not "restore" the house idiom.
#
# NO MECHANISM IS ASSERTED, because Tyrell assert none. Yeast uptake, calcium-oxalate
# precipitation and adsorption onto cell walls are all plausible and the paper distinguishes
# none of them; it reports only that the acids leave. The three slots are therefore OFF EVERY
# LEDGER (the iso_alpha precedent: exogenous, carbon-bearing, adsorptively removed, weighted
# nowhere) rather than routed to a metabolic destination the source does not support. The
# omission that buys: ~19 mg C/L of malt carbon per litre is untracked, against ~33 g C/L on
# the ledger --- 0.06 %, stated rather than hidden.
#
# ------------------------- TWO CONFLICTS, NOT SMOOTHED -------------------------
#
# 1. PYRUVIC'S DIRECTION IS SCALE-DEPENDENT WITHIN THIS ONE PAPER. Tyrell 3.1, laboratory
#    scale: pyruvic INCREASES (maxima to 300 ppm, strain 10), and they write "The described
#    reassimilation of pyruvic acids and its metabolization to acetic acid was not confirmed by
#    trial set-up". Tyrell 3.2, the EBC tubes used here: strong DECREASE. They name the cause
#    themselves --- higher oxygen intake, higher temperature and lower hydrostatic pressure at
#    lab scale --- and say it hits acetic, formic, oxalic and pyruvic hardest. This file adopts
#    the EBC direction because it is the same dataset group 2's yields came from, so the two
#    halves of beer's acid model at least describe ONE ferment. It is a SIGN conflict on a
#    modelled quantity, not a caveat, and a scenario at lab-scale conditions is outside what
#    these numbers describe.
#
# 2. FORMIC'S CITATION CONTRADICTS ITS OWN DATA. Tyrell 1.5 cites Pueschner et al. [14]:
#    citric, fumaric and formic "basically depend on concentrations of wort", i.e. raw-material
#    determined and inert. Their own Fig 11 shows formic falling 26 -> 3.5-6 ppm within a day
#    and their own Table 2 scores it '--'. The measurement is used and the citation is recorded
#    as contradicted --- note that the SAME sentence is what makes citrate inert in group 2, so
#    this is one sentence believed for one acid and disbelieved for another, on the strength of
#    the authors' own figures in both cases.
#
# --------------------------- WHAT THE BANDS MEAN ---------------------------
#
# Seeds: READ TOLERANCE ONLY (+-0.5 ppm on 5 ppm gridlines) --- one wort, measured once, all
# four strains superimposed at day 0. NOT a between-wort band; group 2's header explains why
# that spread is unquantifiable from this source.
#
# Floors: BOTH EDGES ARE A NAMED STRAIN'S OWN MEASURED DAY-7 VALUE; the nominal is the
# four-strain mean and is AUTHOR-CONSTRUCTED. Real biological spread, not read uncertainty.

