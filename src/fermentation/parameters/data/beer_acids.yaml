# -- The lumped peptide/polypeptide buffer capacity -----------------------------
#
# THE ONE PARAMETER THAT CARRIES BEER'S ACTUAL BUFFERING, and the one with the weakest
# provenance. Read the pKa_peptide_buffer notes in acidbase.yaml alongside this.
#
# HOW IT WAS OBTAINED (not a guess, not a fit to this model's own output): the capacity is
# BACK-SOLVED so that this engine's charge balance reproduces a PUBLISHED wort buffering
# capacity, BC = 1.18, measured by Peyer's own protocol (375 uL of 1 M HCl into 25 mL, BC =
# log10[ H+ added / H+ increase ]) on top of the organic acids above. That is the D-18
# inverse-anchoring shape one level up: absorb an unknown into a single term back-solved from
# a measurement, and claim predicted CHANGES rather than the absolute.
#
# RE-ANCHORED AGAIN AT D-181 -- 1.6708 -> 1.5481 g/L, -7.34 %. Same protocol, same BC = 1.18
# target, third acid table: D-181 puts three more acids (pyruvic, formic, oxalic) in the wort,
# and a capacity back-solved on a composition the model no longer has would reproduce nothing.
# The re-anchor is FORCED by the seed change, exactly as D-180's was.
#
# ITS SIGN WAS PRE-REGISTERED AND IT WORKS AGAINST THIS BEAT TOO, in the opposite direction to
# D-180's: three more wort acids buffer some of the titration themselves, so LESS peptide is
# needed to reach BC = 1.18, so beer is LESS buffered and the predicted pH drop gets LARGER --
# partially OFFSETTING the base that D-181 adds. Measured apart from the acids themselves
# rather than bundled with them [[feedback-pair-the-red-with-an-ordering-preserving-baseline]].
#
# CONTROL: re-running this back-solve on the FIVE-acid wort table reproduces D-180's
# 1.6707620638415932 BITWISE, so the -7.34 % is the acid table's doing and not the harness's.
#
# RE-ANCHORED AT D-180 -- 1.5125 -> 1.6708 g/L, +10.5 %. NOT a re-fit and not a correction of
# arithmetic: the identical back-solve, run over the WORT acid table (group 2) instead of the
# FINISHED-BEER one. Peyer's BC = 1.18 is a measurement ON WORT, so fitting it on top of beer's
# acids was mismatch #3 of the three this block already admitted to, and D-180 is the first
# moment a wort acid table existed to close it. One of the three stacked mismatches is
# therefore GONE; the other two (below) stand.
#
# ITS EFFECT IS SMALL AND WAS MEASURED SEPARATELY, not bundled with the seed change it shipped
# beside: more buffering means LESS acidification, so it works AGAINST the beat's headline. On
# the D-180 reference ferment the predicted pH drop is 0.6361 at the old capacity and 0.6165 at
# the new one -- the re-anchor costs 0.020 pH units, ~3 % of the drop. Measuring the two changes
# apart is what makes the headline attributable [[feedback-pair-the-red-with-an-ordering-preserving-baseline]].
#
# WHY IT IS WELL-CONDITIONED: across the whole sourced pKa window the back-solve barely moves
# -- on the wort table, 11.87 mM at pKa 3.86, 11.36 at 4.25, 11.55 at 4.50, a 4.5 % spread
# (it was 10.75 / 10.28 / 10.45 on the beer table). The capacity is fixed by the MEASUREMENT,
# not by the assumption, and that stays true under the D-180 re-anchor.
#
# WHY IT IS STILL SPECULATIVE -- two stacked mismatches (was three; D-180 closed one):
#   1. THE FIT IS BLIND TO THE FRAME THAT BINDS. It is anchored at wort pH 5.5. At BEER's pH
#      4.4 the identical fitted solutions give BC from 0.32 to 0.59 depending on where in the
#      pKa window the pKa sits -- a factor of ~1.9 that the fit does not constrain at all.
#      D-180 makes this WORSE, not better, and that must be said plainly: a static beer sat at
#      one pH, so the un-constrained factor applied at one point. A D-180 beer TRAVERSES from
#      wort pH 5.5-5.65 down to ~4.9-5.1, so the term is now asked to buffer correctly across
#      the entire span, which is precisely the job it was never validated for
#      [[feedback-validate-calibrations-in-the-frame-that-binds]]. It is also why the peptide
#      pKa -- not any acid yield -- is the parameter that MOVES the predicted pH drop most
#      at fixed yields (0.514 to 0.744 pH units across its band, i.e. 63-92 % of the measured
#      0.8125). Over the JOINT band with the four sampled yields it is 41-105 %; see D-180.
#   2. 1.18 IS WORT, NOT BEER. No published BC for finished beer was found at any host.
#   3. CLOSED AT D-180. The acid table fitted alongside was BEER's, against a WORT measurement;
#      it is now the wort table. Kept in the list, struck through rather than deleted, so that
#      a reader of the D-179 record can see what happened to it.
# So this is a well-conditioned back-solve against a target that is still mismatched in pH but
# no longer in composition -- a weaker and different claim from "beer's peptide buffer is
# 11.4 mM".
#
# WHY THIS BAND IS PINNED ZERO-WIDTH, AND WHY THAT IS THE HONEST CHOICE RATHER THAN A DODGE:
#
# The capacity and the pKa are NOT INDEPENDENT. The capacity is a FUNCTION of the pKa via the
# back-solve -- each assumed pKa has exactly one capacity that reproduces BC = 1.18 (3.86 ->
# 11.87 mM, 4.25 -> 11.36, 4.50 -> 11.55). The ensemble sampler draws every banded parameter
# independently, so giving BOTH a band would generate pairs like (pKa 3.86, capacity 10.28)
# that reproduce NO measurement at all -- a wider reported spread built out of combinations
# the calibration excludes. Banding the free variable and pinning the derived one is the only
# coherent option the machinery allows.
#
# It is also what the measurement says: across the whole sourced pKa window the back-solved
# capacity moves by 5%, while the buffering index it implies AT BEER'S pH moves by a factor of
# ~1.9. The capacity is fixed by the measurement; the pKa is the thing genuinely unconstrained.
# So the consequential band rides pKa_peptide_buffer (acidbase.yaml) and this is pinned.
#
# A pinned value takes no hypercube dimension and consumes no randomness (ensemble.py's
# zero-width short-circuit), so this pin does NOT narrow the reported beer spread -- the pKa
# band still moves it. Do not "restore" a band here without also making the pair sample jointly.
peptide_buffer_capacity_beer:
  value: 1.5480662315921656
  unit: "g/L"
  tier: speculative
  uncertainty: { low: 1.5480662315921656, high: 1.5480662315921656, note: "PINNED zero-width, and deliberately -- see the block above. The capacity is DERIVED from pKa_peptide_buffer by the back-solve, not independently uncertain, so its uncertainty is carried by that pKa's band instead of duplicated here. The value is the 10.52 mM that pairs with the nominal pKa 4.25 on the EIGHT-acid wort table (D-181), converted at glutamate's 147.13 g/mol. Carried at FULL PRECISION on purpose: it is a root of the back-solve, and a rounded copy would make the BC = 1.18 round-trip test pass only to a tolerance rather than exactly (the D-154 '663 vs 662.802522' lesson)." }
  provenance:
    source: "Back-solved against the published wort buffering capacity BC = 1.18 reported by Peyer, L. (2017), PhD thesis, University College Cork, CORA handle 10468/4694, sections 5.3.4 (the BC definition and titration protocol) and 5.4.3 / abstract (the measured values: 0.94 at mash-in, 1.18 control wort, 1.21 post-boil, 1.24 with added protease, 1.34 max over the proteolytic rest)."
    conditions: "back-solved at wort pH 5.5 on top of ALL EIGHT *_typical_wort organic acids above (decision D-181; five of them at D-180, the finished-beer table before that), using Peyer's own fast-BC protocol reproduced on this engine's charge balance. Applied from wort pH down through beer pH (~4.9-5.2), which SPANS rather than sits at the pH it was fitted at."
    notes: "tier=SPECULATIVE for the two remaining stacked mismatches in the header block, the first of which is the decisive one and which D-180 made harder rather than easier: solved at one pH, now asked to buffer across a traverse [[feedback-validate-calibrations-in-the-frame-that-binds]]. Represented as glutamate-equivalent monoprotic buffering SITES (see M_GLUTAMIC in core/chemistry.py), off every ledger -- beer's protein is untracked as carbon and nitrogen alike, so this pool perturbs no conservation sum. It is also the parameter that makes beer's pH tier speculative; acidbase.ph_tier is scoped per medium (D-179) so that this does not drag WINE's pH tier down for a pool wine does not carry. Since D-180 it is additionally the single parameter the predicted pH DROP is most sensitive to -- 0.514 to 0.744 units across pKa_peptide_buffer's band at nominal yields, and 41-105 % of the measured drop over the JOINT band with the four sampled yields -- so a test of that drop must be built to the joint band, never to this nominal."
