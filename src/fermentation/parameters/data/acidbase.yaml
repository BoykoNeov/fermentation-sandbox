# Acid dissociation constants for the wine pH charge-balance solver (decision D-18).
#
# SHARED, medium-agnostic parameter file: loaded alongside the <medium>_<strain>.yaml
# by the compile seam (the store merges paths; these pKa names are collision-free with
# the kinetic parameters). It holds only the pKa set the proton/charge-balance solver
# (fermentation.core.acidbase) needs; the ionic product of water Kw is an in-code
# physical constant (like GAS_CONSTANT), not an empirical parameter.
#
# VALUES: standard thermodynamic pKa at 25 C, zero ionic strength (CRC Handbook of
# Chemistry and Physics; corroborated by Boulton et al., Principles and Practices of
# Winemaking, and the wine-chemistry literature). These are textbook acid constants.
#
# TIER = plausible (NOT validated), uniformly. The pKa MEASUREMENTS are validated
# science, but applying 25 C / I=0 constants to real wine (ionic strength I ~ 0.05-0.1 M,
# 10-30 C) is an extrapolation: the concentration-based *apparent* pKa is the standard
# plausible-tier simplification, and inverse anchoring (the back-solved strong cation)
# folds the activity-coefficient error into the fitted cation at t=0 so it affects only
# the buffer-capacity SLOPE, where we claim only directional fidelity. Per decision D-18
# the derived pH/TA tier is computed EXPLICITLY (acidbase.ph_tier) as the lowest of these
# pKa tiers floored at plausible, so pH never inherits a VALIDATED default.
#
# Acetic acid (pKa 4.76) is folded into the succinic-equivalent Byp read for now (the Byp
# pool is lumped organic acids/polyols); add a separate `acetic` species only if Byp is
# later speciated.

# -- Tartaric acid, C4H6O6 (diprotic) — the dominant grape acid -----------------
pKa_tartaric_1:
  value: 3.04
  unit: "pH units"
  tier: plausible
  uncertainty: { low: 2.9, high: 3.2, note: "thermodynamic pKa1 at 25 C, I=0; apparent value in wine shifts with ionic strength" }
  provenance:
    source: "CRC Handbook of Chemistry and Physics (ionization constants of organic acids); Boulton et al., Principles and Practices of Winemaking"
    conditions: "25 C, zero ionic strength (thermodynamic pKa); applied to wine as an apparent constant (decision D-18)"
    notes: "First dissociation of tartaric (2,3-dihydroxybutanedioic) acid, the principal grape acid. pKa1 ~ must pH, so tartaric buffers hardest near pitch — the reason the strong-cation term is mandatory (weak acids alone give pH ~2.3 at ~33 mM, real must ~3.3)."

pKa_tartaric_2:
  value: 4.37
  unit: "pH units"
  tier: plausible
  uncertainty: { low: 4.2, high: 4.5, note: "thermodynamic pKa2 at 25 C, I=0" }
  provenance:
    source: "CRC Handbook of Chemistry and Physics; Boulton et al., Principles and Practices of Winemaking"
    conditions: "25 C, zero ionic strength; applied to wine as an apparent constant (decision D-18)"
    notes: "Second dissociation of tartaric acid. The HT-/T2- equilibrium governs bitartrate (KHT) chemistry; carried here for the charge balance, relevant to a future cold-stabilization Process."

# -- L-malic acid, C4H6O5 (diprotic) — the MLF substrate ------------------------
pKa_malic_1:
  value: 3.40
  unit: "pH units"
  tier: plausible
  uncertainty: { low: 3.3, high: 3.5, note: "thermodynamic pKa1 at 25 C, I=0" }
  provenance:
    source: "CRC Handbook of Chemistry and Physics; Boulton et al., Principles and Practices of Winemaking"
    conditions: "25 C, zero ionic strength; applied to wine as an apparent constant (decision D-18)"
    notes: "First dissociation of L-malic (2-hydroxybutanedioic) acid. pKa1 sits right at must pH, so malic buffers strongly there — the reason malolactic fermentation (diprotic malic -> monoprotic lactic) raises pH appreciably (the D-18 headline coupling)."

pKa_malic_2:
  value: 5.11
  unit: "pH units"
  tier: plausible
  uncertainty: { low: 5.0, high: 5.2, note: "thermodynamic pKa2 at 25 C, I=0" }
  provenance:
    source: "CRC Handbook of Chemistry and Physics; Boulton et al., Principles and Practices of Winemaking"
    conditions: "25 C, zero ionic strength; applied to wine as an apparent constant (decision D-18)"
    notes: "Second dissociation of L-malic acid. Above must pH, so the second proton is mostly bound at wine pH; it still contributes to the diprotic charge term that MLF removes."

# -- L-lactic acid, C3H6O3 (monoprotic) — the MLF product ----------------------
pKa_lactic:
  value: 3.86
  unit: "pH units"
  tier: plausible
  uncertainty: { low: 3.7, high: 4.0, note: "thermodynamic pKa at 25 C, I=0" }
  provenance:
    source: "CRC Handbook of Chemistry and Physics; Boulton et al., Principles and Practices of Winemaking"
    conditions: "25 C, zero ionic strength; applied to wine as an apparent constant (decision D-18)"
    notes: "Lactic (2-hydroxypropanoic) acid is MONOPROTIC and weaker than malic's first proton, so converting diprotic malic to monoprotic lactic both removes a dissociable proton and softens the acid — why MLF deacidifies (pH up ~0.1-0.3). The softer perceived acidity at fixed pH is a separate sensory effect, not modelled here."

# -- Succinic acid, C4H6O4 (diprotic) — the Byp-pool representative -------------
pKa_succinic_1:
  value: 4.21
  unit: "pH units"
  tier: plausible
  uncertainty: { low: 4.1, high: 4.3, note: "thermodynamic pKa1 at 25 C, I=0" }
  provenance:
    source: "CRC Handbook of Chemistry and Physics; Boulton et al., Principles and Practices of Winemaking"
    conditions: "25 C, zero ionic strength; applied to wine as an apparent constant (decision D-18)"
    notes: "First dissociation of succinic (butanedioic) acid, the representative species the lumped `Byp` minor-byproduct pool is carbon-accounted as (D-16). The charge balance READS the existing Byp pool through these pKas (include-by-reading, D-18 coupling #2): zero new carbon, so total_carbon is unchanged and the former double-count is closed."

pKa_succinic_2:
  value: 5.64
  unit: "pH units"
  tier: plausible
  uncertainty: { low: 5.5, high: 5.8, note: "thermodynamic pKa2 at 25 C, I=0" }
  provenance:
    source: "CRC Handbook of Chemistry and Physics; Boulton et al., Principles and Practices of Winemaking"
    conditions: "25 C, zero ionic strength; applied to wine as an apparent constant (decision D-18)"
    notes: "Second dissociation of succinic acid. Mostly bound at wine pH. CAVEAT (D-18): Byp also lumps neutral 2,3-butanediol, so reading the whole pool as a diprotic acid slightly OVERSTATES its acid charge (~1-1.5 mM vs the ~20 mM buffer) — a documented minor approximation."

# == BEER's charge-active acids (decision D-179) ================================
#
# The pKas of the acids in BEER_ACIDS that wine does not already supply. Beer shares
# lactic / malic / succinic with the entries above (same molecules, same constants), so
# only acetic, citric and the lumped peptide buffer are new here.
#
# NOTE the acetic comment at the head of this file ("folded into the succinic-equivalent
# Byp read for now; add a separate `acetic` species only if Byp is later speciated"). That
# is still true OF WINE and is not contradicted here: beer gets its own `acetic` STATE slot
# because beer's acetic is a measured dosed input, while wine's remains inside the Byp lump.
# Wine's charge balance does not read pKa_acetic — the acid registries are per-medium.

# -- Acetic acid, C2H4O2 (monoprotic) — beer's volatile acid --------------------
pKa_acetic:
  value: 4.756
  unit: "pH units"
  tier: plausible
  uncertainty: { low: 4.74, high: 4.78, note: "thermodynamic pKa at 25 C, I=0; the textbook value is quoted 4.74-4.78 across sources" }
  provenance:
    source: "CRC Handbook of Chemistry and Physics (ionization constants of organic acids)"
    conditions: "25 C, zero ionic strength (thermodynamic pKa); applied to beer as an apparent constant (decision D-179, the D-18 simplification)"
    notes: "Acetic (ethanoic) acid. Its pKa sits INSIDE beer's pH window (~4.0-4.6), so unlike phosphate it is a genuine buffer there — but it is a minor one by concentration (measured: 0.012 of the 0.110 organic-acid buffering index). Wine folds acetic into the Byp succinic-equivalent lump instead (see this file's header), so this constant is read by BEER only."

# -- Citric acid, C6H8O7 (TRIPROTIC) — the n-protic branch's reason to exist ----
#
# Peyer 2017 (PhD thesis, UCC, CORA 10468/4694) sec 5.5, quoting Li et al. 2016 and Coote &
# Kirsop 1976: "The majority of BC is provided by peptides and polypeptides containing these
# amino acids as well as organic acids (e.g. citrate)." Citrate is NAMED by the source.
#
# Two of its three pKas (3.128 and 4.761) sit inside beer's own pH window, which is what makes
# it a real buffer there -- and what makes it the first shipped acid to reach the general
# n-protic speciation branch added in D-178. Contrast phosphate (2.15 / 7.20 / 12.35), the acid
# that beat was opened on: also triprotic, but with every pKa FAR from beer's pH, so its charge
# is ~0.99 flat across pH 4.0-4.6 and an inverse-anchored cation absorbs it entirely.
pKa_citric_1:
  value: 3.128
  unit: "pH units"
  tier: plausible
  uncertainty: { low: 3.09, high: 3.15, note: "thermodynamic pKa1 at 25 C, I=0; apparent value in beer shifts with ionic strength" }
  provenance:
    source: "CRC Handbook of Chemistry and Physics (ionization constants of organic acids)"
    conditions: "25 C, zero ionic strength (thermodynamic pKa); applied to beer as an apparent constant (decision D-179)"
    notes: "First dissociation of citric (2-hydroxypropane-1,2,3-tricarboxylic) acid. Sits just BELOW beer's pH window, so the first proton is largely off across the whole window and this step contributes buffering at the acidic edge."

pKa_citric_2:
  value: 4.761
  unit: "pH units"
  tier: plausible
  uncertainty: { low: 4.73, high: 4.78, note: "thermodynamic pKa2 at 25 C, I=0" }
  provenance:
    source: "CRC Handbook of Chemistry and Physics (ionization constants of organic acids)"
    conditions: "25 C, zero ionic strength (thermodynamic pKa); applied to beer as an apparent constant (decision D-179)"
    notes: "Second dissociation of citric acid, and the load-bearing one: at 4.761 it sits essentially ON beer's pH window (~4.0-4.6), which is where buffering is maximal. This is why citrate outweighs its concentration share — measured, citric is the SECOND-largest organic-acid contributor to beer's buffering index (0.024 of 0.110) despite lactic being present at comparable levels."

pKa_citric_3:
  value: 6.396
  unit: "pH units"
  tier: plausible
  uncertainty: { low: 6.37, high: 6.42, note: "thermodynamic pKa3 at 25 C, I=0; well above beer pH so the third proton is mostly bound there" }
  provenance:
    source: "CRC Handbook of Chemistry and Physics (ionization constants of organic acids)"
    conditions: "25 C, zero ionic strength (thermodynamic pKa); applied to beer as an apparent constant (decision D-179)"
    notes: "Third dissociation of citric acid. Well above beer's pH, so the third proton is largely bound there and contributes little buffering — but it is carried so the speciation is exact across the full [0, 14] solver bracket, exactly as pKa_sulfurous_2 is (see D-22). Its presence is what makes citrate a THREE-pKa acid and therefore the first user of the n-protic branch."

# ==============================================================================
# THE THREE FALLING WORT ACIDS (decision D-181) — pyruvic, formic, oxalic.
#
# These are NOT a fourth flavour of beer acid: they are the same charge-active organic acids
# as the block above, added because beer's model needed to be able to LOSE their anion charge.
# Tyrell 2013's EBC-tube trials measure all three falling steeply within a day of pitching
# (pyruvic 22 -> ~1.3, formic 26 -> ~4.75, oxalic 22 -> ~5.6 mg/L) and then flat. Until D-181
# none was a beer state slot, so the model's acidification was ONE-SIDED — sized at D-180 as
# roughly +0.2-0.3 pH of missing base and named there as the larger half of why the predicted
# pH agreed as well as it did.
#
# WHY THE pKa VALUES BARELY MATTER HERE, AND WHY THEY ARE STILL CARRIED PROPERLY.
# Two of the three (pyruvic 2.45, oxalic-1 1.25) sit 2-3 units BELOW anything a beer reaches,
# so those protons are off across the whole trajectory and the acid carries a near-flat charge.
# That is the same geometry D-178 used to REJECT malt phosphate — but the conclusion inverts,
# and the reason is worth stating because it looks like a contradiction and is not. Phosphate
# was rejected as a BUFFER: a species whose charge is flat contributes almost no dpH/dC, and an
# inverse-anchored cation absorbs a constant charge outright. These acids are not proposed as
# buffers. They are proposed as charge that LEAVES: a fully dissociated acid carries its full
# -1 (or -2), so removing it removes the maximum possible anion charge per mole. Flat charge is
# precisely what makes the effect large, where for a buffer it is what makes it nil.
#
# So the pH prediction is insensitive to how the protons are distributed and sensitive to how
# much acid is REMOVED. The bands below are still the honest textbook spreads.
#
# MEASURED, NOT REASONED (D-181 amendment). The first draft of this block said pKa_oxalic_2 was
# "the one pKa the prediction is sensitive to", because at 4.20 it sits inside the pH range a
# real beer traverses. Run over its whole band, it moves the predicted drop by 0.027 percentage
# points, and pKa_pyruvic's whole band by 0.001. ALL FOUR are consequence-free, and the reason
# the argument failed is worth more than the correction: THIS model's beer only reaches pH 5.24,
# not the real 4.78-4.90, so oxalate never descends to within a unit of pKa2 and stays nearly
# fully dissociated throughout. The claim was written about the BEVERAGE and tested against the
# MODEL. It follows that these constants become consequential exactly when the model starts
# acidifying properly -- i.e. when dissolved CO2 lands (D-181 sec 14) -- so re-measure then
# rather than trusting this note [[feedback-conceded-caveats-are-not-coverage]].
# ==============================================================================

# -- Pyruvic acid, C3H4O3 (monoprotic) -----------------------------------------
#
# THE SAME MOLECULE AS WINE'S `pyruvate` STATE POOL, and deliberately a DIFFERENT state slot
# (`pyruvic`, beer-only). Wine's is a dynamic excreted-overflow keto-acid pool that binds SO2
# (D-49/D-51); beer's is a malt-derived wort input that is removed early. D-179 declined to
# ship it partly on that collision; D-181 ships it under a distinct name with the collision
# stated rather than dissolved. If beer ever wires the keto-acid overflow Processes, the two
# pools MUST be reconciled before both are charge-active, or one molecule is counted twice.
pKa_pyruvic:
  value: 2.45
  unit: "pH units"
  tier: plausible
  uncertainty: { low: 2.39, high: 2.50, note: "thermodynamic pKa at 25 C, I=0. The band spans the textbook spread rather than a measurement spread: sources quote 2.39, 2.45 and 2.50 for the same constant. CONSEQUENCE-FREE, and MEASURED to be so rather than argued: swept edge to edge through the shipped charge balance, the whole band moves the predicted pH drop by 0.001 percentage points (0.508394 -> 0.508404 of the measured drop). 2.39 and 2.50 are both >2 units below any pH a modelled beer reaches, so the acid is >99.9% dissociated at either edge." }
  provenance:
    source: "CRC Handbook of Chemistry and Physics (ionization constants of organic acids)"
    conditions: "25 C, zero ionic strength (thermodynamic pKa); applied to beer as an apparent constant (decision D-181, the D-18 simplification)"
    notes: "Pyruvic (2-oxopropanoic) acid. Read by BEER only: wine carries the same molecule as the `pyruvate` overflow pool, which is deliberately NOT charge-active (it is an SO2 binder and a carbon pool, D-49). One molecule, two media, two roles, two slots — see the block header."

# -- Formic acid, CH2O2 (monoprotic) -------------------------------------------
pKa_formic:
  value: 3.75
  unit: "pH units"
  tier: plausible
  uncertainty: { low: 3.74, high: 3.77, note: "thermodynamic pKa at 25 C, I=0; quoted 3.74-3.77 across sources" }
  provenance:
    source: "CRC Handbook of Chemistry and Physics (ionization constants of organic acids)"
    conditions: "25 C, zero ionic strength (thermodynamic pKa); applied to beer as an apparent constant (decision D-181)"
    notes: "Formic (methanoic) acid, the strongest of the simple carboxylic acids and the lightest at 46.03 g/mol. Its pKa sits just BELOW a fermenting beer's range, so it is ~90-98% dissociated across the traverse: the acid whose removal costs the most charge per milligram in this beat."

# -- Oxalic acid, C2H2O4 (DIPROTIC) --------------------------------------------
pKa_oxalic_1:
  value: 1.26
  unit: "pH units"
  tier: plausible
  uncertainty: { low: 1.25, high: 1.27, note: "A DESCRIBED SPREAD, NOT TWO ATTRIBUTED DIGITS -- the pKa_acetic idiom in this file. The constant is quoted 1.25-1.27 across sources; only the 1.25 is attributable to a reference I hold, so the band states the spread and the source field names the one book rather than assigning an edge to an unnamed tabulation (the D-167 standard: a source field claiming a parameter-specific published span is exactly what this archive audits). The nominal is the band midpoint and is AUTHOR-CONSTRUCTED. Consequence-free like pKa_pyruvic: 3+ units below any modelled beer pH, so the first proton is off everywhere on the trajectory and either edge gives the same charge." }
  provenance:
    source: "CRC Handbook of Chemistry and Physics (ionization constants of organic acids)"
    conditions: "25 C, zero ionic strength (thermodynamic pKa); applied to beer as an apparent constant (decision D-181)"
    notes: "First dissociation of oxalic (ethanedioic) acid — the strongest dicarboxylic acid. Carried so the speciation is exact across the full [0, 14] solver bracket, not because beer ever visits this pH."

pKa_oxalic_2:
  value: 4.203
  unit: "pH units"
  tier: plausible
  uncertainty: { low: 4.14, high: 4.266, note: "A DESCRIBED SPREAD, NOT TWO ATTRIBUTED DIGITS (see pKa_oxalic_1 for the same reasoning). The constant is quoted 4.14-4.27 across sources — a real 0.13-unit disagreement rather than a rounding — and only the 4.14 is attributable to a reference I hold, so the band states the spread and the source field names that one book. The nominal is the band midpoint and is AUTHOR-CONSTRUCTED. PREDICTED TO BE THE CONSEQUENTIAL ONE AND MEASURED NOT TO BE (D-181 amendment): the whole band moves the predicted pH drop by 0.027 percentage points, because THIS model only traverses to pH 5.24 and oxalate therefore stays nearly fully dissociated at both edges. See the block header -- the argument was made about a real beer and tested against the model, and it should start biting once the model acidifies properly." }
  provenance:
    source: "CRC Handbook of Chemistry and Physics (ionization constants of organic acids)"
    conditions: "25 C, zero ionic strength (thermodynamic pKa); applied to beer as an apparent constant (decision D-181)"
    notes: "Second dissociation of oxalic acid. It sits inside the window a REAL beer traverses (4.78-4.90), which is why it was expected to be load-bearing -- but this model finishes at 5.24, so oxalate's mean charge barely moves and its removal is close to a flat 2 eq/mol after all. Measured, not assumed; see the uncertainty note. D-180's pre-registration used the bare 4.14, which is why a corrected arm B is not bit-identical to that file's."

# -- The lumped peptide/polypeptide buffer (monoprotic site) — decision D-179 ----
#
# WHAT ACTUALLY BUFFERS BEER. Peyer 2017 sec 5.5 (after Li et al. 2016) puts FREE amino acids
# at only ~10% of wort's buffering capacity -- "little contribution ... is made by aspartate
# (pKa 3.86), glutamic acid (pKa 4.25) and histidine (pKa 6.04)" -- and attributes the majority
# to "peptides and polypeptides containing these amino acids as well as organic acids". Sec 5.5
# corroborates mechanistically: boiling drops BC 1.34 -> 1.21 "likely due to the coagulation and
# precipitation of buffering high-molecular proteins and minerals as hot trub".
#
# So this is ONE lumped pool of buffering SITES with ONE effective pKa, not an amino-acid model.
# The pKa is the side-chain carboxyl of the residues the source names; the value is glutamate's
# and the BAND spans the sourced window (aspartate 3.86 to 4.50).
pKa_peptide_buffer:
  value: 4.25
  unit: "pH units"
  tier: speculative
  uncertainty: { low: 3.86, high: 4.50, note: "the SOURCED residue window: aspartate 3.86 and glutamic acid 4.25 are the two side-chain pKas Peyer names as beer-relevant; 4.50 is the upper edge over which the back-solved capacity stays stable (10.75 / 10.28 / 10.45 mM, a 5% spread). Both edges PRINTED-derived; the band is NOT a symmetric guess around the nominal." }
  provenance:
    source: "Peyer, L. (2017), 'Lactic acid bacteria fermentation of wort as a tool to add functionality in malting, brewing and novel beverages', PhD thesis, University College Cork, CORA handle 10468/4694, section 5.5 (published as Peyer et al. 2017, J. Inst. Brew. 123(4)) -- quoting Li et al. 2016 and Coote & Kirsop 1976 for the residue pKas and the peptide attribution."
    conditions: "wort/beer, 25 C; an EFFECTIVE (lumped) constant standing for the side-chain carboxyls of Asp/Glu residues borne on peptides and polypeptides, not a measured constant of any single species."
    notes: "tier=SPECULATIVE, and deliberately so -- this is a lumped stand-in for a protein population, not a measured molecular constant, and it is the one parameter that makes beer's pH tier speculative (acidbase.ph_tier is scoped per medium at D-179 precisely so this does NOT drag wine's pH tier down for an acid wine does not carry). THE HONEST LIMITATION: the capacity that pairs with this pKa was back-solved against a published WORT titration at pH 5.5, where the fit is well-conditioned; at BEER's pH 4.4 the identical fitted solutions give a buffering index from 0.32 to 0.59 across this band -- a factor of ~1.9. The calibration frame is not the frame that binds, which is why the pairing ships as a band and never as a nominal."

# -- Sulfurous acid, H2SO3 / SO2.H2O (diprotic) — the free-SO2 speciation set ----
#
# READOUT-ONLY (decision D-22). Unlike the acids above, these pKas are NOT in the
# pH-solver's acid set (acidbase.PKA_PARAM_NAMES / build_pka_map) and are NOT read by
# titratable_acidity. They are read only by the molecular-SO2 readout (acidbase.
# molecular_so2 / molecular_so2_fraction), which solves pH from the organic acids and
# then partitions the dosed free SO2 into molecular / bisulfite / sulfite at that pH.
# Free SO2's own (minor) back-reaction on pH — bisulfite is a charge-active anion — is a
# scoped omission for beat 1 (the inverse anchoring would absorb it into the fitted
# cation at t=0 anyway, so the t=0 molecular-SO2 number is identical with or without it;
# see D-22). OIV titratable acidity explicitly EXCLUDES sulfurous (and carbonic) acid,
# which the readout-only design gives for free. Add to the charge balance later via an
# `extra_acids` map if a mid-ferment SO2 addition event is built.
pKa_sulfurous_1:
  value: 1.81
  unit: "pH units"
  tier: plausible
  uncertainty: { low: 1.77, high: 1.86, note: "effective wine value; literature 1.77-1.86 at cellar T / ionic strength" }
  provenance:
    source: "Usseglio-Tomasset & Bosia (1984), Bull. OIV; carried in Boulton et al., Principles and Practices of Winemaking, and Ribereau-Gayon et al., Handbook of Enology Vol. 1"
    conditions: "wine-relevant temperature/ionic strength; applied as an apparent constant (decision D-22)"
    notes: "First dissociation SO2.H2O <-> H+ + HSO3-. THE load-bearing constant: the molecular (undissociated SO2.H2O) fraction of free SO2 is 1/(1 + 10^(pH - pKa1)), and molecular SO2 is the antimicrobial species. With pKa1 ~ 1.81 the molecular fraction falls ~3x per 0.5 pH unit (~6% at pH 3.0, ~2% at pH 3.5, ~0.6% at pH 4.0) — the pH coupling the D-18 charge-balance keystone was built to make emerge. ~0.8 mg/L molecular (the microbial-stability target) needs ~40 mg/L free at pH 3.5."

pKa_sulfurous_2:
  value: 7.20
  unit: "pH units"
  tier: plausible
  uncertainty: { low: 6.9, high: 7.3, note: "thermodynamic pKa2; well above wine pH so sulfite is negligible there" }
  provenance:
    source: "CRC Handbook of Chemistry and Physics; Usseglio-Tomasset & Bosia (1984); Boulton et al., Principles and Practices of Winemaking"
    conditions: "25 C; applied as an apparent constant (decision D-22)"
    notes: "Second dissociation HSO3- <-> H+ + SO3(2-). Far above wine pH (3-4), so the sulfite fraction is negligible (~1e-4) and the diprotic molecular fraction h^2/D reduces to the monoprotic 1/(1 + 10^(pH - pKa1)) there. Carried for an exact speciation and so the readout is correct up to the pH-8.2 TA endpoint, where sulfite IS partly formed — the reason excluding SO2 from titratable_acidity is load-bearing, not cosmetic (D-22)."

# -- Carbonyl-bisulfite binding: the free/bound SO2 split (decisions D-28, D-51) -
#
# Now that acetaldehyde exists as real state (decision D-27), the dosed SO2 slot is
# reinterpreted as TOTAL SO2 (conserved, inert) and the free/bound split is DERIVED at
# the solved pH by the binding equilibrium (acidbase.bound_so2 / free_so2 / speciate_so2):
#
#     CH3CHO + HSO3-  <->  CH3CH(OH)SO3-      K = [free acetaldehyde][HSO3-] / [adduct]
#
# referenced to BISULFITE (the reactive nucleophile), so pH enters via the bisulfite
# fraction of free SO2. Free = total - bound; molecular = free * neutral_fraction(pH), so
# D-22's molecular-SO2 readout survives unchanged at acetaldehyde = 0 (total == free).
#
# D-51 GENERALIZES this to a COUPLED MULTI-CARBONYL equilibrium: acetaldehyde is not the
# only bisulfite binder in real wine — the excreted keto-acid pools pyruvate (D-49) and
# alpha-ketoglutarate (D-50) compete for the SAME shared bisulfite pool. All three carbonyls
# now solve ONE equilibrium (acidbase.bound_so2_molar, a competitive-Langmuir partition over
# a single reactive-bisulfite root, N=1 reduces EXACTLY to the original D-28 quadratic).
# READOUT-ONLY, like D-22/D-28: the split does not add new state or touch conservation. The
# live consumers are the MLF antimicrobial gate (free-molecular SO2, D-28) and the
# acetaldehyde-reduction ADH protection (D-47) — the latter now reads a SMALLER
# acetaldehyde-bound share than the single-carbonyl D-28/D-47 form, because pyruvate/alpha-KG
# now soak up some of the dosed SO2 too.
K_acetaldehyde_so2:
  value: 1.5e-6
  unit: "mol/L"
  tier: plausible
  uncertainty: { low: 2.0e-7, high: 2.1e-6, note: "order-of-magnitude literature scatter: apparent Kd 1.5e-6 (pH 3.3) - 2.06e-6 (pH 3.5); Blouin's ~0.04% free acetaldehyde at 30 mg/L free SO2 implies ~2e-7. Wide band spans both." }
  provenance:
    source: "Burroughs & Sparks (1973), Sulphite-binding power of wines and ciders (the canonical carbonyl-bisulphite dissociation constants); apparent Kd 1.5e-6 (pH 3.3) - 2.06e-6 (pH 3.5) reported across the wine literature (e.g. Food Chemistry 2020, doi 10.1016/j.foodchem.2020.127173; AJEV 76:0760008, 2025); Blouin (1966) via SciELO S2224-79042018000200001. CORROBORATED (decision D-130) by Barbe et al. (2000), J. Agric. Food Chem. 48:3413-3419, which re-anchors this same acetaldehyde/pyruvate/2-oxoglutarate Kd set (from Blouin / Burroughs & Sparks) while measuring the additional botrytis carbonyls; and by Ribéreau-Gayon et al., Handbook of Enology Vol. 1 §8.4 (Table 8.5)."
    conditions: "wine, ~pH 3.3-3.5, cellar temperature; apparent (concentration-based) dissociation constant"
    notes: "Dissociation constant of the acetaldehyde-hydroxysulphonate adduct, the strongest carbonyl-SO2 bond in wine (acetaldehyde is the principal SO2 binder). REFERENCED TO BISULFITE HSO3- (the reactive species), so the binding solver uses [HSO3-] = free_SO2 * bisulfite_fraction(pH) and pH enters the equilibrium mechanistically. The literature apparent constants are usually quoted per TOTAL free SO2 at a stated pH; at wine pH bisulfite is ~0.94-0.99 of free SO2, so the bisulfite-vs-total-free basis differs by <=5% (well inside the order-of-magnitude band). tier=plausible: measured constants applied to wine as apparent values, with a wide band. SCOPE (pre-D-51): acetaldehyde-only binder — real bound SO2 also sits on pyruvate / alpha-ketoglutarate / sugars; D-51 adds the two keto-acid binders below to the SAME equilibrium (sugars remain unmodelled, so the 'total' slot is still a slight overclaim on the name, now smaller)."

# -- Pyruvate-bisulfite binding (decision D-51) -- the second-strongest carbonyl binder --
#
# Pyruvate (CH3-CO-COOH) + HSO3- <-> its alpha-hydroxysulphonate adduct, the SAME 1:1
# equilibrium form as acetaldehyde, referenced to bisulfite for the SAME reason. Roughly
# 370x WEAKER than acetaldehyde (Kd two orders of magnitude larger), consistent with
# pyruvate binding SO2 far less avidly per mole -- but its excreted-overflow pool (D-49,
# nominal ~30 mg/L residual) is persistent and measured, so it still competes materially
# for the shared bisulfite pool at typical dosed-SO2 concentrations (verified: captures a
# double-digit percent share of total SO2 at a 50 mg/L dose alongside alpha-KG, D-51).
K_pyruvate_so2:
  value: 5.55e-4
  unit: "mol/L"
  tier: plausible
  uncertainty: { low: 1.5e-4, high: 2.0e-3, note: "Burroughs & Sparks report 5.55e-4 at pH 3.3; a later secondary review rounds pyruvate's Kd to ~2e-4 mol/L, order-of-magnitude consistent. Band spans both plus apparent-pKa pH drift across the wine range (3.3-3.8, same drift acetaldehyde's band carries)." }
  provenance:
    source: "Burroughs & Sparks (1973), Sulphite-binding power of wines and ciders I: equilibrium constants for the dissociation of carbonyl bisulphite compounds (J. Sci. Food Agric. 24:187-198) -- apparent Kd 5.55e-4 mol/L at pH 3.3, the same canonical source as K_acetaldehyde_so2 (a direct cross-check: that paper's acetaldehyde value 1.5e-6 matches this codebase's independently-sourced K_acetaldehyde_so2 exactly). CORROBORATED (decision D-130) by Barbe et al. (2000), J. Agric. Food Chem. 48:3413-3419, and the Handbook of Enology Vol. 1 §8.4 Kd set."
    conditions: "wine, ~pH 3.3, cellar temperature; apparent (concentration-based) dissociation constant, referenced to bisulfite HSO3- like K_acetaldehyde_so2"
    notes: "Second-strongest carbonyl-SO2 binder in wine after acetaldehyde (Jackowetz & Mira de Orduna 2013). Competes with acetaldehyde and alpha-ketoglutarate for the SAME shared bisulfite pool in the D-51 multi-carbonyl equilibrium (acidbase.bound_so2_molar) -- a competitive-Langmuir partition, NOT an independent binding (three carbonyls cannot each claim the same free SO2). tier=plausible: a measured constant applied to wine as an apparent value, banded for pH-drift and the secondary-source scatter."

# -- Alpha-ketoglutarate-bisulfite binding (decision D-51) -- the third carbonyl binder --
#
# Alpha-ketoglutarate (2-oxoglutaric acid) + HSO3- <-> its adduct, the SAME 1:1 form.
# Roughly 93x weaker than acetaldehyde but slightly STRONGER than pyruvate (smaller Kd),
# so per mole it is the second-most-avid binder even though its excreted pool (D-50,
# nominal ~20 mg/L residual) is smaller than pyruvate's.
K_alpha_kg_so2:
  value: 1.4e-4
  unit: "mol/L"
  tier: plausible
  uncertainty: { low: 4.0e-5, high: 5.0e-4, note: "Burroughs & Sparks report 1.4e-4 at pH 3.3; a later secondary review rounds oxoglutaric acid's Kd to ~5e-4 mol/L, order-of-magnitude consistent (the wider end of this band covers it). Band also spans the same apparent-pKa pH-drift margin as the other two binding constants." }
  provenance:
    source: "Burroughs & Sparks (1973), Sulphite-binding power of wines and ciders I (J. Sci. Food Agric. 24:187-198) -- apparent Kd 1.4e-4 mol/L at pH 3.3 for 2-ketoglutaric acid, the same canonical source and cross-checked acetaldehyde value as K_pyruvate_so2. CORROBORATED (decision D-130) by Barbe et al. (2000), J. Agric. Food Chem. 48:3413-3419, and the Handbook of Enology Vol. 1 §8.4 Kd set."
    conditions: "wine, ~pH 3.3, cellar temperature; apparent (concentration-based) dissociation constant, referenced to bisulfite HSO3- like K_acetaldehyde_so2"
    notes: "Third carbonyl-SO2 binder in the D-51 multi-carbonyl equilibrium, sharing the same bisulfite pool as acetaldehyde and pyruvate (acidbase.bound_so2_molar). tier=plausible: a measured constant applied to wine as an apparent value, banded for pH-drift and secondary-source scatter."

# -- 5-Oxofructose-bisulfite binding (decision D-130) -- the dominant BOTRYTIS carbonyl binder --
#
# 5-Oxofructose (5-keto-fructose, C6H10O6) + HSO3- <-> its alpha-hydroxysulphonate adduct, the
# SAME 1:1 equilibrium form as the three yeast carbonyls above, referenced to bisulfite for the
# SAME reason. It is a hexodiulose that Botrytis cinerea (and acetic-acid bacteria) form ON THE
# BERRY by oxidising must fructose -- so it enters the model as a MUST-COMPOSITION INPUT (the
# `oxofructose` slot, scenario key `oxofructose_mgl`), never a fermentation product, and is
# INERT (no Process touches it). Its defining trait (Handbook Vol 1 sec 8.4 via Barbe 2000):
# "concentrations are not altered by alcoholic fermentation" -- unlike the transient
# dihydroxyacetone (reduced by yeast during AF, no longer a factor in finished wine, and so
# DELIBERATELY NOT MODELLED here), 5-oxofructose PERSISTS unchanged into the bottle and dominates
# a botrytized wine's high SO2-combining power. At Kd 3.3e-4 mol/L it is a strong binder (~4x
# weaker than acetaldehyde but comparable to alpha-KG), so a ~100 mg/L botrytis load binds a
# large share of a typical SO2 dose -- reproducing the sourced "4-78% of all SO2 combinations"
# that Barbe attributes to it, and collapsing free/molecular SO2 (which opens the MLF/Brett
# antimicrobial gates: a botrytized must needs a higher SO2 dose for the same protection).
# GLUCONOLACTONE (the other persistent botrytis binder Barbe names) is DEFERRED, not modelled:
# its Kd (4.2 mM, Handbook Table 8.5) does not reconcile with its own sourced binding point
# (100 mg/L -> 21.6 mg/L bound SO2, Bertrand & Guillou 1999; Langmuir predicts ~4x less), and
# what botrytis musts actually MEASURE is gluconic acid, mostly NOT the lactone that binds -- the
# gluconic-acid <-> lactone split is unsourced. Blocked on sourcing (the D-121 pattern), not refused.
K_5_oxofructose_so2:
  value: 3.3e-4
  unit: "mol/L"
  tier: plausible
  uncertainty: { low: 1.0e-4, high: 1.0e-3, note: "Burroughs & Sparks (1973b) report ~0.33 mM; band spans the same apparent-pKa pH-drift margin (wine pH 3.3-3.8) as the three yeast-carbonyl binding constants plus reasonable measurement scatter for this less-studied compound." }
  provenance:
    source: "Burroughs & Sparks (1973b), Sulphite-binding power of wines and ciders II, apparent Kd ~0.33 mM for 5-oxofructose (keto-5-fructose), as compiled by Barbe et al. (2000), J. Agric. Food Chem. 48:3413-3419 and Ribereau-Gayon et al., Handbook of Enology Vol. 1 sec 8.4 (Table 8.7)."
    conditions: "wine, ~pH 3.3, cellar temperature; apparent (concentration-based) dissociation constant, referenced to bisulfite HSO3- like the three yeast-carbonyl constants above."
    notes: "The dominant botrytis-specific carbonyl-SO2 binder (decision D-130), added to the SAME shared-bisulfite competitive-Langmuir equilibrium as acetaldehyde/pyruvate/alpha-KG (acidbase.bound_so2_molar). Enters via the inert `oxofructose` must-input slot (default 0 -> byte-for-byte the D-51 3-carbonyl form; a non-botrytis wine is unchanged). Typical botrytized-must LOAD is ~80-150 mg/L (Barbe 2000/2002; Handbook Vol 1: '5-oxofructose content frequently of the order of 100 mg/l in wines made from botrytized grapes'), set per-scenario via oxofructose_mgl -- the load is sourced (a measured range), not an author estimate. tier=plausible: measured Kd + measured load applied to wine as apparent values; the SO2-collapse OUTCOME is the sourced-robust claim (Barbe's 4-78%-of-combinations), the exact per-run split rides the load."
