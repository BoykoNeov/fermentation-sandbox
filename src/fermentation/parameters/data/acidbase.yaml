# Acid dissociation constants for the wine pH charge-balance solver (decision D-18).
#
# SHARED, medium-agnostic parameter file: loaded alongside the <medium>_<strain>.yaml
# by the compile seam (the store merges paths; these pKa names are collision-free with
# the kinetic parameters). It holds only the pKa set the proton/charge-balance solver
# (fermentation.core.acidbase) needs; the ionic product of water Kw is an in-code
# physical constant (like GAS_CONSTANT), not an empirical parameter.
#
# VALUES: standard thermodynamic pKa at 25 C, zero ionic strength (CRC Handbook of
# Chemistry and Physics; corroborated by Boulton et al., Principles and Practices of
# Winemaking, and the wine-chemistry literature). These are textbook acid constants.
#
# TIER = plausible (NOT validated), uniformly. The pKa MEASUREMENTS are validated
# science, but applying 25 C / I=0 constants to real wine (ionic strength I ~ 0.05-0.1 M,
# 10-30 C) is an extrapolation: the concentration-based *apparent* pKa is the standard
# plausible-tier simplification, and inverse anchoring (the back-solved strong cation)
# folds the activity-coefficient error into the fitted cation at t=0 so it affects only
# the buffer-capacity SLOPE, where we claim only directional fidelity. Per decision D-18
# the derived pH/TA tier is computed EXPLICITLY (acidbase.ph_tier) as the lowest of these
# pKa tiers floored at plausible, so pH never inherits a VALIDATED default.
#
# Acetic acid (pKa 4.76) is folded into the succinic-equivalent Byp read for now (the Byp
# pool is lumped organic acids/polyols); add a separate `acetic` species only if Byp is
# later speciated.

# -- Tartaric acid, C4H6O6 (diprotic) — the dominant grape acid -----------------
pKa_tartaric_1:
  value: 3.04
  unit: "pH units"
  tier: plausible
  uncertainty: { low: 2.9, high: 3.2, note: "thermodynamic pKa1 at 25 C, I=0; apparent value in wine shifts with ionic strength" }
  provenance:
    source: "CRC Handbook of Chemistry and Physics (ionization constants of organic acids); Boulton et al., Principles and Practices of Winemaking"
    conditions: "25 C, zero ionic strength (thermodynamic pKa); applied to wine as an apparent constant (decision D-18)"
    notes: "First dissociation of tartaric (2,3-dihydroxybutanedioic) acid, the principal grape acid. pKa1 ~ must pH, so tartaric buffers hardest near pitch — the reason the strong-cation term is mandatory (weak acids alone give pH ~2.3 at ~33 mM, real must ~3.3)."

pKa_tartaric_2:
  value: 4.37
  unit: "pH units"
  tier: plausible
  uncertainty: { low: 4.2, high: 4.5, note: "thermodynamic pKa2 at 25 C, I=0" }
  provenance:
    source: "CRC Handbook of Chemistry and Physics; Boulton et al., Principles and Practices of Winemaking"
    conditions: "25 C, zero ionic strength; applied to wine as an apparent constant (decision D-18)"
    notes: "Second dissociation of tartaric acid. The HT-/T2- equilibrium governs bitartrate (KHT) chemistry; carried here for the charge balance, relevant to a future cold-stabilization Process."

# -- L-malic acid, C4H6O5 (diprotic) — the MLF substrate ------------------------
pKa_malic_1:
  value: 3.40
  unit: "pH units"
  tier: plausible
  uncertainty: { low: 3.3, high: 3.5, note: "thermodynamic pKa1 at 25 C, I=0" }
  provenance:
    source: "CRC Handbook of Chemistry and Physics; Boulton et al., Principles and Practices of Winemaking"
    conditions: "25 C, zero ionic strength; applied to wine as an apparent constant (decision D-18)"
    notes: "First dissociation of L-malic (2-hydroxybutanedioic) acid. pKa1 sits right at must pH, so malic buffers strongly there — the reason malolactic fermentation (diprotic malic -> monoprotic lactic) raises pH appreciably (the D-18 headline coupling)."

pKa_malic_2:
  value: 5.11
  unit: "pH units"
  tier: plausible
  uncertainty: { low: 5.0, high: 5.2, note: "thermodynamic pKa2 at 25 C, I=0" }
  provenance:
    source: "CRC Handbook of Chemistry and Physics; Boulton et al., Principles and Practices of Winemaking"
    conditions: "25 C, zero ionic strength; applied to wine as an apparent constant (decision D-18)"
    notes: "Second dissociation of L-malic acid. Above must pH, so the second proton is mostly bound at wine pH; it still contributes to the diprotic charge term that MLF removes."

# -- L-lactic acid, C3H6O3 (monoprotic) — the MLF product ----------------------
pKa_lactic:
  value: 3.86
  unit: "pH units"
  tier: plausible
  uncertainty: { low: 3.7, high: 4.0, note: "thermodynamic pKa at 25 C, I=0" }
  provenance:
    source: "CRC Handbook of Chemistry and Physics; Boulton et al., Principles and Practices of Winemaking"
    conditions: "25 C, zero ionic strength; applied to wine as an apparent constant (decision D-18)"
    notes: "Lactic (2-hydroxypropanoic) acid is MONOPROTIC and weaker than malic's first proton, so converting diprotic malic to monoprotic lactic both removes a dissociable proton and softens the acid — why MLF deacidifies (pH up ~0.1-0.3). The softer perceived acidity at fixed pH is a separate sensory effect, not modelled here."

# -- Succinic acid, C4H6O4 (diprotic) — the Byp-pool representative -------------
pKa_succinic_1:
  value: 4.21
  unit: "pH units"
  tier: plausible
  uncertainty: { low: 4.1, high: 4.3, note: "thermodynamic pKa1 at 25 C, I=0" }
  provenance:
    source: "CRC Handbook of Chemistry and Physics; Boulton et al., Principles and Practices of Winemaking"
    conditions: "25 C, zero ionic strength; applied to wine as an apparent constant (decision D-18)"
    notes: "First dissociation of succinic (butanedioic) acid, the representative species the lumped `Byp` minor-byproduct pool is carbon-accounted as (D-16). The charge balance READS the existing Byp pool through these pKas (include-by-reading, D-18 coupling #2): zero new carbon, so total_carbon is unchanged and the former double-count is closed."

pKa_succinic_2:
  value: 5.64
  unit: "pH units"
  tier: plausible
  uncertainty: { low: 5.5, high: 5.8, note: "thermodynamic pKa2 at 25 C, I=0" }
  provenance:
    source: "CRC Handbook of Chemistry and Physics; Boulton et al., Principles and Practices of Winemaking"
    conditions: "25 C, zero ionic strength; applied to wine as an apparent constant (decision D-18)"
    notes: "Second dissociation of succinic acid. Mostly bound at wine pH. CAVEAT (D-18): Byp also lumps neutral 2,3-butanediol, so reading the whole pool as a diprotic acid slightly OVERSTATES its acid charge (~1-1.5 mM vs the ~20 mM buffer) — a documented minor approximation."

# == BEER's charge-active acids (decision D-179) ================================
#
# The pKas of the acids in BEER_ACIDS that wine does not already supply. Beer shares
# lactic / malic / succinic with the entries above (same molecules, same constants), so
# only acetic, citric and the lumped peptide buffer are new here.
#
# NOTE the acetic comment at the head of this file ("folded into the succinic-equivalent
# Byp read for now; add a separate `acetic` species only if Byp is later speciated"). That
# is still true OF WINE and is not contradicted here: beer gets its own `acetic` STATE slot
# because beer's acetic is a measured dosed input, while wine's remains inside the Byp lump.
# Wine's charge balance does not read pKa_acetic — the acid registries are per-medium.

# -- Acetic acid, C2H4O2 (monoprotic) — beer's volatile acid --------------------
pKa_acetic:
  value: 4.756
  unit: "pH units"
  tier: plausible
  uncertainty: { low: 4.74, high: 4.78, note: "thermodynamic pKa at 25 C, I=0; the textbook value is quoted 4.74-4.78 across sources" }
  provenance:
    source: "CRC Handbook of Chemistry and Physics (ionization constants of organic acids)"
    conditions: "25 C, zero ionic strength (thermodynamic pKa); applied to beer as an apparent constant (decision D-179, the D-18 simplification)"
    notes: "Acetic (ethanoic) acid. Its pKa sits INSIDE beer's pH window (~4.0-4.6), so unlike phosphate it is a genuine buffer there — but it is a minor one by concentration (measured: 0.012 of the 0.110 organic-acid buffering index). Wine folds acetic into the Byp succinic-equivalent lump instead (see this file's header), so this constant is read by BEER only."

# -- Citric acid, C6H8O7 (TRIPROTIC) — the n-protic branch's reason to exist ----
#
# Peyer 2017 (PhD thesis, UCC, CORA 10468/4694) sec 5.5, quoting Li et al. 2016 and Coote &
# Kirsop 1976: "The majority of BC is provided by peptides and polypeptides containing these
# amino acids as well as organic acids (e.g. citrate)." Citrate is NAMED by the source.
#
# Two of its three pKas (3.128 and 4.761) sit inside beer's own pH window, which is what makes
# it a real buffer there -- and what makes it the first shipped acid to reach the general
# n-protic speciation branch added in D-178. Contrast phosphate (2.15 / 7.20 / 12.35), the acid
# that beat was opened on: also triprotic, but with every pKa FAR from beer's pH, so its charge
# is ~0.99 flat across pH 4.0-4.6 and an inverse-anchored cation absorbs it entirely.
pKa_citric_1:
  value: 3.128
  unit: "pH units"
  tier: plausible
  uncertainty: { low: 3.09, high: 3.15, note: "thermodynamic pKa1 at 25 C, I=0; apparent value in beer shifts with ionic strength" }
  provenance:
    source: "CRC Handbook of Chemistry and Physics (ionization constants of organic acids)"
    conditions: "25 C, zero ionic strength (thermodynamic pKa); applied to beer as an apparent constant (decision D-179)"
    notes: "First dissociation of citric (2-hydroxypropane-1,2,3-tricarboxylic) acid. Sits just BELOW beer's pH window, so the first proton is largely off across the whole window and this step contributes buffering at the acidic edge."

pKa_citric_2:
  value: 4.761
  unit: "pH units"
  tier: plausible
  uncertainty: { low: 4.73, high: 4.78, note: "thermodynamic pKa2 at 25 C, I=0" }
  provenance:
    source: "CRC Handbook of Chemistry and Physics (ionization constants of organic acids)"
    conditions: "25 C, zero ionic strength (thermodynamic pKa); applied to beer as an apparent constant (decision D-179)"
    notes: "Second dissociation of citric acid, and the load-bearing one: at 4.761 it sits essentially ON beer's pH window (~4.0-4.6), which is where buffering is maximal. This is why citrate outweighs its concentration share — measured, citric is the SECOND-largest organic-acid contributor to beer's buffering index (0.024 of 0.110) despite lactic being present at comparable levels."

pKa_citric_3:
  value: 6.396
  unit: "pH units"
  tier: plausible
  uncertainty: { low: 6.37, high: 6.42, note: "thermodynamic pKa3 at 25 C, I=0; well above beer pH so the third proton is mostly bound there" }
  provenance:
    source: "CRC Handbook of Chemistry and Physics (ionization constants of organic acids)"
    conditions: "25 C, zero ionic strength (thermodynamic pKa); applied to beer as an apparent constant (decision D-179)"
    notes: "Third dissociation of citric acid. Well above beer's pH, so the third proton is largely bound there and contributes little buffering — but it is carried so the speciation is exact across the full [0, 14] solver bracket, exactly as pKa_sulfurous_2 is (see D-22). Its presence is what makes citrate a THREE-pKa acid and therefore the first user of the n-protic branch."

# ==============================================================================
# THE THREE FALLING WORT ACIDS (decision D-181) — pyruvic, formic, oxalic.
#
# These are NOT a fourth flavour of beer acid: they are the same charge-active organic acids
# as the block above, added because beer's model needed to be able to LOSE their anion charge.
# Tyrell 2013's EBC-tube trials measure all three falling steeply within a day of pitching
# (pyruvic 22 -> ~1.3, formic 26 -> ~4.75, oxalic 22 -> ~5.6 mg/L) and then flat. Until D-181
# none was a beer state slot, so the model's acidification was ONE-SIDED — sized at D-180 as
# roughly +0.2-0.3 pH of missing base and named there as the larger half of why the predicted
# pH agreed as well as it did.
#
# WHY THE pKa VALUES BARELY MATTER HERE, AND WHY THEY ARE STILL CARRIED PROPERLY.
# Two of the three (pyruvic 2.45, oxalic-1 1.25) sit 2-3 units BELOW anything a beer reaches,
# so those protons are off across the whole trajectory and the acid carries a near-flat charge.
# That is the same geometry D-178 used to REJECT malt phosphate — but the conclusion inverts,
# and the reason is worth stating because it looks like a contradiction and is not. Phosphate
# was rejected as a BUFFER: a species whose charge is flat contributes almost no dpH/dC, and an
# inverse-anchored cation absorbs a constant charge outright. These acids are not proposed as
# buffers. They are proposed as charge that LEAVES: a fully dissociated acid carries its full
# -1 (or -2), so removing it removes the maximum possible anion charge per mole. Flat charge is
# precisely what makes the effect large, where for a buffer it is what makes it nil.
#
# So the pH prediction is insensitive to how the protons are distributed and sensitive to how
# much acid is REMOVED. The bands below are still the honest textbook spreads.
#
# MEASURED, NOT REASONED (D-181 amendment). The first draft of this block said pKa_oxalic_2 was
# "the one pKa the prediction is sensitive to", because at 4.20 it sits inside the pH range a
# real beer traverses. Run over its whole band, it moves the predicted drop by 0.027 percentage
# points, and pKa_pyruvic's whole band by 0.001. ALL FOUR are consequence-free, and the reason
# the argument failed is worth more than the correction: THIS model's beer only reaches pH 5.24,
# not the real 4.78-4.90, so oxalate never descends to within a unit of pKa2 and stays nearly
# fully dissociated throughout. The claim was written about the BEVERAGE and tested against the
# MODEL. It follows that these constants become consequential exactly when the model starts
# acidifying properly -- i.e. when dissolved CO2 lands (D-181 sec 14) -- so re-measure then
# rather than trusting this note [[feedback-conceded-caveats-are-not-coverage]].
# ==============================================================================

# -- Pyruvic acid, C3H4O3 (monoprotic) -----------------------------------------
#
# THE SAME MOLECULE AS WINE'S `pyruvate` STATE POOL, and deliberately a DIFFERENT state slot
# (`pyruvic`, beer-only). Wine's is a dynamic excreted-overflow keto-acid pool that binds SO2
# (D-49/D-51); beer's is a malt-derived wort input that is removed early. D-179 declined to
# ship it partly on that collision; D-181 ships it under a distinct name with the collision
# stated rather than dissolved. If beer ever wires the keto-acid overflow Processes, the two
# pools MUST be reconciled before both are charge-active, or one molecule is counted twice.
pKa_pyruvic:
  value: 2.45
  unit: "pH units"
  tier: plausible
  uncertainty: { low: 2.39, high: 2.50, note: "thermodynamic pKa at 25 C, I=0. The band spans the textbook spread rather than a measurement spread: sources quote 2.39, 2.45 and 2.50 for the same constant. CONSEQUENCE-FREE, and MEASURED to be so rather than argued: swept edge to edge through the shipped charge balance, the whole band moves the predicted pH drop by 0.001 percentage points (0.508394 -> 0.508404 of the measured drop). 2.39 and 2.50 are both >2 units below any pH a modelled beer reaches, so the acid is >99.9% dissociated at either edge." }
  provenance:
    source: "CRC Handbook of Chemistry and Physics (ionization constants of organic acids)"
    conditions: "25 C, zero ionic strength (thermodynamic pKa); applied to beer as an apparent constant (decision D-181, the D-18 simplification)"
    notes: "Pyruvic (2-oxopropanoic) acid. Read by BEER only: wine carries the same molecule as the `pyruvate` overflow pool, which is deliberately NOT charge-active (it is an SO2 binder and a carbon pool, D-49). One molecule, two media, two roles, two slots — see the block header."

# -- Formic acid, CH2O2 (monoprotic) -------------------------------------------
pKa_formic:
  value: 3.75
  unit: "pH units"
  tier: plausible
  uncertainty: { low: 3.74, high: 3.77, note: "thermodynamic pKa at 25 C, I=0; quoted 3.74-3.77 across sources" }
  provenance:
    source: "CRC Handbook of Chemistry and Physics (ionization constants of organic acids)"
    conditions: "25 C, zero ionic strength (thermodynamic pKa); applied to beer as an apparent constant (decision D-181)"
    notes: "Formic (methanoic) acid, the strongest of the simple carboxylic acids and the lightest at 46.03 g/mol. Its pKa sits just BELOW a fermenting beer's range, so it is ~90-98% dissociated across the traverse: the acid whose removal costs the most charge per milligram in this beat."

# -- Oxalic acid, C2H2O4 (DIPROTIC) --------------------------------------------
pKa_oxalic_1:
  value: 1.26
  unit: "pH units"
  tier: plausible
  uncertainty: { low: 1.25, high: 1.27, note: "A DESCRIBED SPREAD, NOT TWO ATTRIBUTED DIGITS -- the pKa_acetic idiom in this file. The constant is quoted 1.25-1.27 across sources; only the 1.25 is attributable to a reference I hold, so the band states the spread and the source field names the one book rather than assigning an edge to an unnamed tabulation (the D-167 standard: a source field claiming a parameter-specific published span is exactly what this archive audits). The nominal is the band midpoint and is AUTHOR-CONSTRUCTED. Consequence-free like pKa_pyruvic: 3+ units below any modelled beer pH, so the first proton is off everywhere on the trajectory and either edge gives the same charge." }
  provenance:
    source: "CRC Handbook of Chemistry and Physics (ionization constants of organic acids)"
    conditions: "25 C, zero ionic strength (thermodynamic pKa); applied to beer as an apparent constant (decision D-181)"
    notes: "First dissociation of oxalic (ethanedioic) acid — the strongest dicarboxylic acid. Carried so the speciation is exact across the full [0, 14] solver bracket, not because beer ever visits this pH."

pKa_oxalic_2:
  value: 4.203
  unit: "pH units"
  tier: plausible
  uncertainty: { low: 4.14, high: 4.266, note: "A DESCRIBED SPREAD, NOT TWO ATTRIBUTED DIGITS (see pKa_oxalic_1 for the same reasoning). The constant is quoted 4.14-4.27 across sources — a real 0.13-unit disagreement rather than a rounding — and only the 4.14 is attributable to a reference I hold, so the band states the spread and the source field names that one book. The nominal is the band midpoint and is AUTHOR-CONSTRUCTED. PREDICTED TO BE THE CONSEQUENTIAL ONE AND MEASURED NOT TO BE (D-181 amendment): the whole band moves the predicted pH drop by 0.027 percentage points, because THIS model only traverses to pH 5.24 and oxalate therefore stays nearly fully dissociated at both edges. See the block header -- the argument was made about a real beer and tested against the model, and it should start biting once the model acidifies properly." }
  provenance:
    source: "CRC Handbook of Chemistry and Physics (ionization constants of organic acids)"
    conditions: "25 C, zero ionic strength (thermodynamic pKa); applied to beer as an apparent constant (decision D-181)"
    notes: "Second dissociation of oxalic acid. It sits inside the window a REAL beer traverses (4.78-4.90), which is why it was expected to be load-bearing -- but this model finishes at 5.24, so oxalate's mean charge barely moves and its removal is close to a flat 2 eq/mol after all. Measured, not assumed; see the uncertainty note. D-180's pre-registration used the bare 4.14, which is why a corrected arm B is not bit-identical to that file's."

# -- The lumped peptide/polypeptide buffer (monoprotic site) — decision D-179 ----
#
# WHAT ACTUALLY BUFFERS BEER. Peyer 2017 sec 5.5 (after Li et al. 2016) puts FREE amino acids
# at only ~10% of wort's buffering capacity -- "little contribution ... is made by aspartate
# (pKa 3.86), glutamic acid (pKa 4.25) and histidine (pKa 6.04)" -- and attributes the majority
# to "peptides and polypeptides containing these amino acids as well as organic acids". Sec 5.5
# corroborates mechanistically: boiling drops BC 1.34 -> 1.21 "likely due to the coagulation and
# precipitation of buffering high-molecular proteins and minerals as hot trub".
#
# So this is ONE lumped pool of buffering SITES with ONE effective pKa, not an amino-acid model.
# The pKa is the side-chain carboxyl of the residues the source names; the value is glutamate's
# and the BAND spans the sourced window (aspartate 3.86 to 4.50).
pKa_peptide_buffer:
  value: 4.25
  unit: "pH units"
  tier: speculative
  uncertainty: { low: 3.86, high: 4.50, note: "the SOURCED residue window: aspartate 3.86 and glutamic acid 4.25 are the two side-chain pKas Peyer names as beer-relevant; 4.50 is the upper edge over which the back-solved capacity stays stable (10.99 / 10.52 / 10.70 mM at 3.86 / 4.25 / 4.50, a 4.5% spread). Both edges PRINTED-derived; the band is NOT a symmetric guess around the nominal. RE-MEASURED at D-214: this triple read 10.75 / 10.28 / 10.45 until then, computed on the FIVE-acid wort table before D-181 added pyruvic/formic/oxalic and moved the nominal capacity 11.36 -> 10.52 mM. The stability claim survives the re-measurement (4.5% vs 5%); only the numbers were stale. NOTE what this triple is NOT: the capacity is re-derived here PER pKa, but the shipped capacity is a compile-time constant solved at the NOMINAL pKa only, so a member that draws this band carries a wort whose BC is 1.116-1.180, not 1.18 (D-214 sec 6 — measured, recorded, NOT fixed)." }
  provenance:
    source: "Peyer, L. (2017), 'Lactic acid bacteria fermentation of wort as a tool to add functionality in malting, brewing and novel beverages', PhD thesis, University College Cork, CORA handle 10468/4694, section 5.5 (published as Peyer et al. 2017, J. Inst. Brew. 123(4)) -- quoting Li et al. 2016 and Coote & Kirsop 1976 for the residue pKas and the peptide attribution."
    conditions: "wort/beer, 25 C; an EFFECTIVE (lumped) constant standing for the side-chain carboxyls of Asp/Glu residues borne on peptides and polypeptides, not a measured constant of any single species."
    notes: "tier=SPECULATIVE, and deliberately so -- this is a lumped stand-in for a protein population, not a measured molecular constant, and it is the one parameter that makes beer's pH tier speculative (acidbase.ph_tier is scoped per medium at D-179 precisely so this does NOT drag wine's pH tier down for an acid wine does not carry). THE HONEST LIMITATION: the capacity that pairs with this pKa was back-solved against a published WORT titration at pH 5.5, where the fit is well-conditioned; at BEER's pH 4.4 the identical fitted solutions give a buffering index from 0.32 to 0.59 across this band -- a factor of ~1.9. The calibration frame is not the frame that binds, which is why the pairing ships as a band and never as a nominal."

# ==============================================================================
# DOSED PHOSPHATE (decision D-210) — the counter-anion of a DAP addition.
#
# THIS IS NOT THE PHOSPHATE D-178 REFUSED, and the distinction is the whole beat. D-178 was
# opened on MALT phosphate as beer's buffer and measured it a near no-op: its charge is ~0.99
# flat across beer's window, and a species of constant charge PRESENT AT t=0 is absorbed
# outright by the back-solved cation. Both halves of that argument are about a species the
# anchor can see. `add_dap` doses (NH4)2HPO4 mid-run, AFTER the anchor, so nothing absorbs it:
# ~0.95 equivalents of anion charge per mole arrive and never leave, worth -0.159 pH on Palma
# 2012's 1.1 g/L refeed and -0.043 pH on a 0.3 g/L cellar dose. Until D-210 the model dropped
# the phosphate entirely and booked only the dose's ammonium -- a cation with no counter-anion.
#
# WHY THE pKas AND NOT A FIXED CHARGE, which was measured before being decided. The dosed
# phosphate's BUFFERING is genuinely negligible: dz/dpH = 0.117 at wine pH, so at Palma's 8.33
# mmol/L it contributes 0.97 mEq/L/pH against wine's own ~47, i.e. 2.1 %. That invites replacing
# it with one constant anion charge folded into cation_charge, no slot and no pKas. The
# measurement refuses it: a nearly-constant charge still needs the constant CHOSEN, the
# admissible range is 0.876 (pH 3.0) to 1.000 (fully dissociated), and end pH across that range
# spans 0.022 pH at Palma's dose -- resolvable, and a free normalisation of exactly the kind
# D-205 refused a term for. Two sourced pKas remove the freedom at the price of one state slot.
#
# DIPROTIC ON PURPOSE (the pKa_carbonic_1 idiom). Phosphoric acid's third dissociation, 12.35,
# is omitted rather than deferred: it is >6 pH units above anything either medium reaches and >4
# above titratable_acidity's 8.2 endpoint, so it is worth ~7e-5 of an equivalent where the model
# goes. Carrying it would be actively WRONG, not merely idle -- AcidSpec.protons is the maximum
# anion charge TA uses as its endpoint approximation, so a third pKa would add a full
# never-titratable equivalent per mole: 0.63 g/L of phantom TA at a 1.1 g/L dose.
# ==============================================================================

pKa_phosphoric_1:
  value: 2.15
  unit: "pH units"
  tier: plausible
  uncertainty: { low: 2.12, high: 2.16, note: "thermodynamic pKa1 at 25 C, I=0. The narrow spread across sources is real -- this is a first dissociation measured many times -- and it is also nearly consequence-free here: at wine pH the phosphate is 87-97 % singly-dissociated either way. The consequential number in this block is the DOSE, not the constant." }
  provenance:
    source: "CRC Handbook of Chemistry and Physics (ionization constants of inorganic acids); the same 2.15 / 7.20 / 12.35 triple already quoted in this file's citrate block and in acidbase.BEER_ACIDS as the acid D-178 was opened on."
    conditions: "25 C, zero ionic strength (thermodynamic pKa); applied to must/wort and beverage as an apparent constant, the D-179 convention for every pKa here"
    notes: "First dissociation of phosphoric acid, H3PO4 -> H2PO4(-). This is the ONE dissociation that matters for a dosed phosphate: at wine pH 3.0-3.7 it puts the mean charge at 0.876-0.973, and at beer pH it is ~0.995. Value re-used rather than re-sourced on purpose -- D-178 already carried it in prose to justify REFUSING malt phosphate, and D-210 is the same constant reaching the opposite conclusion about a DOSED phosphate, so quoting a different number would hide that the two beats agree about the chemistry and differ only about what the anchor can absorb."

pKa_phosphoric_2:
  value: 7.20
  unit: "pH units"
  tier: plausible
  uncertainty: { low: 7.19, high: 7.21, note: "thermodynamic pKa2 at 25 C, I=0. Sits ~1.5 units above the highest pH any medium here starts from (a 5.65 wort) and ~3.8 above wine, so it is off across the whole trajectory; it is carried because titratable_acidity titrates to 8.2, where this proton IS in play (z goes 0.947 at pH 3.4 to 1.910 at 8.2)." }
  provenance:
    source: "CRC Handbook of Chemistry and Physics (ionization constants of inorganic acids); same triple as pKa_phosphoric_1."
    conditions: "25 C, zero ionic strength (thermodynamic pKa); applied as an apparent constant"
    notes: "Second dissociation, H2PO4(-) -> HPO4(2-). Consequence-free for the pH SOLVE in both media and load-bearing for the TA READOUT, which is why it is carried while the third (12.35) is not: the titration endpoint at 8.2 is one unit above this pKa and four below that one. Carrying exactly the protons that are titratable makes TA's z_max endpoint approximation come out at 1.05 equivalents per mole against a true 0.963 (9 % over, inside the module's own stated approximation), where three pKas would give 2.05 (113 % over)."

# -- Sulfurous acid, H2SO3 / SO2.H2O (diprotic) — the free-SO2 speciation set ----
#
# READOUT-ONLY (decision D-22). Unlike the acids above, these pKas are NOT in the
# pH-solver's acid set (acidbase.PKA_PARAM_NAMES / build_pka_map) and are NOT read by
# titratable_acidity. They are read only by the molecular-SO2 readout (acidbase.
# molecular_so2 / molecular_so2_fraction), which solves pH from the organic acids and
# then partitions the dosed free SO2 into molecular / bisulfite / sulfite at that pH.
# Free SO2's own (minor) back-reaction on pH — bisulfite is a charge-active anion — is a
# scoped omission for beat 1 (the inverse anchoring would absorb it into the fitted
# cation at t=0 anyway, so the t=0 molecular-SO2 number is identical with or without it;
# see D-22). OIV titratable acidity explicitly EXCLUDES sulfurous (and carbonic) acid,
# which the readout-only design gives for free. Add to the charge balance later via an
# `extra_acids` map if a mid-ferment SO2 addition event is built.
pKa_sulfurous_1:
  value: 1.81
  unit: "pH units"
  tier: plausible
  uncertainty: { low: 1.77, high: 1.86, note: "effective wine value; literature 1.77-1.86 at cellar T / ionic strength" }
  provenance:
    source: "Usseglio-Tomasset & Bosia (1984), Bull. OIV; carried in Boulton et al., Principles and Practices of Winemaking, and Ribereau-Gayon et al., Handbook of Enology Vol. 1"
    conditions: "wine-relevant temperature/ionic strength; applied as an apparent constant (decision D-22)"
    notes: "First dissociation SO2.H2O <-> H+ + HSO3-. THE load-bearing constant: the molecular (undissociated SO2.H2O) fraction of free SO2 is 1/(1 + 10^(pH - pKa1)), and molecular SO2 is the antimicrobial species. With pKa1 ~ 1.81 the molecular fraction falls ~3x per 0.5 pH unit (~6% at pH 3.0, ~2% at pH 3.5, ~0.6% at pH 4.0) — the pH coupling the D-18 charge-balance keystone was built to make emerge. ~0.8 mg/L molecular (the microbial-stability target) needs ~40 mg/L free at pH 3.5."

pKa_sulfurous_2:
  value: 7.20
  unit: "pH units"
  tier: plausible
  uncertainty: { low: 6.9, high: 7.3, note: "thermodynamic pKa2; well above wine pH so sulfite is negligible there" }
  provenance:
    source: "CRC Handbook of Chemistry and Physics; Usseglio-Tomasset & Bosia (1984); Boulton et al., Principles and Practices of Winemaking"
    conditions: "25 C; applied as an apparent constant (decision D-22)"
    notes: "Second dissociation HSO3- <-> H+ + SO3(2-). Far above wine pH (3-4), so the sulfite fraction is negligible (~1e-4) and the diprotic molecular fraction h^2/D reduces to the monoprotic 1/(1 + 10^(pH - pKa1)) there. Carried for an exact speciation and so the readout is correct up to the pH-8.2 TA endpoint, where sulfite IS partly formed — the reason excluding SO2 from titratable_acidity is load-bearing, not cosmetic (D-22)."

# -- Carbonyl-bisulfite binding: the free/bound SO2 split (decisions D-28, D-51) -
#
# Now that acetaldehyde exists as real state (decision D-27), the dosed SO2 slot is
# reinterpreted as TOTAL SO2 (conserved, inert) and the free/bound split is DERIVED at
# the solved pH by the binding equilibrium (acidbase.bound_so2 / free_so2 / speciate_so2):
#
#     CH3CHO + HSO3-  <->  CH3CH(OH)SO3-      K = [free acetaldehyde][HSO3-] / [adduct]
#
# referenced to BISULFITE (the reactive nucleophile), so pH enters via the bisulfite
# fraction of free SO2. Free = total - bound; molecular = free * neutral_fraction(pH), so
# D-22's molecular-SO2 readout survives unchanged at acetaldehyde = 0 (total == free).
#
# D-51 GENERALIZES this to a COUPLED MULTI-CARBONYL equilibrium: acetaldehyde is not the
# only bisulfite binder in real wine — the excreted keto-acid pools pyruvate (D-49) and
# alpha-ketoglutarate (D-50) compete for the SAME shared bisulfite pool. All three carbonyls
# now solve ONE equilibrium (acidbase.bound_so2_molar, a competitive-Langmuir partition over
# a single reactive-bisulfite root, N=1 reduces EXACTLY to the original D-28 quadratic).
# READOUT-ONLY, like D-22/D-28: the split does not add new state or touch conservation. The
# live consumers are the MLF antimicrobial gate (free-molecular SO2, D-28) and the
# acetaldehyde-reduction ADH protection (D-47) — the latter now reads a SMALLER
# acetaldehyde-bound share than the single-carbonyl D-28/D-47 form, because pyruvate/alpha-KG
# now soak up some of the dosed SO2 too.
K_acetaldehyde_so2:
  value: 1.5e-6
  unit: "mol/L"
  tier: plausible
  uncertainty: { low: 2.0e-7, high: 2.1e-6, note: "order-of-magnitude literature scatter: apparent Kd 1.5e-6 (pH 3.3) - 2.06e-6 (pH 3.5); Blouin's ~0.04% free acetaldehyde at 30 mg/L free SO2 implies ~2e-7. Wide band spans both." }
  provenance:
    source: "Burroughs & Sparks (1973), Sulphite-binding power of wines and ciders (the canonical carbonyl-bisulphite dissociation constants); apparent Kd 1.5e-6 (pH 3.3) - 2.06e-6 (pH 3.5) reported across the wine literature (e.g. Food Chemistry 2020, doi 10.1016/j.foodchem.2020.127173; AJEV 76:0760008, 2025); Blouin (1966) via SciELO S2224-79042018000200001. CORROBORATED (decision D-130) by Barbe et al. (2000), J. Agric. Food Chem. 48:3413-3419, which re-anchors this same acetaldehyde/pyruvate/2-oxoglutarate Kd set (from Blouin / Burroughs & Sparks) while measuring the additional botrytis carbonyls; and by Ribéreau-Gayon et al., Handbook of Enology Vol. 1 §8.4 (Table 8.5)."
    conditions: "wine, ~pH 3.3-3.5, cellar temperature; apparent (concentration-based) dissociation constant"
    notes: "Dissociation constant of the acetaldehyde-hydroxysulphonate adduct, the strongest carbonyl-SO2 bond in wine (acetaldehyde is the principal SO2 binder). REFERENCED TO BISULFITE HSO3- (the reactive species), so the binding solver uses [HSO3-] = free_SO2 * bisulfite_fraction(pH) and pH enters the equilibrium mechanistically. The literature apparent constants are usually quoted per TOTAL free SO2 at a stated pH; at wine pH bisulfite is ~0.94-0.99 of free SO2, so the bisulfite-vs-total-free basis differs by <=5% (well inside the order-of-magnitude band). tier=plausible: measured constants applied to wine as apparent values, with a wide band. SCOPE (pre-D-51): acetaldehyde-only binder — real bound SO2 also sits on pyruvate / alpha-ketoglutarate / sugars; D-51 adds the two keto-acid binders below to the SAME equilibrium (sugars remain unmodelled, so the 'total' slot is still a slight overclaim on the name, now smaller)."

# -- Pyruvate-bisulfite binding (decision D-51) -- the second-strongest carbonyl binder --
#
# Pyruvate (CH3-CO-COOH) + HSO3- <-> its alpha-hydroxysulphonate adduct, the SAME 1:1
# equilibrium form as acetaldehyde, referenced to bisulfite for the SAME reason. Roughly
# 370x WEAKER than acetaldehyde (Kd two orders of magnitude larger), consistent with
# pyruvate binding SO2 far less avidly per mole -- but its excreted-overflow pool (D-49,
# nominal ~30 mg/L residual) is persistent and measured, so it still competes materially
# for the shared bisulfite pool at typical dosed-SO2 concentrations (verified: captures a
# double-digit percent share of total SO2 at a 50 mg/L dose alongside alpha-KG, D-51).
K_pyruvate_so2:
  value: 5.55e-4
  unit: "mol/L"
  tier: plausible
  uncertainty: { low: 1.5e-4, high: 2.0e-3, note: "Burroughs & Sparks report 5.55e-4 at pH 3.3; a later secondary review rounds pyruvate's Kd to ~2e-4 mol/L, order-of-magnitude consistent. Band spans both plus apparent-pKa pH drift across the wine range (3.3-3.8, same drift acetaldehyde's band carries)." }
  provenance:
    source: "Burroughs & Sparks (1973), Sulphite-binding power of wines and ciders I: equilibrium constants for the dissociation of carbonyl bisulphite compounds (J. Sci. Food Agric. 24:187-198) -- apparent Kd 5.55e-4 mol/L at pH 3.3, the same canonical source as K_acetaldehyde_so2 (a direct cross-check: that paper's acetaldehyde value 1.5e-6 matches this codebase's independently-sourced K_acetaldehyde_so2 exactly). D-130 recorded this as CORROBORATED by Barbe et al. (2000), J. Agric. Food Chem. 48:3413-3419, and the Handbook of Enology Vol. 1 §8.4 Kd set. Decision D-190 checked those two legs separately and they do not stand together. FALSIFIED leg: the Handbook §8.4 set does NOT corroborate this value -- Table 8.5 prints pyruvic acid K = 0.3e-3 M and Figure 8.3 prints 0.2 mM, both smaller than the 2-oxoglutaric value beside them, i.e. the REVERSE of this codebase's ordering. UNVERIFIED leg: the JAFC paper itself has NOT been read for these two constants -- Figure 8.3 merely carries the caption '(Barbe, 2000)', which may be that paper, a thesis or another 2000 publication, so it must not be cited as agreeing OR disagreeing until pulled. D-130's corroboration line was a footnote to a 5-oxofructose beat and its numbers were never checked. The value is retained (Burroughs & Sparks is the primary and is not held locally); the disagreement is recorded rather than resolved. See the alpha-ketoglutarate comment below."
    conditions: "wine, ~pH 3.3, cellar temperature; apparent (concentration-based) dissociation constant, referenced to bisulfite HSO3- like K_acetaldehyde_so2"
    notes: "Second-strongest carbonyl-SO2 binder in wine after acetaldehyde (Jackowetz & Mira de Orduna 2013). Competes with acetaldehyde and alpha-ketoglutarate for the SAME shared bisulfite pool in the D-51 multi-carbonyl equilibrium (acidbase.bound_so2_molar) -- a competitive-Langmuir partition, NOT an independent binding (three carbonyls cannot each claim the same free SO2). tier=plausible: a measured constant applied to wine as an apparent value, banded for pH-drift and the secondary-source scatter."

# -- Alpha-ketoglutarate-bisulfite binding (decision D-51) -- the third carbonyl binder --
#
# Alpha-ketoglutarate (2-oxoglutaric acid) + HSO3- <-> its adduct, the SAME 1:1 form.
# Roughly 93x weaker than acetaldehyde. Its excreted pool (D-50, nominal ~20 mg/L
# residual) is smaller than pyruvate's.
#
# ORDERING IS CONTESTED, AND THE BAND KNOWS IT (decision D-190). This entry used to state
# as a fact that alpha-KG is "slightly STRONGER than pyruvate (smaller Kd), so per mole it
# is the second-most-avid binder". That is what the two NOMINALS say (1.4e-4 vs 5.55e-4,
# both from Burroughs & Sparks 1973) -- but every secondary compilation held locally
# reverses it: Handbook of Enology Vol 1 Table 8.5 (Usseglio-Tomasset 1995) prints pyruvic
# 0.3e-3 M against 2-oxoglutaric 0.5e-3 M; the same volume's Figure 8.3 (captioned "Barbe,
# 2000" -- the PAPER itself is unread, see the source fields) prints 0.2 mM against 0.66 mM;
# Understanding Wine Chemistry 2e Table 17.2 prints
# 1.4e-4 against 4.9e-4. All three make PYRUVATE the stronger binder. The uncertainty bands
# below already span those magnitudes one parameter at a time, so the reversal is REACHABLE:
# ~2.0% of independent draws (200k, D-190) satisfy K_pyruvate < K_alpha_kg. The nominals are
# left where the primary put them -- Burroughs & Sparks 1973 is not held locally and choosing
# among the secondaries would be a guess -- but the ordering must not be restated as a fact.
# Guarded by tests/test_so2_carbonyl_release.py.
K_alpha_kg_so2:
  value: 1.4e-4
  unit: "mol/L"
  tier: plausible
  uncertainty: { low: 4.0e-5, high: 5.0e-4, note: "Burroughs & Sparks report 1.4e-4 at pH 3.3; a later secondary review rounds oxoglutaric acid's Kd to ~5e-4 mol/L, order-of-magnitude consistent (the wider end of this band covers it). Band also spans the same apparent-pKa pH-drift margin as the other two binding constants." }
  provenance:
    source: "Burroughs & Sparks (1973), Sulphite-binding power of wines and ciders I (J. Sci. Food Agric. 24:187-198) -- apparent Kd 1.4e-4 mol/L at pH 3.3 for 2-ketoglutaric acid, the same canonical source and cross-checked acetaldehyde value as K_pyruvate_so2. D-130 recorded this as CORROBORATED by Barbe et al. (2000), J. Agric. Food Chem. 48:3413-3419, and the Handbook of Enology Vol. 1 §8.4 Kd set. Decision D-190 checked those two legs separately. FALSIFIED leg: the Handbook §8.4 set does NOT corroborate this value -- Table 8.5 prints 2-oxoglutaric acid K = 0.5e-3 M and Figure 8.3 prints 0.66 mM, both LARGER than the pyruvate value beside them, i.e. the REVERSE of this codebase's ordering; Understanding Wine Chemistry 2e Table 17.2 agrees with the reversal (4.9e-4 here, 1.4e-4 for pyruvate). UNVERIFIED leg: the JAFC paper has NOT been read for these two constants -- Figure 8.3 only carries the caption '(Barbe, 2000)' and the paper must not be cited either way until pulled. The value is retained (Burroughs & Sparks is the primary and is not held locally); the disagreement is recorded rather than resolved, and the ordering is no longer asserted in the comment above."
    conditions: "wine, ~pH 3.3, cellar temperature; apparent (concentration-based) dissociation constant, referenced to bisulfite HSO3- like K_acetaldehyde_so2"
    notes: "Third carbonyl-SO2 binder in the D-51 multi-carbonyl equilibrium, sharing the same bisulfite pool as acetaldehyde and pyruvate (acidbase.bound_so2_molar). tier=plausible: a measured constant applied to wine as an apparent value, banded for pH-drift and secondary-source scatter."

# -- 5-Oxofructose-bisulfite binding (decision D-130) -- the dominant BOTRYTIS carbonyl binder --
#
# 5-Oxofructose (5-keto-fructose, C6H10O6) + HSO3- <-> its alpha-hydroxysulphonate adduct, the
# SAME 1:1 equilibrium form as the three yeast carbonyls above, referenced to bisulfite for the
# SAME reason. It is a hexodiulose that Botrytis cinerea (and acetic-acid bacteria) form ON THE
# BERRY by oxidising must fructose -- so it enters the model as a MUST-COMPOSITION INPUT (the
# `oxofructose` slot, scenario key `oxofructose_mgl`), never a fermentation product, and is
# INERT (no Process touches it). Its defining trait (Handbook Vol 1 sec 8.4 via Barbe 2000):
# "concentrations are not altered by alcoholic fermentation" -- unlike the transient
# dihydroxyacetone (reduced by yeast during AF, no longer a factor in finished wine, and so
# DELIBERATELY NOT MODELLED here), 5-oxofructose PERSISTS unchanged into the bottle and dominates
# a botrytized wine's high SO2-combining power. At Kd 3.3e-4 mol/L it is a strong binder (~4x
# weaker than acetaldehyde but comparable to alpha-KG), so a ~100 mg/L botrytis load binds a
# large share of a typical SO2 dose -- reproducing the sourced "4-78% of all SO2 combinations"
# that Barbe attributes to it, and collapsing free/molecular SO2 (which opens the MLF/Brett
# antimicrobial gates: a botrytized must needs a higher SO2 dose for the same protection).
# GLUCONOLACTONE (the other persistent botrytis binder Barbe names) is DEFERRED, not modelled:
# its Kd (4.2 mM, Handbook Table 8.5) does not reconcile with its own sourced binding point
# (100 mg/L -> 21.6 mg/L bound SO2, Bertrand & Guillou 1999; Langmuir predicts ~4x less), and
# what botrytis musts actually MEASURE is gluconic acid, mostly NOT the lactone that binds -- the
# gluconic-acid <-> lactone split is unsourced. Blocked on sourcing (the D-121 pattern), not refused.
K_5_oxofructose_so2:
  value: 3.3e-4
  unit: "mol/L"
  tier: plausible
  uncertainty: { low: 1.0e-4, high: 1.0e-3, note: "Burroughs & Sparks (1973b) report ~0.33 mM; band spans the same apparent-pKa pH-drift margin (wine pH 3.3-3.8) as the three yeast-carbonyl binding constants plus reasonable measurement scatter for this less-studied compound." }
  provenance:
    source: "Burroughs & Sparks (1973b), Sulphite-binding power of wines and ciders II, apparent Kd ~0.33 mM for 5-oxofructose (keto-5-fructose), as compiled by Barbe et al. (2000), J. Agric. Food Chem. 48:3413-3419 and Ribereau-Gayon et al., Handbook of Enology Vol. 1 sec 8.4 (Table 8.7)."
    conditions: "wine, ~pH 3.3, cellar temperature; apparent (concentration-based) dissociation constant, referenced to bisulfite HSO3- like the three yeast-carbonyl constants above."
    notes: "The dominant botrytis-specific carbonyl-SO2 binder (decision D-130), added to the SAME shared-bisulfite competitive-Langmuir equilibrium as acetaldehyde/pyruvate/alpha-KG (acidbase.bound_so2_molar). Enters via the inert `oxofructose` must-input slot (default 0 -> byte-for-byte the D-51 3-carbonyl form; a non-botrytis wine is unchanged). Typical botrytized-must LOAD is ~80-150 mg/L (Barbe 2000/2002; Handbook Vol 1: '5-oxofructose content frequently of the order of 100 mg/l in wines made from botrytized grapes'), set per-scenario via oxofructose_mgl -- the load is sourced (a measured range), not an author estimate. tier=plausible: measured Kd + measured load applied to wine as apparent values; the SO2-collapse OUTCOME is the sourced-robust claim (Barbe's 4-78%-of-combinations), the exact per-run split rides the load."

# ======================================================================================
# DISSOLVED CO2 — the carbonic-acid term in the charge balance (decision D-182)
# ======================================================================================
#
# D-180 turned beer's pH from an input into a prediction and closed by naming TWO omitted
# terms of OPPOSITE sign. D-181 built the larger one — the wort acids a real ferment removes
# — which made the prediction agree WORSE on purpose. This block is the other one, and it
# pulls the other way.
#
# WHAT IS MODELLED. A fermenting beverage sits under its own evolving CO2, so the liquid is
# saturated at ~1 atm CO2 partial pressure, and dissolved CO2 is a weak acid. What the charge
# balance reads is min(evolved CO2, saturation): the mass-conservative statement that the
# liquid retains what it can hold and the rest leaves. The engine's `CO2` state slot is
# CUMULATIVE EVOLVED GAS and must NEVER be read as the dissolved concentration — reading it
# directly would put ~40 g/L (beer) or ~100 g/L (wine) of carbonic acid in the balance.
#
# WHY IT IS NOT ABSORBED BY THE INVERSE-ANCHORED CATION, which is the trap D-178 fell into
# with malt phosphate: a species carrying a CONSTANT charge is absorbed outright by the
# back-solved cation and is a near no-op. Dissolved CO2 is ~0 in wort/must (nothing has
# fermented yet) and saturated in the finished beverage, so it is not constant — it is
# exactly the shape that survives anchoring.
#
# MEDIUM-AGNOSTIC, AND THE WINE HALF IS MEASURED RATHER THAN ASSUMED. The same term is in
# every medium's balance because the physics is the same. In WINE it is worth 0.0007 pH,
# for the identical geometric reason D-178 used to REJECT phosphate for beer: wine's pH
# (~3.3) sits ~3 units BELOW the apparent pKa, so <0.1 % of the dissolved CO2 is dissociated
# there, against ~4.5 % at beer's pH. Over a 400-day aged wine every output moves by <=1e-5
# relative (worst: A420, 1.1e-5). Those numbers are the reason there is no medium key here:
# scoping it to beer would be a preference wearing physics' clothes.
#
# THE ACCEPTED DEVIATION THAT COMES WITH IT. This engine has no racking or degassing verb, so
# a modelled wine is a SEALED wine and stays saturated for the whole aging span. Real still
# wine is racked and degassed and finishes well below saturation. The model is self-consistent
# — a sealed vessel at equilibrium with its own headspace IS saturated — and the gap costs the
# <=1e-5 measured above. Recorded, not tuned.
#
# SCOPE, stated because it is a limitation and not a rounding: the CO2 partial pressure is
# fixed at 1 atm. There is no vessel-pressure scenario field and this beat does not invent one
# (that is a scenario concept, not a parameter). Real tanks carry metres of hydrostatic head
# and finish HIGHER than this says; the EBC-tube trials this axis is validated against do not,
# which is why 1 atm is right for the target and an under-estimate for a brewery.
#
# THE CROSS-CHECK, which is independent of every number below. "The Chemistry of Beer"
# (Bamforth ed.) sec 6.7.1 prints, as an OUTCOME rather than a constant, that beer contains
# 1.2-1.7 volumes of CO2 after a normal nonpressurized fermentation, with 1 volume = 0.196 %
# by weight => 2.35-3.33 g/L. The model gives 2.00 g/L at 15 C. It lands BELOW that band, and
# the head-free 1-atm scope above is why: reproducing 1.7 volumes at 1 atm would need a
# fermentation at -2 C. Pinned as a directional check (model <= the band's low edge), never as
# a target to hit — the two are not the same quantity.

# -- Apparent first dissociation constant of dissolved CO2 ----------------------
#
# APPARENT, and the word is load-bearing. The true carbonic-acid pKa1 is 3.7, but only <1 %
# of dissolved CO2 is actually H2CO3 (hydration constant pKh = 2.8); the constant quoted for
# practical work references the TOTAL dissolved CO2 pool, which is exactly what this model's
# pool is. Using 3.7 here would over-state the anion charge by ~500x.
pKa_carbonic_1:
  value: 6.428
  unit: "pH units"
  tier: plausible
  uncertainty: { low: 6.40, high: 6.456, note: "BOTH EDGES PRINTED-derived, from two independent texts at two temperatures: 6.40 is Understanding Wine Chemistry 2e Fig 3.8 ('Apparent pKa1 of CO2 = 6.4') at 25 C; 6.456 is Wine Flavour Chemistry Eq 3.7 ratio (4) ([H+][HCO3-]/([CO2]+[H2CO3]) = 3.5e-7) at 18 C. The nominal is the CONSTRUCTED midpoint and is NOT a third source. Part of the span is the sources' own 18-vs-25 C difference, which is an ACCEPTED DEVIATION: this pKa ships temperature-flat beside a temperature-DEPENDENT solubility, so the asymmetry is named here rather than left for a reader to find." }
  provenance:
    source: "Waterhouse, Sacks & Jeffery, Understanding Wine Chemistry (2nd ed.), sec 3.7 and Fig 3.8 (values from Wang et al. and references therein); corroborated by Clarke & Bakker, Wine Flavour Chemistry sec 3.8.2, Eq 3.7."
    conditions: "aqueous, 18-25 C; an APPARENT (concentration-based) constant referenced to TOTAL dissolved CO2, not to H2CO3. Applied to beer and wine as an apparent constant, exactly as every other pKa in this file is (decision D-18)."
    notes: "The second dissociation (pKa2 = 10.3) is omitted, not deferred: at pH 4-5.5 the carbonate CO3(2-) fraction is below 1e-9, so a second proton would be arithmetic on nothing. Carbonic acid is therefore MONOPROTIC here, which is also why it never reaches the n-protic branch. Read by the charge balance (acidbase.charge_residual) and DELIBERATELY NOT by titratable_acidity -- brewers and winemakers degas before titrating, and OIV titratable acidity explicitly excludes carbonic acid, which the exclusion here reproduces (see the sulfurous-acid header above for the same convention)."

# -- Henry's-law solubility of CO2 in the beverage ------------------------------
#
# EACH EDGE ON ITS OWN GROUND (the D-173/D-174 discipline), and the nominal is neither edge.
# The nominal is the only value in the sources that is a Henry constant, measured in BEER, at
# exactly this block's reference temperature. The low edge is water. The high edge is the same
# book's OTHER in-beer statement, which disagrees with its own constant by 10 %.
H_co2_beverage:
  value: 2.302
  unit: "g/(L*atm)"
  tier: plausible
  uncertainty: { low: 2.282, high: 2.539, note: "LOW is CONSTRUCTED: Sander's compilation value for WATER (3.4e-4 mol/(m3*Pa) at 298.15 K) transferred to 283.15 K with vant_hoff_co2_solubility, = 2.282. Beer sitting 0.9 % ABOVE water is the direction ethanol predicts, so this edge is a floor rather than a rival. HIGH is CONSTRUCTED from the SAME book as the nominal: 'about 1.8 grams of carbon dioxide in 12 ounces' held at '1.7 atmospheres' at 4.5 C => 2.983 g/(L*atm), transferred to 283.15 K => 2.539. So the source states its own constant two ways that differ by 10 % once put on one temperature [[feedback-a-note-can-state-its-span-twice]] -- that internal spread IS this band, not a symmetric guess around the nominal." }
  provenance:
    source: "Pelter & Hopkins (eds.), The Chemistry of Beer: The Science in the Suds, ch. 13: 'The Henry's law constant for carbon dioxide in beer at 10 C (50 F) is 0.0798 volumes of gas (STP) per volume of beer per psi, 1.17 volumes per atmosphere, 0.0523 mole per liter per atmosphere or 2.30 grams per liter per atmosphere.' Low edge from Sander, R. (2023), 'Compilation of Henry's law constants for water as solvent', via henrys-law.org CAS 124-38-9 (recommended entry, Burkholder et al. 2019)."
    conditions: "BEER, 10 C, 1 atm CO2 partial pressure. Value is the solubility at unit partial pressure, so the model's saturation concentration at 1 atm equals it after the van 't Hoff transfer to the run's own temperature."
    notes: "The source states the same constant FOUR ways (volumes/psi, volumes/atm, mol/L/atm, g/L/atm) and all four agree to <1 % (0.0523 mol/L * 44.009 g/mol = 2.302; 1.17 vol * 1.96 g/L/vol = 2.29), which is what makes the transcription checkable [[feedback-transcribe-tables-not-prose]]. IN-BEER vs IN-WATER: Sander's water value at the same 10 C is 2.282 g/(L*atm), i.e. beer is 0.9 % above water -- so this parameter is BEER-specific in provenance but medium-agnostic in use, and applying it to wine (higher ethanol, which RAISES CO2 solubility) is an extrapolation that errs low. Understanding Wine Chemistry sec 3.7 states directly that solubility differences across the ethanol range of wine are small."

# -- The reference temperature the solubility constant is quoted at -------------
#
# PINNED ZERO-WIDTH ON PURPOSE, the same call as peptide_buffer_capacity_beer (D-179): this
# is not an independently measurable quantity, it is half of ONE measurement. H_co2_beverage
# and this temperature are a PAIR -- banding the temperature while holding the constant would
# sample (constant, temperature) combinations that reproduce no measurement at all.
T_ref_co2_solubility:
  value: 283.15
  unit: "K"
  tier: plausible
  uncertainty: { low: 283.15, high: 283.15, note: "ZERO-WIDTH BY CONSTRUCTION. The source prints '10 C (50 F)' as the condition of its constant, so this carries no measurement error of its own; its uncertainty lives entirely in H_co2_beverage's band, which was built by transferring rival statements TO this temperature." }
  provenance:
    source: "Pelter & Hopkins (eds.), The Chemistry of Beer: The Science in the Suds, ch. 13 -- the stated condition of the Henry constant above."
    conditions: "the temperature at which H_co2_beverage is quoted; the van 't Hoff transfer is exactly 1 here, so at 10 C the printed constant is used unscaled (the T_ref idiom of the Arrhenius modifiers, D-11)."
    notes: "Distinct from the engine's shared `T_ref` (293.15 K, the temperature the GROWTH and UPTAKE rate constants are anchored at, wine_generic.yaml). Two different measurements anchored at two different temperatures; merging them would silently move this solubility by 25 %. tier=plausible rather than validated so it cannot RAISE the derived pH tier above what acidbase.ph_tier floors it at."

# -- Temperature dependence of CO2 solubility -----------------------------------
vant_hoff_co2_solubility:
  value: 2300.0
  unit: "K"
  tier: plausible
  uncertainty: { low: 2300.0, high: 2400.0, note: "BOTH EDGES PRINTED, in the same compilation: 2300 K is the RECOMMENDED entry (Burkholder et al. 2019, a literature review, the compilation's most reliable class); 2400 K is what several independently measured entries (Weiss 1974, Crovetto 1991) carry. The nominal sits ON the low edge deliberately -- it is the recommended value, not a midpoint -- which means a low-edge ensemble member is bitwise identical to the nominal one [[feedback-nominal-on-a-band-edge-is-not-inertness]]; classify over the band INTERIOR if this parameter is ever screened for inertness." }
  provenance:
    source: "Sander, R., 'Compilation of Henry's law constants for water as solvent', via henrys-law.org, CAS 124-38-9: recommended Hscp = 3.4e-4 mol/(m3*Pa) at 298.15 K with d ln(Hscp)/d(1/T) = 2300 K (Burkholder et al. 2019); other entries 2300-2400 K. This compilation is the source Understanding Wine Chemistry Fig 3.9 itself cites for the same curve."
    conditions: "CO2 in WATER, near 298.15 K; the van 't Hoff coefficient -d ln H / d(1/T), applied here to a BEER-anchored constant. Borrowing water's temperature SHAPE is licensed by the anchor itself: the in-beer constant at 10 C (2.302) and water's at 10 C (2.282) agree to 0.9 %, so the two liquids are not distinguishable at this precision."
    notes: "Enters as C_sat(T) = H_co2_beverage * exp(coefficient * (1/T - 1/T_ref_co2_solubility)) -- solubility FALLS as temperature rises, which is why the sign works out to a plain positive coefficient here rather than the negated E_a/R of the Arrhenius factor. Deliberately NOT expressed as an enthalpy in J/mol: the compilation prints kelvin, and converting would add a derived step to a transcribed number for no gain [[feedback-a-text-screen-has-units-and-self-reference]]. At the coefficient's own band this is worth ~1 % on the saturation concentration at 15 C, so it is the least consequential of the three."

# =============================================================================
# Mean charge per mole of ASSIMILABLE NITROGEN (decision D-209)
# =============================================================================
#
# The assimilable-nitrogen pool is not electrically neutral. It is ammonium plus a mixture of
# amino acids whose side chains are charged at fermentation pH, so it sits on the CATION side
# of the charge balance, and the yeast drawing it down is therefore an acidification: by
# electroneutrality the liquid replaces the charge it loses with an equal charge of protons.
#
# THE MECHANISM IS SOURCED, and the obvious reading of it is wrong. Ribereau-Gayon, Handbook
# of Enology Vol 1 sec 2.4.2: the permease "couples the transport of an amino acid molecule (or
# ammonium ion) with the transport of a hydrogen ion ... Obviously, the proton that penetrates
# the cell must then be exported to avoid acidification of the cytoplasm ... The membrane
# ATPase ensures the excretion of the hydrogen ion across the plasmic membrane, acting as a
# proton pump." The symport proton is RE-EXPORTED, so the symport cycle is proton-neutral and
# contributes nothing net. That is why one number per medium suffices, and it CORRECTS the way
# D-208 sec 6 framed the candidate: the two opposing halves are not "ammonium exports protons /
# symport imports them", they are the CATIONIC species (ammonium, arginine, lysine, histidine)
# against the ANIONIC ones (aspartate, glutamate).
#
# THE DENOMINATOR IS ELEMENTAL NITROGEN, not alpha-amino groups, because that is what the `N`
# slot holds: seeded as g N/L from `yan_mgl`, drawn against `biomass_N_fraction` = 0.114 g N per
# g cell. So arginine, which carries FOUR nitrogens per +1 charge, contributes +0.25 per mole N
# and not +1. Reversing that convention inflates the cationic half roughly fourfold.
#
# PROLINE IS EXCLUDED FROM BOTH, on source in both media: it is Jones & Pierce Group D for beer
# ("Group D: Proline" -- Pelter & Hopkins, The Chemistry of Beer, the A-D groups being ranked by
# uptake rate, with ammonia in Group C i.e. assimilated), and for wine "Yeasts do not utilize
# proline during fermentation, although it is one of the principal amino acids found in must"
# (Handbook of Enology Vol 1). The `N` slot is assimilable nitrogen by definition, so a
# total-FAN denominator would be a scope mismatch corrupting both the charge and the moles.
#
# CHARGES are speciated from standard backbone and side-chain pKa values at the medium's own
# starting pH. The pool's real charge is mildly pH-dependent and this is held constant: measured
# at +0.177 for wort at pH 5.65 rising to +0.188 at pH 4.86, a 6 % drift across a whole ferment.
# Held constant in the direction of UNDERSTATEMENT.
#
# SCOPE -- THIS IS THE CHARGE HALF ONLY, SO BOTH VALUES ARE LOWER BOUNDS. Neither medium models
# the assimilable pool per species (beer has no amino-acid slots at all, D-32), so assimilation
# removes the pool's charge but not its BUFFERING, and a real wort's amino acids buffer near
# beer's own pH. Buffer removal pushes pH the SAME way, so the omitted half can only make the
# acidification larger. Two further sources of the same sign are identified and NOT built:
# K+/H+ antiport (yeast accumulates potassium; Peyer Table 2 gives wort K+ at 550 mg/L) and the
# precipitation of buffering high-molecular protein as trub. A closure that credits all of the
# measured acidification to this term alone would be over-claiming.
#
# SCOPE -- BOTH VALUES ARE MUST/WORT COMPOSITION AVERAGES AND DO NOT APPLY TO **DOSED** NITROGEN.
# `add_dap` doses diammonium phosphate, in which EVERY nitrogen arrives as NH4+, so the correct
# zbar for the dosed increment is exactly +1.0 -- about 3x the wine average below.
#
# **BOTH HALVES OF THIS SCOPE LINE ARE BUILT AT D-210**, and the note is kept rather than deleted
# because the shape of what it got right and wrong is the useful part. The dosed increment now
# carries +1.0 through the `nitrogen_charge_excess` state slot (see additions.yaml's
# dap_nitrogen_charge), and DAP's phosphate counter-anion is in the charge balance as the
# `phosphate` slot (dap_phosphate_fraction, with pKas in the dosed-phosphate block below).
#
# WHAT D-210 CORRECTS HERE: "a DAP-dosed wine's acidification is UNDERSTATED, by roughly 3x on
# the dosed fraction alone". The 3x is right about the EXCURSION and wrong about the endpoint. On
# a wine that ferments dry the dosed nitrogen is fully consumed either way, so the pool's charge
# returns to ~0 whatever zbar was and the nitrogen half moves the final pH by exactly 0.0; what
# it moves is the dose-time bump (+0.242 pH at 1.1 g/L instead of +0.066) and any run left
# holding nitrogen -- a stuck ferment, a sweet wine, a horizon short of dryness (+0.228 pH). The
# PERMANENT acidification is entirely the phosphate this note filed second: -0.159 pH at 1.1 g/L,
# -0.043 at a 0.3 g/L cellar dose. Splitting the pool per source turned out unnecessary -- a
# charge-per-mole is invariant under proportional drawdown, so one dimensionless slot re-mixed at
# each dose does what a second nitrogen pool would have.

nitrogen_uptake_charge_beer:
  value: 0.23418212124814006
  unit: "mol+/mol N"
  tier: plausible
  uncertainty: { low: 0.22348212124814007, high: 0.24498212124814006, note: "BOTH EDGES DERIVED, and the band is the wort AMMONIUM range alone (Peyer Table 2's printed 25-30) -- the amino-acid contribution is a single composition column with no band of its own. A SCOPE ALTERNATIVE, deliberately NOT folded in as extra width: Table 2's column header says only 'mg/L', and reading its ammonia row as NH3 MASS rather than as N gives 20.6-24.7 mg N/L, which would move this by -0.0307. The as-N reading is nominal because the same column's free-amino-acid row is demonstrably as-N (see notes), and mixing a units fork into a parameter band would disguise it as measurement error. THE BAND WIDTH IS UNCHANGED BY D-239 (0.0215, both edges shifted by the same constant): the split below is a re-partition of the nominal, not new uncertainty." }
  provenance:
    source: "DERIVED. Amino-acid composition: Peyer, S. M. (2017), PhD thesis, University College Cork (CORA 10468/4694), Table 16 control column -- 18 free amino acids in mg/L in a malt wort. Wort ammonium: the same thesis, Table 2 ('Malt wort nutrients (10-12 degP)'), row 'Ammonia 25-30', compiled there from Clapperton 1971, Jancar 1983, Lie 1974 and MEBAK 2011. Assimilated set (proline excluded) on Jones & Pierce's A-D uptake groups via Pelter & Hopkins, The Chemistry of Beer. Mechanism: Ribereau-Gayon, Handbook of Enology Vol 1 sec 2.4.2."
    conditions: "malt wort, charge-weighted over the 18 measured free amino acids plus ammonium, per mole of ELEMENTAL nitrogen. SINCE D-239 THIS IS NOT THE POOL'S WHOLE CHARGE: the side chains of aspartate, glutamate and histidine are carried by the charge balance itself (wort_aspartate_per_n and its two siblings), so what stays here is everything else PLUS those three counted at their FULLY PROTONATED charge. At the wort's pH 5.65 the two halves cancel term for term and the pool's net charge is 0.1772 per mole N, D-209's own number, EXACTLY -- asserted as a test rather than trusted. Away from 5.65 the net now MOVES, which is the point: 0.1772 at pH 5.65, 0.1877 at 4.86, 0.1988 at 4.30. D-209's scope line measured the real pool at +0.177 rising to +0.188 at pH 4.86 and called the frozen value an understatement; three species of it are no longer frozen. Table 16's wort is diluted 50:50 and citrate-buffered, so only its RATIOS are used -- the buffer is citric acid plus trisodium citrate and adds no nitrogen, and 169/78 mg/L FAN for the undiluted vs diluted wort (that thesis's Table 15) confirms the 2x scaling."
    notes: "UNITS CROSS-CHECK, because Table 2's column is headed only 'mg/L': summing Table 16 as elemental nitrogen and scaling to full strength gives 164 mg N/L, INSIDE Table 2's printed 150-230 free-amino-acid figure, whereas the same amino acids as COMPOUND mass would be ~1037 mg/L, far outside it. So that column reads as mg N/L and the ammonia row two lines below it is read the same way. Composition is a DIFFERENT wort from Tyrell 2013's, which is what the acceptance test scores against -- an accepted deviation, stated not tuned. Per-species arithmetic: arginine +1 over 4 N = +0.25/N; lysine +1 over 2 N = +0.5/N; histidine +0.71 (imidazole pKa 6.04) over 3 N; aspartate and glutamate -1 over 1 N each; asparagine, glutamine and tryptophan are zwitterions with a non-ionisable second nitrogen, so 0. NEVER COMPARE THIS NUMBER TO D-209's 0.1772 AND CONCLUDE IT DRIFTED -- it is the same measurement in a different partition, and the +0.05698 difference is exactly the three side chains' dissociation at pH 5.65 (0.029747 aspartate + 0.021231 glutamate + 0.006005 histidine). The quantity that is comparable across the two records is the NET, and the test named in `conditions` is what holds it there. tier=plausible on the tiers.py definition (sound mechanism with literature support, hard to validate quantitatively) -- speculative would drag WINE's ph_tier down from plausible for a term wine's own inputs support just as well, which is the D-179 asymmetry in reverse."

nitrogen_uptake_charge_wine:
  value: 0.3245
  unit: "mol+/mol N"
  tier: plausible
  uncertainty: { low: 0.2105, high: 0.4098, note: "BOTH EDGES DERIVED from the Handbook's own printed partition of must nitrogen: ammonium 3-10 % of total N against amino acids 25-30 %, so the ammonium-to-amino-acid-nitrogen ratio spans 3/30 = 0.10 to 10/25 = 0.40. Roughly 2x wide, and honestly so -- that ratio is the dominant term. The amino-acid half alone is +0.1103, already ~3x beer's +0.0395, because must is arginine-dominated (220.5 mg/L of 2258) while carrying relatively little aspartate and glutamate. Nominal is evaluated at must pH 3.4 with the ratio at its midpoint." }
