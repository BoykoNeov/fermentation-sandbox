    conditions: "grape must at pH 3.4, charge-weighted over the 19 tabulated amino acids MINUS proline, plus ammonium, per mole of ELEMENTAL nitrogen. Assimilable pool = ammonium + amino acids - proline, on the Handbook's own statement about which fractions the yeast can use."
    notes: "TABLE SELF-CHECK, and it is why this column was chosen over the other four: its 19 printed values sum to 2153.9 against a printed total of 2258.0, and the table's own footnote says the total 'Includes ethanolamine, gamma-aminobutyric acid, beta-alanine but not ammonia' -- so the 104.1 residual is exactly those three named species. The 1984 columns have an OCR-dropped cell and cannot be reconciled that way, so they are not used [[feedback-a-notes-field-is-unchecked-storage]]. The excluded 104.1 mg/L (4.6 % of the total) contains ethanolamine, which is cationic, so omitting it understates this value slightly -- the same direction as every other simplification here. Ammonia is EXPLICITLY absent from this table, which is why its share comes from a second source rather than being read off the same column. Cystine is carried as the dimer (2 N, neutral); ornithine is 0.0 in this must. Wine is far better buffered than beer (measured local buffer capacity 48 vs 2-5 mEq/L/pH), so this larger zbar moves an anchored wine's finished pH only about -0.05, against beer's -0.4."

# -- The three wort amino-acid SIDE CHAINS that buffer in beer's window -- decision D-239 ----
#
# WHAT THIS PAIR OF BLOCKS FIXES. `peptide_buffer_capacity_beer` is back-solved so the model's
# wort reproduces Peyer's published buffering capacity of 1.18. That back-solve ran on eight
# organic acids and the peptide lump and NOTHING ELSE, so the free amino acids' share of a real
# wort's buffering had nowhere to go but into the lump. The lump is permanent; the amino acids
# are eaten inside 24 h. So beer's wort buffered correctly at t=0 and went on buffering like a
# wort for the rest of the ferment. D-239 splits the two fates apart. The TOTAL is unchanged --
# the lump re-roots 1.5481 -> 1.4351 g/L and the wort still reproduces Peyer's 1.18 exactly --
# which is why the t=0 anchored pH is bitwise what it was and only the LATER course moves.
#
# WHY THESE THREE AND NO OTHERS, and why one group each. Peyer sec 5.5, quoting Li et al. 2016:
# "because of the very low or very high pKa values of the alpha-carboxylic acid group (range
# 1.7-2.2) or alpha-amino group (range 8.8-10.6), respectively, most amino acids contribute only
# poorly to the BC in the relevant pH range ... Little contribution to the wort buffer system is
# made by aspartate (pKa 3.86), glutamic acid (pKa 4.25) and histidine (pKa 6.04), which account
# for ca. 10 % of the total BC at a wort pH of 5.5." That sentence is D-178's phosphate refusal
# in the source's own words. It is also the sentence M_GLUTAMIC's docstring has quoted since
# D-179 as the reason the LUMP is peptides -- read then as a licence to omit free amino acids,
# and it is equally a statement that 10 % of a wort's buffering sits in three species this model
# did not carry. Computed off Peyer Table 16's own composition, this build's three side chains
# are 6.7 % of the model wort's local buffering at pH 5.5 and add 11.5 % of 1.18 in Peyer's own
# titration frame; the source does not say which frame its "ca. 10 %" is in, so both are quoted
# and neither is called the reconciliation alone.
#
# The alpha groups are DECLINED, not deferred: the source prints them only as RANGES over "most
# amino acids", and inventing a per-species value from a range is the transcription error. They
# stay inside the lump, as do all fifteen other amino acids -- one rule applied uniformly.
# Measured, carrying the three the textbook triprotic way instead moves the lump to 1.4207 g/L
# and day 7 by a further 0.0026 pH.
#
# NOT A SECOND NITROGEN POOL. No state slot is added (beer has no amino-acid slots, D-32): the
# concentrations are these ratios times the `N` slot, so the pool drains with uptake and no
# nitrogen is stored twice. Proportional drawdown is D-210's own measurement (~88 % of the `N`
# inflow is an un-draw, composition unchanged), the same fact `nitrogen_charge_excess` rests on.

