# -- Arrhenius temperature dependence (per-rate, decision D-11) ----------------
# INERT for M1: runs are isothermal at T_ref so f = 1 and these never bite.
# Carried for Tier-2 readiness. We carry the verifiable wine-derived value
# (Coleman 2007) as a yeast-generic placeholder, tagged speculative.
#
# CORRECTION (D-19 sourcing step, 2026-06-30): an earlier note here claimed
# de Andres-Toro 1998 "fit E_a ~ 35 kJ/mol for growth and ethanol production (per
# secondary reports)". That secondary figure is WRONG. de Andres-Toro's primary
# table - now read IN-SOURCE via the open CC-BY reproduction Pilarski & Gerogiorgis
# 2022 (Processes 10(11):2400, doi:10.3390/pr10112400) Table 1, form
# mu_i0 = exp(A_i + B_i/T), apparent E_a = -B_i*R - gives:
#   growth  mu_X0 (A=108.31, B=-31934) -> apparent E_a ~ 265 kJ/mol
#   ethanol mu_e0 (A=3.27,   B=-1267)  -> apparent E_a ~ 10.5 kJ/mol
#   sugar   mu_S0 (A=-41.92, B=+11655) -> apparent E_a ~ -97 kJ/mol (NEGATIVE)
# None is ~35 kJ/mol. These are extreme, internally-inconsistent lumped empirical-fit
# artifacts (the model absorbs lag/growth/death transitions into each apparent E_a),
# which is precisely why we do NOT adopt de Andres-Toro's temperature sensitivity and
# carry the clean Coleman-derived value instead. The band low (30,000) below was
# justified by the now-debunked "~35 kJ/mol beer figure"; it is RETAINED unchanged here
# (M1 value/band not silently rewritten) pending a deliberate review - flagged in D-19.

E_a_growth:
  value: 55900.0
  unit: "J/mol"
  tier: speculative
  uncertainty: { low: 30000.0, high: 63000.0, note: "low end retained from the now-debunked '~35 kJ/mol beer figure' (see header CORRECTION); high end ~Coleman wine ~56 kJ/mol" }
  provenance:
    source: "author estimate (yeast-generic; derived from Coleman 2007 wine fit, doi:10.1128/aem.00670-07)"
    conditions: "generic ale yeast; equivalent Arrhenius E_a at T_ref = 293.15 K"
    notes: "NO LONGER EXACTLY INERT AT THE SEC 2.2 BENCHMARK -- D-221 CORRECTS THIS NOTE, in the same way and for the same reason as E_a_uptake below (read that entry for the argument). At the RETIRED 20 C frame the benchmark could not see this parameter at all (f = 1 at T_ref, span 0.0000 d across the printed 30,000-63,000 band). D-221 re-temperatured the criterion to 15 C, where the same band spans 0.2917 d (8.79 -> 9.08 d). That is a sixth of E_a_uptake's 1.75 d, which is consistent with this file's header note that growth is the weaker lever on attenuation -- but it is not zero, so 'inert' is no longer the word. CORRECTION (D-19): de Andres-Toro's primary growth term has apparent E_a ~265 kJ/mol (NOT the ~35 kJ/mol secondary figure once cited here) - an extreme lumped-fit artifact (see header). We carry the clean verifiable Coleman-derived value; the band is unchanged pending a deliberate review (flagged in D-19)."

E_a_uptake:
  value: 55100.0
  unit: "J/mol"
  tier: speculative
  uncertainty: { low: 30000.0, high: 63000.0, note: "low end retained from the now-debunked '~35 kJ/mol beer figure' (see header CORRECTION); high end ~Coleman wine ~55 kJ/mol. D-217 RAN the review this band was 'pending': the local corpus (26 files -- 24 texts, Peyer's thesis, Tyrell in full) yields NOTHING that could re-source it. 75 hits over 10 patterns (activation energy, Arrhenius, Q10, temperature coefficient, kJ/mol, kcal/mol, van't Hoff, maltose transport, sugar uptake rate, fermentation rate x temperature), all 75 read: textbook definitions, wine-AGING chemistry (the one real value is SMM hydrolysis at 186 kJ/mol), free energies of fermentation, ubiquinone Q-10, and qualitative 'warmer ferments faster' prose. ZERO give an activation energy or a Q10 for wort sugar uptake, in beer OR wine. The other half of the search -- a convertible two-temperature rate pair, which contains none of those ten patterns -- got its OWN census: 6 pattern families over the 7 beer sources, 31 hits, 28 distinct, all read, and none convertible. The closest pairs a lager below 12 C with an ale above 20 C: two SPECIES, two worts, and the duration attached to neither. A rate ratio needs the same yeast on both sides and no beer text here prints one. The band therefore stands unchanged for want of a source, NOT for want of looking, and the low edge remains the debunked figure's residue -- do not adopt it (D-216 sec 6)." }
  provenance:
    source: "author estimate (yeast-generic; derived from Coleman 2007 wine fit, doi:10.1128/aem.00670-07)"
    conditions: "generic ale yeast; equivalent Arrhenius E_a at T_ref = 293.15 K"
    notes: "NO LONGER INERT AT THE SEC 2.2 BENCHMARK -- D-221 CORRECTS THIS NOTE. What was true, and stays true about the RETIRED frame: at the isothermal 20 C the benchmark could not see this parameter EXACTLY, not approximately -- D-217 swept -97,000 to +80,000 J/mol and days-to-FG moved 0.0000 d, because 20 C is exactly T_ref. D-216 sec 6 built on that exactness to call this the ONE parameter that can move Tyrell's 15 C course without moving Sec 2.2. D-221 re-temperatured the Sec 2.2 criterion from 20 to 15 C (D-220 recovered Foster 2022's own course: the brief's 5-7 d duration is real at 15 C, where three commercial ale controls take 5.06-6.26 d, and impossible at the 20 C it was asserted at, where they take 2.91-3.77 d). 15 C is Tyrell's trial temperature EXACTLY, so both of beer's speed anchors now sit at one temperature and take an identical Arrhenius factor: this parameter is degenerate between them and moves both together. There is no weaker version of the decoupling claim to fall back on -- across the printed 30,000-63,000 band the criterion now moves 1.75 d against a window only 2.0 d wide, taking this parameter from the criterion's most inert to one of its strongest levers. The low band edge does not rescue the criterion either (30,000 J/mol gives 7.69 d, still outside 5-7). D-217's refusal to re-source this parameter rests on the corpus having nothing and is UNTOUCHED. Guarded in tests/test_organic_acids.py sec 11. The lever is worth 0.0267 of Tyrell's day-2 fraction across the whole band at Tyrell's own counted pitch (0.162 at 30,000 J/mol to 0.135 at 63,000, i.e. a 3.67x-4.39x shortfall against his measured 0.594) and EXACTLY ZERO at T_ref, so its existence is conditional on that trial running cool. D-217 measured 0.045 (2.81x -> 2.41x) at the RETIRED 1.0 g/L scenario pitch; D-222 put the scenario on Tyrell's counted 0.3984 g/L and the lever shrank with the biomass it acts on. CORRECTION (D-19): de Andres-Toro's primary ethanol-production term has apparent E_a ~10.5 kJ/mol and its sugar-uptake term is NEGATIVE (~-97 kJ/mol) - NOT the ~35 kJ/mol secondary figure once cited here (see header). D-217 note: -90,000 J/mol would land Tyrell's day 2 almost exactly, within 8 % of that fitted term -- a coincidence that must NOT be read as a fit. It is a lumped coefficient of de Andres-Toro's own rate law, it is the wrong SIGN for the brewing commonplace that warmer ferments faster, and on an isothermal trial it is perfectly degenerate with q_sugar_max (at the retired scenario pitch it reproduced D-216's q=1.397 row to three decimals, overshoot on days 1 and 3 included). We carry the clean verifiable Coleman-derived value; the review the band was 'pending' has now RUN and found nothing (see uncertainty note)."

