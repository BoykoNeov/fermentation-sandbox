# -- Temperature-/metabolism-driven aroma byproducts (Milestone 2, decision D-19) --
# Esters and fusel (higher) alcohols: trace pools whose run-integrated total RISES with
# temperature (ales are notably estery). SOURCED in the D-19 sourcing step (2026-06-30);
# see the wine file header for the full argument. Beer is the medium de Andres-Toro
# actually modelled, so the ester ordering source applies DIRECTLY here (their ethyl
# acetate is exactly our `ethyl_acetate` booking species). In brief:
#   * de Andres-Toro et al. 1998 form ETHYL ACETATE as dC_EA/dt = Y_EA*mu_x*X_A (read
#     in-source via the open CC-BY Pilarski & Gerogiorgis 2022, doi:10.3390/pr10112400,
#     Table 1): Y_EA=exp(89.92-26589/T) and mu_X0=exp(108.31-31934/T) give apparent
#     E_a ~221 and ~265 kJ/mol - ester formation is FAR more T-sensitive than the flux.
#     ORDERING (E_a_ester > E_a_uptake) SOURCED.
#   * MAGNITUDE not transferred: de Andres-Toro's apparent E_a's are lumped-fit
#     artifacts (their own sugar-uptake E_a is NEGATIVE, ~-97 kJ/mol), incommensurable
#     with our uptake E_a. Anchored instead to the brewing consensus (warm ferments
#     ~+50-75% esters over ~15 C => dE_a ~25 kJ/mol => E_a_ester ~80 kJ/mol).
# Values MIRROR the wine file (byproduct kinetics are yeast-generic at this stage); the
# ordering source is if anything STRONGER for beer (de Andres-Toro IS a beer model).
#
# CARBON ACCOUNTING - option (a)/a1 (decision D-19): the ester/fusel Processes route
# their carbon OUT OF SUGAR (booked as ethyl acetate / isoamyl alcohol) and total_carbon
# weights the pools. Beer needs NO Byp carve-out: its Y_byproduct_sugar is held at 0
# (minor byproducts out of M1 scope), so no higher alcohols were ever booked in beer's
# Byp to double-count. The fusel/ester pools draw their trace sugar directly; the
# CO2-ratio benchmark stays in band (the draw is 0.19% of sugar consumed, re-measured at D-224;
# it was 0.28% at the drifted levels D-224 corrected). Carried for
# both media because the shared byproduct Processes declare these in `reads`; a value is
# required per medium (D-1, no silent default).
#
# KEY ORDERING CONSTRAINT (decision D-19): each E_a must EXCEED E_a_uptake (55,100
# J/mol) so the run-integrated byproduct total rises with temperature - see the wine
# file header for the exp(-(dE_a/R)(1/T-1/T_ref)) argument. NB beer's own E_a_uptake is
# itself a speculative Coleman-carried placeholder (55,100; see that entry), so the
# constraint is relative to the value in THIS file; the de Andres-Toro ester ordering
# holds against any plausible fermentative-flux E_a.

# --- The three ester synthesis rates (decision D-96) -------------------------------------
# Each k is anchored INDEPENDENTLY to its own molecule's measured range in ALE - see the wine
# file for the full rationale (splitting one lumped `k_ester` by a fitted ratio would have
# smuggled back the fabricated composition constant the D-96 split exists to remove). Note the
# ordering genuinely DIFFERS from wine and is not a rescaling of it: ale carries LESS ethyl
# acetate than wine (~20 vs ~50 mg/L) but MORE isoamyl acetate (~2 vs ~1.4 mg/L) - the banana
# note is an ale signature, and independent per-molecule anchoring is what lets the two media
# disagree in that direction at all. A single ratio-split k could only have scaled them together.

k_ethyl_acetate:
  value: 1.39e-4
  unit: "1/h"   # d(ethyl_acetate)/dt = k_ethyl_acetate * X * S/(K_su+S) * f(T)
  tier: speculative
  uncertainty: { low: 6.93e-5, high: 2.08e-4, note: "band spans ethyl acetate 10.00-30.02 mg/L in the finished beer -- EXACTLY the 10-30 ale range in this parameter s source field, computed from runs at the two edges rather than glossed. RE-DERIVED AT D-224. Its predecessor was x0.5/x1.5455 of the nominal, a round pair of k values whose stated span was approximate (it landed 10.66-32.95 at D-99 and 7.93-24.52 at the level D-223 left); rescaling those multipliers with the D-224 nominal would have put the top at 31.03 mg/L, i.e. OVER this molecule s own sourced range AND over the Meilgaard threshold it is measured against. THE SENSORY CONSEQUENCE IS THE REASON THE EDGES ARE COMPUTED AND NOT RESCALED, and it is a real change: the band top now reads OAV 1.001 against the ~30 mg/L beer threshold where before D-224 it read 0.817. That is a RESTORATION, not an over-reach -- the source says a sound ale sits AT OR BELOW the threshold, so the top of the molecule s own range should touch it, and the pre-D-224 band could not reach it only because the nominal was 21 % low. Jointly with q_sugar_max s low edge the reachable maximum is 33.36 mg/L, OAV 1.112; guarded and stated, never claimed away. Contrast k_isoamyl_acetate, which IS rescaled with its nominal (its stated span and its actual one agree), and the five Ehrlich k, whose multipliers were wrong by 2.05x." }
  provenance:
    source: "author estimate bounded by ETHYL ACETATE's own measured range in beer (~10-30 mg/L in ale; Meilgaard 1975, MBAA Tech. Q. 12:151-168 gives a beer flavour threshold ~30 mg/L, so sound ale sits at or below it); structurally after de Andres-Toro et al. 1998 (ethyl acetate ~ growth flux, beer-specific), read via Pilarski & Gerogiorgis 2022 (doi:10.3390/pr10112400)"
    conditions: "ale yeast; ATF1/alcohol-acetyltransferase acetate ester, coupled to the biomass-catalysed sugar flux. k set to land finished ethyl acetate at 20.0 mg/L, mid-band of its 10-30 mg/L ale range, in a 21 d / 20 C run with the volatilization sink active (D-224 added this clause: the five Ehrlich k in this file have always carried their landing level here and the two ester k did not, which is why a test could not read the target off the same field for all seven)"
    notes: "Read by EsterSynthesis for the `ethyl_acetate` pool. Anchored to ETHYL ACETATE ALONE in ale, not to a share of a lumped total (D-96). Calibrated against the FINISHED beer with the EsterVolatilization sink active: a 21-day run at 20 C lands 20.06 mg/L liquid, mid-band for this molecule's own 10-30 mg/L ale range and below Meilgaard's ~30 mg/L threshold, so a sound ale correctly reads OAV < 1 (0.669) on the solventy note. THAT IS A NOMINAL CLAIM AND THE BAND IS DRAWN: this k's own high edge lands 30.02 mg/L (OAV 1.001) and its joint corner with q_sugar_max's low edge lands 33.36 (OAV 1.112), so the solventy note IS reachable and is meant to be -- an ale at the top of its ethyl-acetate range is at its threshold, which is what the source says. Both numbers are guarded; see the band note and D-224. Note beer strips far less than wine (15.3% vs ~45% of the ester synthesised) - less sugar means less CO2 evolved to carry ester into the headspace. RE-ANCHORED AT D-224, 1.1e-4 -> 1.39e-4 (x1.2636), AND THE POINT IS WHAT MADE IT NECESSARY: this pool is coupled to BIOMASS-HOURS (k.X.S/(K_su+S).f(T)), so the finished level is a function of how FAST the beer ferments, and D-223's re-anchoring of q_sugar_max 0.5 -> 0.72 dropped it to 15.87 mg/L without any test seeing it. The 21-day/20 C frame is load-bearing and is stated rather than implied: E_a_esters is 200 kJ/mol, so the same run at 15 C lands 6.10 mg/L, BELOW this molecule's own 10 mg/L floor. 20 C is a typical ale ferment; the 15 C in Sec 2.2's duration criterion is Foster 2022's cool trial (D-221) and is a different frame, not a competing one. SPECULATIVE on magnitude: de Andres-Toro form ethyl acetate as Y_EA*mu_x*X_A (a growth coupling and unit system unlike our flux-coupled k), so no transferable rate constant exists; the anchor is this molecule's measured band."

k_isoamyl_acetate:
  value: 5.36e-4
  unit: "L/(g*h)"   # d(isoamyl_acetate)/dt = k_isoamyl_acetate * [isoamyl_alcohol] * X * S/(K_su+S) * f(T)
  tier: speculative
  uncertainty: { low: 1.76e-4, high: 1.12e-3, note: "band spans isoamyl acetate 0.73-4.61 mg/L, its own typical range in ale (the D-96 band, rescaled x25.4 at D-97, x1.397 at D-99 and x1.2582 at D-224 so it pins the same CONCENTRATION span throughout: the rate stays linear in k). The stated span is the MEASURED one at each re-anchoring rather than a round pair -- it read ~0.7-4 as a gloss on 0.789-5.04 before D-224, which is the shape feedback-pin-the-band-not-the-nominal warns about, one level down." }
  provenance:
    source: "author estimate bounded by ISOAMYL ACETATE's own measured range in beer (~0.5-3 mg/L in ale; Meilgaard 1975, MBAA Tech. Q. 12:151-168 gives a threshold ~1.0-1.6 mg/L and ales characteristically sit at or above it - the banana note is a recognised ale signature). The rate law's FORM is sourced separately: Fujii et al. 1998, Appl. Environ. Microbiol. 64:4076-4078 (citing Yoshioka & Hashimoto 1981, Agric. Biol. Chem. 45:2183-2190) measures ATF1's Km for isoamyl alcohol at ~29.8 mM and states that 'a major rate-limiting factor for isoamyl acetate production is the amount of isoamyl alcohol'."
    conditions: "ale yeast; ATF1 acetate ester of isoamyl alcohol, FIRST-ORDER in the `isoamyl_alcohol` precursor pool (the molecule itself since D-99, not a lump) and coupled to the biomass-catalysed sugar flux. k set to land finished isoamyl acetate at 2.2 mg/L, inside its 0.5-3 mg/L ale range and just above the Meilgaard threshold, in a 21 d / 20 C run with the volatilization sink active (D-224 added this clause; see k_ethyl_acetate for why)"
    notes: "Read by EsterSynthesis for the `isoamyl_acetate` pool - the BANANA note. Anchored to ISOAMYL ACETATE ALONE (D-96): calibrated post-stripping to 2.21 mg/L in the finished beer, inside its own 0.5-3 mg/L band and just above the Meilgaard threshold, which is the correct reading for an ale. This works out to 11.0% of ale's ethyl acetate versus ~1.5% in wine - a DERIVED difference between the media that follows from anchoring each molecule in each medium separately, and one a ratio-split of a single k could not have produced. D-97 RE-ANCHORED the value 1.2e-5 -> 3.05e-4 (x25.4, absorbing the ~0.0415 g/L `fusels` factor the new precursor term introduces) so the finished ale still lands ~2.2 mg/L - the coupling changes the YAN-response and time shape, NOT the calibration target. NOTE the media's rescale factors DIFFER (x20 wine / x25.4 beer) precisely because each medium's `fusels` level differs (51.1 vs 41.5 mg/L): the same per-medium independence D-96 established. D-99 RE-ANCHORED IT AGAIN, 3.05e-4 -> 4.26e-4 (x1.397), when speciation replaced the lump with the actual isoamyl-alcohol pool; the finished ale still lands ~2.2 mg/L. THE FACTOR MOVES THE OPPOSITE WAY FROM WINE'S (x1.397 here vs x0.502 there) AND THAT IS THE POINT: wine's precursor DOUBLED under honest anchoring (86 -> 172 mg/L) while beer's FELL (41.5 -> 30.05 mg/L), because ale's higher alcohols are far less isoamyl-dominated than wine's (~35% vs ~52% of the total). A cross-medium ratio-split could not have produced two factors in opposite directions - only anchoring each molecule in each medium separately does. That D-99 factor was EXACT, not fitted: both rates share one shape, so it was k_fusel_old / k_isoamyl_alcohol_D99 = 2.5e-3 / 1.79e-3 (1.79e-3 is the RETIRED value; see D-224). Beer's pool is 0.342 mM against ATF1's Km ~29.8 mM (87.2x below; the margin WIDENED from ~63x as the pool fell, the mirror of wine's tightening), so beer sits even more securely in the [S] << Km linear regime. D-224 RE-ANCHORED IT A THIRD TIME, 4.26e-4 -> 5.36e-4 (x1.2582), and BOTH of the figures in this sentence are things that beat restored rather than computed: between D-211 and D-223 the isoamyl_alcohol pool ran 48.26 mg/L, i.e. 0.547 mM and only 54.4x below the Km, so the printed 0.34 mM and 87x were false of the shipped model for 13 records. This ester is FIRST-ORDER in that pool, which is why it was the one of the two whose miss looked like an agreement: it inherited the precursor's 1.61x error, and 1.61 x 0.79 is 1.27, i.e. ABOVE target while ethyl acetate sat below it. Neither k was wrong about the other - see the wine file's note for why the Km is NOT a parameter (unidentifiable in this limit; this k IS the identifiable Vmax/Km ratio) and for the lump caveat D-99 retired from both files."

