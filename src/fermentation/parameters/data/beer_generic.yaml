ther way. Incidental cost of the larger pool drawing more carbon out of the shared S, measured because D-224's arm A found this channel breaking a 0.025 %-tolerance pin: packaged ethyl acetate moves -7.07e-5 %, 350x inside that tolerance. Same KNOWN SIMPLIFICATION as the wine file (D-96): an EEB1/EHT1 product sharing the ATF1 acetates' `E_a_esters`, because no separate activation energy is sourced; a per-ester E_a is the named deferred refinement."

