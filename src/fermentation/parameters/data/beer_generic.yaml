  value: -0.108
  unit: "1/degC"
  tier: speculative
  uncertainty: { low: -0.194, high: -0.033, note: "transferred from the Coleman wine fit (Table A2), same as k_prime_d itself; ale-specific value not sourced" }
  provenance:
    source: "author estimate (transferred from Coleman 2007 wine k'_d regression, doi:10.1128/aem.00670-07, Table A2)"
