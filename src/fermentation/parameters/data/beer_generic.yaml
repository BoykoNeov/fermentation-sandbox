# -- ESTER VOLATILIZATION (PHYSICAL Henry's-law gas-stripping sink, decision D-21) -----
# The SAME physical sink as wine (EsterVolatilization), with the SAME sourced, medium-
# independent partition enthalpy dH_ester_volatil - because a Henry's-law partition is a
# property of the molecule, not the beverage (Morakul et al. 2011). Beer's OPPOSITE net
# direction (liquid esters RISE with T) is NOT produced here; it comes from beer's steep
# SYNTHESIS E_a_esters (~200k, de Andres-Toro) winning over this ~100k stripping. D-21
# supersedes D-20's fudged per-medium E_a_ester_volatil (retired). See wine_generic.yaml
# and DECISIONS D-21 for the full rationale. Verified empirically (14/20/25 C): beer rise.
k_ester_volatil:
  value: 2.0e-3
  unit: "L/(g*h)"   # stripping coeff: folds q_sugar_max*co2_yield*scale*(gas-volume/Henry-prefactor) into one constant
  tier: speculative
  uncertainty: { low: 5.0e-4, high: 1.0e-2, note: "order-of-magnitude target for the absolute stripping magnitude; the T-dependence is physical (E_a_uptake + dH_ester_volatil)" }
  provenance:
    source: "author estimate (absolute stripping efficiency / gas-volume prefactor not separately sourced). Mechanism + loss form per Morakul et al. 2011 (Process Biochem 46:1125-1131)"
    conditions: "ale yeast; ester stripping coupled to the CO2-evolution (fermentative-flux x arrhenius(E_a_uptake)) proxy, first-order in liquid ester"
    notes: "Read by EsterVolatilization as the stripping coefficient (absolute magnitude only; the T-dependence is physical+sourced via E_a_uptake gas flow + dH_ester_volatil partition). Lower than wine's (2e-3 vs 5e-3) for a PHYSICAL reason, not tuning: k_ester_volatil folds q_sugar_max*co2_yield*scale (the gas-volume prefactor of the CO2 stream) into one constant, and beer's q_sugar_max is 0.5 vs wine's 0.85, so beer's lower stripping coefficient is expected. SPECULATIVE order-of-magnitude target (the residual efficiency/Henry prefactor is not separately sourced). Verified empirically (14/20/25 C): beer liquid esters ~22/72/181 mg/L (rise with T, synthesis-dominated)."

dH_ester_volatil:
  value: 45000.0
  unit: "J/mol"
  tier: speculative
  uncertainty: { low: 35000.0, high: 55000.0, note: "ethyl-acetate gas/liquid partition enthalpy; Q10 ~ 1.8 at 20 C. IDENTICAL to wine - a molecule property, medium-independent" }
  provenance:
    source: "Ethyl-acetate Henry's-law solubility constant temperature dependence d(ln kH)/d(1/T) ~ 5300-5700 K (NIST Chemistry WebBook / Sander compilation, doi:10.5194/acp-15-4399-2015) => dissolution enthalpy ~ -46 kJ/mol => gas/liquid partition rises with T with effective enthalpy ~ +45 kJ/mol"
    conditions: "ethyl acetate, gas/liquid (air/water) partition; van't Hoff form anchored at T_ref = 293.15 K"
    notes: "IDENTICAL to the wine value (45,000 J/mol) by design: the ethyl-acetate gas/liquid partition is a property of the MOLECULE, the same in beer and wine (Morakul 2011). It is the PHYSICAL stripping T-lever (Q10 ~ 1.8) that replaced D-20's fudged E_a_ester_volatil. The wine/beer ester direction comes from synthesis E_a_esters (beer steep / wine flat), NOT this. Same NIST/Sander sourcing + Morakul-ethanol-term simplification as wine_generic.yaml (see there). SPECULATIVE tier (simplification + abs-value transfer), though the enthalpy is sourced."

# -- Typical acetic-acid level, read by the ester equilibrium (D-176) ------------------------------
# The BEER counterpart of wine_generic.yaml's acetic_acid_typical, and the reason D-176 exists:
# before it, EthylAcetateEsterification drove beer's ethyl acetate toward a WINE equilibrium
# (51 mg/L, 2.15x the published beer mean) funded from a Byp pool beer starts at exactly 0 with no
# producer, which drove that pool negative and the reported pH to 10.5.
acetic_acid_typical:
  value: 0.0835
  unit: "g/L"   # acetic acid of a finished ale
  tier: speculative
  uncertainty: { low: 0.012, high: 0.155, note: "BOTH EDGES PRINTED. IARC Monographs, 'Chemical Composition of Alcoholic Beverages, Additives and Contaminants' (NCBI Bookshelf NBK531662) sect. 3.2.c: 'Acetic acid is the most abundant, occurring at 12-155 mg/l in ales, 22-107 mg/l in lagers and 30-35 mg/l in stouts.' This file is the generic ALE file (see its header), so the ALE range is the band verbatim; the lager and stout ranges both sit inside it. The VALUE is the arithmetic midpoint of that printed range and is AUTHOR-CONSTRUCTED -- no source prints a typical-ale acetic, so the nominal is a construction and the EDGES are the sourced content (feedback-pin-the-band-not-the-nominal)." }
  provenance:
    source: "IARC Monographs, 'Chemical Composition of Alcoholic Beverages, Additives and Contaminants', NCBI Bookshelf NBK531662, sect. 3.2.c (volatile acids): '12-155 mg/l in ales'. Value = (12 + 155)/2 = 83.5 mg/L, the midpoint of the printed ale range."
    conditions: "finished ale, packaged; total acetic acid. NOT a sour/wild beer -- those run into the g/L and are outside this band."
    notes: "D-176. Read ONLY by EthylAcetateEsterification, as a ratio against acetic_ref_ester_eq (aging.yaml). DELIBERATELY NOT Wang, Frank & Steinhaus 2024 (J. Agric. Food Chem., 'Molecular Insights into the Aroma Difference between Beer and Wine') Table 1's 311 mg/L: that is an arithmetic mean over a 32-study survey that includes sour/wild beers whose acetic runs into the g/L, so it is a survey mean and not a typical-beer level. It is worth recording WHY it is tempting -- Wang's Table 1 also gives beer ethyl acetate 23.7 mg/L, and Berthelot-scaling the wine anchor by Wang's OWN acetic reproduces 21.5 mg/L, agreeing with Wang's own observed value to 10%. Two beverages, one Berthelot constant, 10% agreement: that is evidence the RATE LAW transfers, which is what licenses D-176's coupling. It is NOT evidence for 311 as a nominal, because both of Wang's means are inflated together by the same sour-beer tail, which is exactly why their ratio survives. The style-resolved IARC ranges are the right anchor for a generic ale."

# -- Wort aeration: the dissolved oxygen a pitched wort carries, and its fate (D-213) -------------
# Beer's `o2` slot existed from D-71 but NOTHING seeded it, so a beer ferment ran at exactly
# 0.000 mg/L dissolved oxygen from pitch to package -- the one thing every real brewery
# deliberately puts INTO the wort. D-212 section 3a found this while pricing an early-acetic
# candidate and recorded it as an unseeded driver; these two entries close that gap.
#
# SCOPE, stated here because the temptation is in the same source sentence: this is the O2
# STATE and its removal, NOT a coupling to growth. Craft Beers says more aeration grows more
# yeast, and that is true, but beer's `mu_max` was calibrated one beat earlier (D-211) and a
# second growth limitation would re-open it. Deliberately declined -- see D-213.

o2_wort_aeration_beer:
  value: 6.75
  unit: "mg/L"   # dissolved O2 in the cast wort at pitching, BEFORE the yeast strips it
  tier: plausible
  uncertainty: { low: 5.5, high: 8.0, note: "BOTH EDGES PRINTED, and they are the source's own aeration norm rather than a read tolerance: 'the aerated cast wort should have an oxygen concentration of 5.5 to 8.0 mg/L'. The VALUE is the arithmetic midpoint of that printed range and is AUTHOR-CONSTRUCTED -- the source prints a range for the norm and no single typical figure, so the EDGES are the sourced content and the nominal is a construction (feedback-pin-the-band-not-the-nominal). The same passage's '4.5 to 6 mg O2/L wort is required for CCVs to ferment and mature more quickly' is a REQUIREMENT floor for a different vessel geometry, NOT a second reading of this quantity, and it is deliberately not blended into this band -- crossing two readings of one printed passage into a wider band is the units-fork error (D-209)." }
  provenance:
    source: "Craft Beers: Fortification, Processing, and Production -- 'according to general norms, the aerated cast wort should have an oxygen concentration of 5.5 to 8.0 mg/L (12%) at a maximum oxygen saturation of 60 to 80% with air'."
    conditions: "aerated cast wort at pitching, air (not pure O2) saturation 60-80%; generic ale. This is the level at t=0, not a sustained supply -- nothing re-aerates in this model."
    notes: "SINGLE SOURCE and recorded as such: one trade text's 'general norms'. The magnitude is uncontroversial (air-saturated water at ale temperatures is ~8-9 mg/L, so 5.5-8.0 is 60-80% of saturation exactly as the passage states, which is an internal consistency check the band passes on its own arithmetic). Tier is `plausible` rather than `validated` because it is a printed norm, not a measurement of a specific ferment, and rather than `speculative` because it is a named printed range and not an author estimate. The SAME passage carries six directional predictions -- more aeration gives more growth, more intense fermentation, less residual nitrogen, a faster pH drop, more acetaldehyde and VDK precursors, more esters and higher alcohols -- and NONE of them is reachable in the default set today, because this O2 feeds nothing (D-213). That is a scoped limitation, not an oversight; the pair (level + directions) is what makes the next beat well-posed."

k_o2_uptake_beer:
  value: 0.5
  unit: "L/(g*h)"   # first-order in dissolved O2, proportional to the biomass PRESENT
  tier: speculative
  uncertainty: { low: 0.2, high: 2.0, note: "AUTHOR ESTIMATE, banded to span the sourced qualitative timescale rather than a measurement. At the 1.0 g/L pitch of the D-180/D-211 reference wort the pool's e-folding time is 1/(k*X) = 2.0 h at the nominal, 5.0 h at the low edge and 0.5 h at the high -- so the whole band puts practical exhaustion inside the 'several hours' lag the sources describe, which is the only property anything depends on. NOTHING OBSERVABLE MOVES ACROSS THIS BAND (D-213 pins it): the O2 pool feeds no default Process, so k sets only WHEN a slot that nothing reads reaches zero. It is banded honestly rather than pinned so that a later beat which DOES read the pool inherits a real uncertainty instead of a false constant." }
  provenance:
    source: "author estimate. The FATE is multiply sourced -- dissolved O2 is consumed for sterol and unsaturated-fatty-acid biosynthesis, needed for new membranes during cell division (Concise Encyclopedia; Handbook of Enology Vol 1 sect. 1; Concepts in Wine Chemistry; Biology Of Microorganisms On Grapes, In Must And In Wine) -- and the TIMESCALE is sourced qualitatively: 'the dissolved oxygen in beer rapidly disappears' (The Chemistry of Beer) and 'pitched brewing yeast will normally take several hours to adapt to its new environment before growth begins ... known as the lag phase' (ibid.), which is the window in which the yeast rebuilds its sterol store. The RATE CONSTANT itself is sourced by nothing."
    conditions: "generic ale yeast, pitched wort, 15 degC; no temperature dependence (see notes)."
    notes: "THE FORM IS FIRST-ORDER IN O2 AND PROPORTIONAL TO THE BIOMASS PRESENT, NOT TO GROWTH, AND THAT IS THE DELIBERATE CHOICE. A growth-coupled form was considered and rejected on TIMING: the fate the sources describe is membrane synthesis for cell division, which invites `y * dX/dt`, but the sources equally say the O2 disappears during the LAG PHASE -- i.e. BEFORE growth. Sizing a growth-coupled yield from yeast sterol content (~1% of dry weight, ~12 mol O2 per mol ergosterol => ~0.010 g O2/g X) empties the pool at ~26 h against this model's own growth curve, which contradicts 'rapidly disappears'. Yeast absorbs O2 and lays down sterol AHEAD of dividing, so biomass PRESENT is the right driver and biomass FORMED is not. A second consequence is worth stating: because this Process does not recompute the growth rate, it is NOT a target of beer's growth Arrhenius modifier, unlike AceticAcidOverflow (D-183) which is -- the coupling that would otherwise be a silent correctness bug. NO temperature dependence is modelled: an Arrhenius term here would be a second unsourced constant governing the timing of a slot nothing reads."
