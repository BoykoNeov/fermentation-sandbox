# Generic ale-yeast kinetic parameters (S. cerevisiae, top-fermenting ale strain).
#
# SOURCED (Milestone 1 parameter task). It is HONESTLY THINNER than the wine
# file: the published beer models are structurally further from ours than
# Coleman's wine model is. The keystone open-access source is
#
#   Zamudio Lara, J. M., Dewasme, L., Hernandez Escoto, H., & Vande Wouwer, A.
#   (2022). "Parameter Estimation of Dynamic Beer Fermentation Models."
#   Foods 11(22): 3602. doi:10.3390/foods11223602  (CC-BY; ale fermentation,
#   Grainfather pilot plant, 17-26 C). Tables 5 and 6 are read directly.
#
# Secondary structural reference (Arrhenius form, sequential sugar uptake,
# n=1 ethanol wall) is de Andres-Toro et al. 1998, "A kinetic model for beer
# production under industrial operational conditions," Math. Comput. Simul.
# 48(1):65-74, doi:10.1016/S0378-4754(98)00147-5. Its numeric parameter table is
# paywalled and was NOT read in-source; values attributed to it below are flagged.
#
# Caveats baked into the tiers: (a) Zamudio's growth is Droop-like
# (mu = mu_max(1 - S_min/S)) and de Andres-Toro's is Monod-on-SUGAR; our growth
# is Monod-on-nitrogen, so values transfer by magnitude, not by identity.
# (b) Beer wort has real FAN (~150-250 mg N/L) so N-limited growth is defensible,
# but no cited beer model fits a nitrogen constant - K_n is transferred from the
# wine fit. (c) M1 runs are isothermal at 20 C, so the Arrhenius E_a's have NO
# effect on the benchmark (f = 1 at T_ref); they are Tier-2 readiness only.
#
# Conditions throughout: generic ale yeast, ~12-15 Plato wort, isothermal ~20 C.

# -- Growth (Monod, nitrogen-limited) -----------------------------------------

mu_max:
  value: 0.058
  unit: "1/h"
  tier: plausible
  uncertainty: { low: 0.053, high: 0.075, note: "four-strain spread of Tyrell Fig. 4's cell counts at the NOMINAL E_a_growth, RE-CONSTRUCTED at D-222 at Tyrell's own counted pitch (bisected to 2e-4); E_a's own band rides E_a" }
  provenance:
    source: "Derived from Tyrell 2013 (BrewingScience 66:76-83) Fig. 4, cell-count panel; form and T-scaling from Zamudio Lara et al. 2022, Foods 11(22):3602, Table 5"
    doi: "10.3390/foods11223602"
    conditions: "generic brewing yeast, 12 degP Pilsener malt wort, EBC tubes, isothermal 15 C; reported at T_ref = 20 C via E_a_growth"
    notes: "RE-DERIVED at D-211, MEASURED against Tyrell 2013 Fig. 4's cell-count panel - the same figure and the same EBC-tube trial whose pH panel is beer's pH anchor (D-207/208/209). Transcribed at D-211: pitch 9.96e6/mL, four-strain envelope 15.10-19.77 at day 1, 27.07-32.13 at day 2, peak 29.06-34.69 at day 3. Least squares on the normalised growth fraction at days 1-2 gives 0.034/h; the prior 0.098/h was 2.88x too fast and had the crop at its ceiling by day 1 where the real one was ~34 % grown. The model's nitrogen-limited multiplication (2.75x) already sat near the measured 2.92-3.48x, so the EXTENT was right and only the RATE was wrong -- D-222 CORRECTS THAT SENTENCE: it was measured at the fitted 1.0 g/L pitch, and the fold is what a pitch SETS. At Tyrell's own counted 0.3984 g/L the nitrogen-limited ceiling is unchanged in ABSOLUTE terms (dX = YAN/biomass_N_fraction = 1.75 g/L either way, the growth is nitrogen-limited) so the multiplication is 5.39x, 1.55x ABOVE the measured envelope's high edge. The extent agreement was an artefact of an inoculum 2.51x too heavy, and no growth RATE can repair it: mu_max sets WHEN the ceiling is reached, not WHERE it is. WHY the prior value was high: 0.098 is Zamudio's regression at 20 C (0.40*ln(20) - 1.1) transferred by MAGNITUDE from a Droop growth form (mu = mu_max(1 - S_min/S)) into our Monod-on-nitrogen form, and the two deliver differently - Monod-on-N with K_n = 0.0088 g/L against a 0.2 g/L wort runs at 0.958*mu_max for the whole growth phase, while Zamudio's Droop factor decays toward zero as S -> S_min. D-15 corrected the SAME transfer on the sugar side (q_sugar_max 1.5 -> 0.5, a factor 3.0) and the growth side was never re-run. That the measured factor here is 2.88x is SUGGESTIVE, not a derivation: Zamudio's realised-vs-peak growth ratio was never computed from their own data, and a rough estimate of their Droop factor over a ferment gives ~2-2.5x, so the mechanism is right and the near-equality of the two factors may be partly coincidence. Wine's mu_max (0.095/h, same species, same T_ref) is now 2.8x higher and that is NOT an inconsistency to harmonise: Coleman fitted Monod-on-N DIRECTLY (see tests/test_coleman_reconstruction.py, which reconstructs those curves with this same functional form), so wine's value never went through a Droop transfer. Band edges are CONSTRUCTED: the mu that keep days 1 and 2 inside the four-strain spread at the NOMINAL E_a_growth (E_a's own uncertainty rides E_a, or it would be double-counted - both are drawn). The retired band 0.03-0.21 was a 17-26 C temperature range, which double-counted the axis the Arrhenius modifier already carries; the narrowing is 7.00x -> 1.29x and it removed the FAST end only (the slow edge is unmoved), which is a real change to every beer ensemble because mu_max is drawn. The band spans a verdict change on beer's pH course - 7 of Tyrell's 8 days inside at the low edge, 8 at the high - so an arm at the high edge scores differently from the nominal by design. NOT identifiable against E_a_growth on one temperature: at 15 C only the product mu_max*f(15 C) is observable, and E_a = 205 kJ/mol reproduces the same counts from the OLD mu_max. That arm was rejected because it is 3.2x outside E_a's own band and takes the 10 C attenuation from 12.50 d to 17.71 d; the shipped arm also worsens 10 C, 12.50 -> 13.75 d, and neither number is Speers' midpoint statistic, so neither scores against D-63's 2.1 d. Confronting the strongest defence of the old behaviour: The Chemistry of Beer states healthy fermentations consume 'many of the primary amino acids (Class I) within the first 20 hours' - which is the model's own retired timescale, and is precisely the error, because this model has ONE lumped nitrogen pool and was applying the FASTEST class's timescale to all of it. Scope: Tyrell does not state whether trial strains 6/7/15/31 are top- or bottom-fermenting and this file is nominally ale yeast - accepted because the archive already anchors beer's pH on this trial, and splitting the rate and the pH across two datasets would be worse. The 1.0 g/L pitch against Tyrell's 9.96e6 cells/mL implies ~100 pg dry weight per cell; the fold agreement is therefore weaker corroboration than it looks, and it is the NORMALISED comparison that carries the timing result. D-218 recorded that the archive shipped two conversions 5.6x apart (wine at ~18 pg, beer at ~100) and that the choice between them decided sec 2.2's acceptance window. D-219 SETTLES IT AT 40 pg/cell AND NEITHER OLD READING SURVIVES. The value is not a literature pick: Coleman, Fish & Block 2007 state verbatim that 'each cell count was converted to grams per liter of cell mass, assuming that each cell weighs 4 x 10^-11 g', so every gram in the paper this engine's wine growth/death/yield parameters are fitted to is a hemacytometer count times 4e-11 g. It is the DEFINITION of the engine's biomass gram, corroborated independently at 34.9 pg by inverting Coleman's yield to cells-per-gram-nitrogen and pricing it with the Roels elemental N fraction (see fermentation/units/convert.py). CONSEQUENCE FOR THIS FILE, ACTED ON AT D-222 (D-219 measured it and left it): TYRELL_SCENARIO now carries Tyrell's own counted pitch, 0.3984 g/L = 9.96e6 cells/mL through cells_per_ml_to_pitch_gpl, where it carried 1.0 g/L - 2.51x the biomass Tyrell pitched. THIS VALUE IS THE REFIT AT THAT PITCH, by D-211's method unchanged (least squares on the peak-normalised growth fraction at days 1 and 2 of the same panel): 0.034 -> 0.058 /h, a factor 1.71, with the band RE-CONSTRUCTED the same way (0.053-0.075, bisected). The refit is not a free repair and its residual says so: SSE 0.00202 against 0.00050 at the fitted pitch, because a 5.39x modelled fold and a measured 3.2x fold have different normalised SHAPES - the extent error above is what that residual is made of. What the refit BUYS BACK, both measured: the nitrogen drawn by 24 h returns to 0.298 (inside Tyrell's 0.234-0.448 spread; it is 0.145 and outside if the pitch moves alone), and beer's pH course returns to 7 of Tyrell's 8 days inside (5 of 8 if the pitch moves alone). D-219's price list was measured WITHOUT the refit and therefore OVERSTATED the cost. What it does NOT buy back, and what now ships as visible rather than hidden: the day-2 extract shortfall goes 2.81x -> 4.21x and day 7 attenuates 0.782 of the fermentable extract against a measured 0.997 (it was 0.931 at the excess pitch), so the engine is slow against Tyrell's ENDPOINT too and not only its early limb; and D-211's pinned day-1 pH miss goes +0.070 -> +0.172 above the envelope, still on the alkaline side (it is +0.426 if the pitch moves alone). Sec 2.2's criterion shares this parameter and moves 9.000 -> 8.500 d at its own 15 C (D-221), still outside 5-7 and still a strict xfail. NOT ENTERED at D-222 and inherited by whatever beat takes beer's rate: Tyrell's wort YAN is an ASSUMPTION (200 mg/L; the paper prints none - the wort is a dilution of Bavarian Pilsener malt extract and the strains' amino-acid profile is 'data not shown'), and Tyrell's own counted growth of 0.877 g/L at 40 pg/cell implies only 87-113 mg/L of nitrogen reaching suspended biomass at this file's biomass_N_fraction. That is the extent gap stated as its own quantity; it is not repaired here because nothing sources it."

K_s:
  value: 5.0
  unit: "g/L"
  tier: speculative
  uncertainty: { low: 0.5, high: 25.0, note: "Monod half-saturation for sugar in the GROWTH term" }
  provenance:
    source: "author estimate"
    conditions: "generic ale yeast, placeholder"
    notes: "No cited beer model fits a separate growth-stage sugar half-saturation (de Andres-Toro folds sugar activation into one Monod term; Zamudio uses a Droop S_min threshold of ~13 g/L instead). Kept as a speculative co-limitation guard, mirroring the wine file."

K_n:
  value: 0.0088
  unit: "g/L"
  tier: speculative
  uncertainty: { low: 0.003, high: 0.03, note: "half-saturation for YAN; transferred from the wine fit" }
  provenance:
    source: "author estimate (transferred from Coleman 2007 wine K_N, doi:10.1128/aem.00670-07)"
    conditions: "generic ale yeast; yeast-level nitrogen affinity assumed medium-independent"
    notes: "The cited beer models (de Andres-Toro, Zamudio) use sugar-limited not nitrogen-limited growth, so no beer-specific K_n exists. Our growth Process is Monod-on-N (medium-agnostic code), so a value is required; we transfer the wine yeast value. Speculative because it is transferred, not beer-sourced."

# -- Fermentative sugar uptake (Michaelis-Menten, biomass-catalysed) -----------

q_sugar_max:
  value: 0.72
  unit: "g/g/h"
  tier: speculative
  uncertainty: { low: 0.634, high: 0.818, note: "RE-DERIVED at D-223 and CONSTRUCTED as the UNION over both axes the fit has: three strains x two readings of the same figure. Per strain, bisected to that strain's own 15 C crossing at this file's mu_max and Foster's counted pitch - geometric-deceleration reading (the one the nominal ships from) Vermont Ale 0.634, Cali Ale 0.733, Kolsch 0.814; LINEAR reading 0.678 / 0.755 / 0.818. The edges are therefore held by DIFFERENT things and that is deliberate: the low edge 0.634 is Vermont Ale on the geometric reading, the most-extrapolated crossing of the six, and the high edge 0.818 is Kolsch on the linear reading, the least-extrapolated. Folding the fork into the strain spread would have hidden it, since per strain the fork is worth 0.4 % (Kolsch) to 6.4 % (Vermont) - not a constant offset. WHAT THIS BAND DOES NOT HOLD, said plainly: the growth-coupled to decoupled translation uncertainty the retired 0.3-1.5 existed for (that transfer no longer sources the value at all), and the per-cell dry-mass conversion (D-219 settled 4e-11 g/cell as the DEFINITION of this engine's biomass gram, not an estimate with a range). The narrowing is 4.0x -> 1.29x and this parameter is DRAWN, so it is a real change to every beer ensemble and not only to the nominal" }
  provenance:
    source: "Fitted to Foster et al. 2022, Front. Microbiol. 13:747546, Supplementary Fig. S1 - the three Beer 1 ale controls (Cali Ale, Vermont Ale, Kolsch) at 15 C; retired derivation from Zamudio Lara et al. 2022 (doi:10.3390/foods11223602) Table 5 kept in the notes"
    doi: "10.3389/fmicb.2022.747546"
    conditions: "ale yeast, 12.5 degP wort, counted pitch 1.2e7 cells/mL = 0.48 g/L at the settled 40 pg/cell (D-219), isothermal 15 C, target 1.010 apparent"
    notes: "RE-ANCHORED at D-223 from a magnitude TRANSFER to a measured COURSE, and this is where beer's two speed anchors were adjudicated. RETIRED DERIVATION, kept because it explains the old value: Zamudio Lara 2022's uptake is growth-COUPLED (dS/dt = -k_S*mu_X*X with a Droop mu_X = mu_max*(1 - S_min/S) that is sub-maximal and DECLINES as sugar falls toward S_min ~ 13 g/L), so k_S*mu_max = 15.3*0.098 = 1.5 g/g/h is only the growth-coupled PEAK, reached transiently and never sustained. Our uptake is DECOUPLED (q*X*S/(K+S): all biomass catalytic, no mu factor), so 0.5 was the realised specific rate a factor ~3 below that peak. That was a magnitude transfer between two different rate laws, never a fit to any measured beer extract course, and D-15 picked it by making sec 2.2's benchmark pass - in the 20 C frame D-221 has since RETIRED. THE ANCHOR THAT WON AND THE ONE THAT LOST. Beer carried two speed anchors in conflict from D-216 to D-222. (a) Tyrell 2013's day-2 extract fraction (0.594) demands q = 2.3226 at Tyrell's own counted pitch, which is 1.55x this parameter's OWN printed high edge, so it is inadmissible before the second anchor is consulted at all (D-222 sec 4); and D-216 sec 4's SHAPE objection is untouched - the rate that matches day 2 overshoots days 1 and 3, so the early-limb defect was never a level. (b) Foster 2022's measured 15 C course and the handoff's own 5-7 d acceptance window AGREE: every rate reproducing one lands inside the other. This value is (b), and the adjudication is D-223. WHAT IT IS FITTED TO, precisely: Foster's Supplementary Fig. S1 recovered at 720 points (D-220), the three Beer 1 ale controls at 15 C, each bisected to its own crossing of 1.010 apparent at Foster's counted pitch (1.2e7 cells/mL = 0.48 g/L at the settled 40 pg/cell) and at this file's mu_max - Vermont Ale 0.634, Cali Ale 0.733, Kolsch 0.814, strain mean 0.7194, shipped rounded to 0.72. 15 C is chosen over a joint fit across Foster's eight temperatures ON PURPOSE: D-220 sec 4 found the engine ~1.5x slow at every temperature below 30 C with the 30 C agreement a crossing of two errors, so a multi-temperature fit would absorb a temperature-RESPONSE defect into a rate constant. It is also the one temperature BOTH anchors sit at - Tyrell's trial, and sec 2.2's criterion since D-221 re-temperatured it. TWO READINGS OF THE SAME FIGURE, and the loser is named rather than averaged in. Cali's and Vermont's 15 C crossings fall past the 120 h end of Foster's run, so both are extrapolations. A LINEAR continuation (D-220's transcription) gives strain mean 0.7453; a GEOMETRIC-DECELERATION continuation (D-221 sec 1, which reproduces D-220's linear numbers exactly before diverging) gives 0.7194. The geometric reading SHIPS, because a decelerating tail extrapolated linearly reaches the target too early, and because it is the reading generous to the model - it demands the SMALLER change. The two are 3.5 % apart and both put sec 2.2 inside its window. Kolsch, whose crossing is essentially AT the sampling end, is where the two readings agree to 0.013 d. TIER STAYS speculative, DELIBERATELY. The fit is to a digitised figure, extrapolated past its own sampling window, through a per-cell dry-mass conversion - a thinner chain than the printed cell counts mu_max is fitted to. Raising the tier would raise every beer output tier that combines through this parameter, and nothing here earns that. WHAT THE MOVE BUYS AND WHAT IT COSTS, all measured at Tyrell's counted pitch. BUYS: sec 2.2's criterion 8.50 -> 6.04 d at the shipped 0.72 (6.08 at the unrounded strain mean 0.7194), INSIDE the 5-7 d window - and inside at BOTH band edges too, 6.79 -> 5.42 d for the first time since D-221 re-temperatured it, so the benchmark's strict xfail becomes a passing test; Foster's own 15 C course reproduced by construction; and Tyrell's day-7 attenuation 0.782 -> 0.958 of the fermentable extract against a measured 0.997, so the LOSING anchor's endpoint improves substantially too. COSTS: Tyrell's day-2 fraction 0.141 -> 0.188 is still 3.17x short (was 4.21x), so D-215's extract xfail STAYS xfail. NOT MOVED, and measured rather than assumed: beer's pH course holds at 7 of 8 days inside Tyrell's envelope, the nitrogen drawn by 24 h is unmoved at 0.298, the biomass fold moves 5.385 -> 5.378 and the time to peak biomass not at all - growth here is nitrogen-limited and does not read this constant, which is also why mu_max needed no re-fit. THE BAND NARROWED 4.0x -> 1.29x AND IT IS DRAWN, so this is a real change to every beer ensemble, not only to the nominal. The retired 0.3-1.5 spanned the realised-to-peak translation uncertainty of a rate-law transfer that no longer applies; what replaces it is a biological spread across three strains of one measured trial."

K_sugar_uptake:
  value: 12.0
  unit: "g/L"
  tier: plausible
  uncertainty: { low: 6.0, high: 18.0, note: "Michaelis-Menten constant for sugar; Zamudio CV 9%" }
  provenance:
    source: "Zamudio Lara et al. 2022, Foods 11(22):3602, Table 6 (K_S)"
    doi: "10.3390/foods11223602"
    conditions: "ale yeast, Grainfather pilot plant; sugar half-saturation of the CO2-based model"
    notes: "Directly fitted K_S = 12.0 g/L (coefficient of variation 9%). Close to Coleman's wine value (10.3 g/L), as expected for S. cerevisiae sugar transport."

K_repression:
  value: 2.0
  unit: "g/L"
  tier: speculative
  uncertainty: { low: 0.5, high: 5.0, note: "more-preferred-sugar conc. at half catabolite repression" }
  provenance:
    source: "author estimate"
    conditions: "ale wort sequential uptake (glucose > maltose > maltotriose)"
    notes: "Smooth catabolite repression of the higher sugars while a more-preferred one remains. The functional form matches the Gee & Ramirez repression factors K'_G/(K'_G+G) and K'_M/(K'_M+M) (see de Andres-Toro/Gee-Ramirez reviews), but their numeric constants were not accessible in-source, so the value stays an author estimate."

Y_ethanol_sugar:
  value: 0.46
  unit: "g/g"
  tier: plausible
  uncertainty: { low: 0.40, high: 0.48, note: "realised yield below 0.511 theoretical" }
  provenance:
    source: "Gay-Lussac stoichiometry; corroborated by Zamudio Lara et al. 2022 (doi:10.3390/foods11223602)"
    conditions: "ale fermentation; realised ethanol per sugar"
    notes: "Theoretical max 0.511 g/g. Zamudio Table 5 gives k_E/k_S = 6.31/15.3 = 0.41 g/g for their ale (low end, partly reflecting ~12 g/L residual sugar). NOT read directly: uptake uses the theoretical Gay-Lussac split, and beer carries ZERO byproduct diversion in M1 (see below), so beer's realised yield stays theoretical and its CO2 benchmark is unchanged. Documented cross-check only."

# -- Realised-yield byproduct diversion (decision D-16) ------------------------
# Beer also makes glycerol (~1-2 g/L) and minor byproducts, but quantifying them
# is out of M1 scope and the beer benchmarks (attenuation timescale, CO2 ratio) do
# not gate on absolute ethanol. So both diversion yields are held at ZERO: beer
# uses the pure theoretical Gay-Lussac split and the Gly/Byp pools stay empty. They
# are present (not omitted) because the shared uptake Process declares them in
# `reads`; a value is required for every medium (D-1, no silent default).

Y_glycerol_sugar:
  value: 0.0
  unit: "g/g"
  tier: speculative
  uncertainty: { low: 0.0, high: 0.02, note: "ale glycerol ~1-2 g/L if modelled; held at 0 for M1" }
  provenance:
    source: "author estimate (held at zero for M1)"
    conditions: "generic ale yeast; glycerol diversion deliberately not modelled in M1"
    notes: "Set to 0 so beer ferments by the pure theoretical split (decision D-16). Real ale glycerol is ~1-2 g/L, lower than wine; quantifying it is deferred. Zero keeps the beer attenuation and CO2-ratio benchmarks exactly as validated under the theoretical yields."

Y_byproduct_sugar:
  value: 0.0
  unit: "g/g"
  tier: speculative
  uncertainty: { low: 0.0, high: 0.02, note: "minor ale byproducts; held at 0 for M1" }
  provenance:
    source: "author estimate (held at zero for M1)"
    conditions: "generic ale yeast; minor-byproduct diversion deliberately not modelled in M1"
    notes: "Set to 0 (decision D-16): beer's minor byproducts are out of M1 scope and no beer benchmark gates on absolute ethanol. Present because the shared uptake Process requires it in `reads`."

# -- Ethanol inhibition (Luong wall on the uptake flux, decision D-10) ----------

ethanol_tolerance:
  value: 90.0
  unit: "g/L"
  tier: speculative
  uncertainty: { low: 70.0, high: 100.0, note: "~9-12.7% ABV; ale yeasts are far less tolerant than wine" }
  provenance:
    source: "author estimate (generic ale yeast alcohol tolerance ~11-12% ABV)"
    conditions: "generic top-fermenting ale strain"
    notes: "Read by EthanolInhibition as the wall E_max. A 1.048 OG wort attenuates to only ~5% ABV (~40 g/L ethanol), well below tolerance, so for the M1 beer benchmark this term is essentially non-limiting. de Andres-Toro instead tie the wall to stoichiometry (E_max = 0.5*S0); we keep a fixed strain tolerance for parity with the wine file. Speculative: no specific strain sourced."

k_d2_ethanol_tolerance_death:
  value: 1.0e-3
  unit: "(g/L)^-2 h^-1"   # Phi = k_d2 * max(E - E_tol, 0)^2 has units 1/h
  tier: speculative
  uncertainty: { low: 1.0e-4, high: 3.0e-2, note: "transferred from the wine value; beer high-gravity sticking is not benchmarked in M1" }
  provenance:
    source: "author estimate (transferred from the wine k_d2); tolerance-gated quadratic FORM after Schenk et al. 2014 (arXiv:1412.6068)"
    conditions: "generic ale yeast; read by EthanolToleranceDeath as the curvature of the super-linear death past ethanol_tolerance (decision D-129). WHERE the ceiling sits is ethanol_tolerance (90 g/L); k_d2 sets only how sharply a very-high-gravity beer arrests"
    notes: "Phi(E) = k_d2 * max(E - ethanol_tolerance, 0)^2 [1/h] extra specific death, X->X_dead within the Coleman death mechanism (D-13-compatible). A normal beer attenuates to ~40 g/L ethanol (~5% ABV), far below the 90 g/L tolerance, so this term is EXACTLY zero (byte-for-byte the Coleman-only core) on every M1 beer; it only bites on a very-high-gravity beer pushed past ~11.4% ABV. Value transferred from wine (1.0e-3), unbenchmarked for beer - speculative. See D-129 for the wine sweep receipts."

ethanol_inhibition_exponent:
  value: 2.0
  unit: "dimensionless"
  tier: speculative
  uncertainty: { low: 1.0, high: 3.0, note: "Levenspiel/Luong toxic-power exponent; Luong's MEASURED production value is gamma~1 (linear), the low end here" }
  provenance:
    source: "n=2 is our numerical smoothing choice; the measured anchor is Luong 1985 (Biotechnol. Bioeng. 27:280), production law nu/nu_max = [1 - E/P'm]^gamma with gamma~1 (linear)"
    conditions: "generic ale yeast; EthanolInhibition scales the UPTAKE (= production) flux, so Luong's PRODUCTION exponent gamma~1 applies (not his growth alpha~0.8)"
    notes: "Exponent n in f = (1 - E/E_max)^n. Luong 1985 measures the true production exponent as gamma~1 (linear); de Andres-Toro et al. 1998 use exactly that n=1 wall (f = 1 - E/(0.5*S0)) for beer. We deviate upward to n=2 for a C1-smooth touchdown (f'(E_max)=0, no BDF kink). Value 2.0 is our numerical choice, not Luong's - speculative. INERT in the shipped core (EthanolInhibition unwired, D-13); provenance upgrade only (D-128)."

# -- Ethanol-driven cell inactivation (the timescale brake, decision D-13) -----
# Read by EthanolInactivation (moves mass X -> X_dead). Beer barely reaches its
# tolerance (~7% ABV vs wine's ~17%), so this term is far less load-bearing for
# the beer benchmark than the uptake rate is; beer's pace is set by q_sugar_max.

k_prime_d:
  value: 4.28e-5
  unit: "(g/L)^-1 h^-1"
  tier: speculative
  uncertainty: { low: 3.0e-5, high: 4.4e-4, note: "transferred from the Coleman wine fit; ale-specific value not sourced" }
  provenance:
    source: "author estimate (transferred from Coleman 2007 wine k'_d, doi:10.1128/aem.00670-07, Table A2 at 20 C)"
    conditions: "generic ale yeast; ethanol inactivation assumed yeast-generic at the species level"
    notes: "No cited beer model fits an ethanol-driven inactivation constant of our form (de Andres-Toro use a stoichiometric ethanol wall instead), so we transfer the verifiable Coleman wine value (k'_d(20 C) = 4.28e-5; see the wine file for the Table A2 a1 typo correction). Speculative because transferred, not beer-sourced. Largely inert for the M1 beer benchmark: a 1.048 OG wort makes only ~55 g/L ethanol, where k_d = 2.4e-3/h gives a viable-cell half-life of ~290 h - a negligible tail brake, not the dominant control (q_sugar_max sets beer's pace)."

