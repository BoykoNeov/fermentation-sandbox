name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      # --group ui installs the console's own dependencies (streamlit, plotly).
      # Without them mypy still checks app/ (files = src, tests, app) but with the
      # library absent -- st.stop() loses its NoReturn, every post-guard narrowing
      # collapses, and 44 phantom errors land on green code. The app's ~48 guards
      # also self-skip via importorskip, so CI would test none of the console.
      - name: Install dependencies
        run: uv sync --group ui --python ${{ matrix.python-version }}

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Type check (mypy)
        run: uv run mypy

      - name: Decisions index is current
        run: uv run python tools/gen_decisions_toc.py --check

      - name: Test (pytest)
        run: uv run pytest -n auto -q
